# Publishes this repository as a static site on GitHub Pages.
#
# The whole tracked tree is served as-is: index.html at the root, the two lab
# workbooks with their 47 demo extracts, the learner page, the trainer profile,
# both .pptx decks. Nothing is built, nothing is generated, no external dependency.
#
# `enablement: true` asks actions/configure-pages to turn Pages on by itself. It
# cannot: creating a Pages site is a repository-administration operation, and the
# GITHUB_TOKEN a workflow runs under can never administer the repository, whatever
# scopes are declared below. GitHub closed that deliberately
# (actions/configure-pages issue 40). Until Pages has been switched on once by
# hand, this workflow fails at the "Set up Pages" step — a red run here means that
# one setting is still off, not that anything in the tree is wrong.
#
#   Settings -> Pages -> Build and deployment -> Source -> GitHub Actions
#
# The step then passes on its own. Re-run the workflow from the Actions tab, or
# push to main, and the site appears at https://joel-sun.github.io/IIOE/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The checkout carries the repository's own object store, which holds the
      # same 249 MB of media a second time. Drop it before uploading: the site
      # artifact only needs the working tree.
      - name: Drop the object store from the artifact
        run: rm -rf .git

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
