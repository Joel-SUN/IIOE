ind a rusty metal pillar and peers out, the camera whips quickly to follow his gaze, adding to the sense of urgency and danger. Dust particles float in the air, illuminated by the harsh sunlight. The unstable, frantic camera work immerses the viewer directly into his high-stress survival situation. Realistic sweat and dirt details, dramatic atmosphere, high contrast. Cinematic look, muted vintage color palette, photorealistic, 8k detail."},{"label":{"fr":"Vue aérienne","en":"Aerial / Drone"},"src":"../lab/assets/demos/media/slide37_2.mp4","poster":"../lab/assets/demos/posters/slide37_2.jpg","sec":8.2,"prompt":"An epic aerial drone shot of a young European man with blonde hair, wearing a heavy black hooded parka, standing alone on the vast black sand beach of Iceland. Massive white waves from the North Atlantic crash violently against the shore behind him. Camera: High-altitude bird's-eye view descending and slowly orbiting. The camera starts from a top-down perspective, capturing the stark contrast between the black sand, the white foam, and his dark figure. It then gradually descends while performing a slow orbital movement, transitioning to a dramatic high-angle shot that reveals the endless coastline and distant glaciers. The wind whips at his jacket, emphasizing the raw power of nature. Highly detailed textures, photorealistic, majestic atmosphere. Cinematic look, wide-angle lens, cool tones, volumetric fog, 8k resolution."},{"label":{"fr":"Panoramique filé","en":"Whip Pan"},"src":"../lab/assets/demos/media/slide37_3.mp4","poster":"../lab/assets/demos/posters/slide37_3.jpg","sec":8.2,"prompt":"A high-energy rock concert in a crowded underground bar with dim, flashing stage lights. A young European man with long messy hair and a leather vest is passionately playing an electric guitar on stage, sweat dripping down his face. Camera: Fast whip pan to the right. The camera starts tightly focused on the guitarist's intense expression and shredding fingers, then rapidly whips horizontally to the right, creating a heavy motion blur streak that seamlessly transitions to reveal the drummer smashing the cymbals next to him. The extreme speed of the pan injects raw power and chaotic energy into the scene, perfectly matching the rhythm of the music. Photorealistic skin texture, dramatic atmosphere, highly detailed stage smoke and lighting. Cinematic look, 35mm film stock, high contrast, vibrant neon tones, film grain texture."},{"label":{"fr":"Bascule de mise au point","en":"Rack Focus"},"src":"../lab/assets/demos/media/slide37_4.mp4","poster":"../lab/assets/demos/posters/slide37_4.jpg","sec":8.1,"prompt":"A cinematic medium close-up of a young European couple standing under a narrow wooden shelter during a heavy rainstorm. The man, with short brown hair and a wet wool coat, stands in the foreground on the left, looking intently towards the right. The woman, with long blonde hair and a red scarf, stands slightly behind him on the right, initially out of focus. Camera: Slow and emotional rack focus. The camera remains static. The shot begins with sharp focus on the man's determined eyes as he turns his head slightly. Then, the focus smoothly shifts across the frame to reveal the woman's face coming into crystal-clear detail. She meets his gaze with a shy, tentative smile, her cheeks flushed from the cold. The background is filled with soft, blurred raindrops and gray mist. Highly detailed skin texture, photorealistic, romantic tension. Cinematic look, 35mm film stock, muted cool tones, extremely shallow depth of field, natural overcast lighting."}]}],"15":[{"title":{"fr":"Les trois façons de segmenter, écrites","en":"The three ways to segment, written out"},"lead":{"fr":"La même scène de café découpée en trois plans, une fois par méthode. Remarquez ce que chaque format contrôle : le sens, le rythme, ou la continuité.","en":"The same café scene cut into three shots, once per method. Notice what each format controls: meaning, timing, or continuity."},"items":[{"label":{"fr":"Méthode A — segments en langage naturel","en":"Method A — natural-language segments"},"prompt":"Shot 1: \"Medium shot, café interior. A man in a trench coat sits by the window looking down at his phone. Camera slowly dollies in from the front to a hand close-up. Warm amber lighting, shallow depth of field.\" Shot 2: \"Extreme close-up, the phone screen fills the frame. POV perspective, a message notification appears. A finger slides in from the right to tap the screen.\" Shot 3: \"Reverse shot, low angle looking up at his face. He slowly raises his head, the corner of his mouth lifts slightly.\""},{"label":{"fr":"Méthode B — horodatages","en":"Method B — timecodes"},"prompt":"[00:00–00:03] Medium shot, café interior. Man gazes at phone. Camera: slow dolly in. SFX: rain on window. [00:03–00:05] ECU phone screen, POV. Message notification. SFX: soft tap."},{"label":{"fr":"Méthode C — ancre de style","en":"Method C — style anchor"},"prompt":"Cinematic look, film grain, warm tones, shallow depth of field, natural light."}]},{"title":{"fr":"Sept raccords, sept effets","en":"Seven cuts, seven effects"},"lead":{"fr":"Chaque extrait est un raccord rédigé en une seule phrase. Le raccord n'est pas une décoration : c'est lui qui porte la continuité du récit entre deux plans générés séparément.","en":"Each clip is a cut written as a single sentence. A cut is not decoration: it is what carries the continuity of the story between two separately generated shots."},"items":[{"label":{"fr":"Champ et contrechamp","en":"Shot and reverse shot"},"src":"../lab/assets/demos/media/slide45.mp4","poster":"../lab/assets/demos/posters/slide45.jpg","sec":5.2,"prompt":"Over-the-shoulder shot from behind woman looking toward man; reverse, from behind man looking back at woman"},{"label":{"fr":"Suivi puis révélation","en":"Follow then reveal"},"src":"../lab/assets/demos/media/slide46.mp4","poster":"../lab/assets/demos/posters/slide46.jpg","sec":8.1,"prompt":"Tracking shot from behind through a corridor, the door opens — bright light floods in, revealing a snow-capped mountain"},{"label":{"fr":"Plongée verticale vers l'intérieur","en":"Vertical descent into the interior"},"src":"../lab/assets/demos/media/slide47.mp4","poster":"../lab/assets/demos/posters/slide47.jpg","sec":8.1,"prompt":"Bird's-eye view of a dome, camera descends vertically and penetrates into the interior"},{"label":{"fr":"Transition par reflet","en":"Reflection transition"},"src":"../lab/assets/demos/media/slide48.mp4","poster":"../lab/assets/demos/posters/slide48.jpg","sec":8.1,"prompt":"Close-up of a water surface reflection, pushing in → the image flips 180° into the normal perspective"},{"label":{"fr":"Panoramique fouetté","en":"Whip pan"},"src":"../lab/assets/demos/media/slide49.mp4","poster":"../lab/assets/demos/posters/slide49.jpg","sec":5.2,"prompt":"The subject snaps their head — camera whips horizontally, the image smears into color streaks, then decelerates into a crisp new scene"},{"label":{"fr":"Récit par changement de point","en":"Storytelling by rack focus"},"src":"../lab/assets/demos/media/slide50.mp4","poster":"../lab/assets/demos/posters/slide50.jpg","sec":8.1,"prompt":"Foreground letter in focus / background figure blurred, focus slowly shifts — figure sharpens, letter dissolves into bokeh"},{"label":{"fr":"Ellipse temporelle par coupes","en":"Time ellipsis through cuts"},"src":"../lab/assets/demos/media/slide51.mp4","poster":"../lab/assets/demos/posters/slide51.jpg","sec":8.1,"prompt":"Locked camera, rapid jump cuts of the subject's posture: reading (day) → chin resting (dusk) → eye rubbing (night)"}]}]}};

const $ = (id) => document.getElementById(id);
const au = $('au');
const el = {
  frame: $('frame'), img: $('slideImg'), card: $('titleCard'),
  caption: $('caption'), captionText: $('captionText'),
  play: $('playBtn'), playIcon: $('playIcon'), prev: $('prevBtn'), next: $('nextBtn'),
  scrub: $('scrub'), now: $('timeNow'), all: $('timeAll'),
  rate: $('rate'), cc: $('ccBtn'), fs: $('fsBtn'), auto: $('autoBtn'),
  steps: $('steps'), count: $('stepCount'), trBody: $('trBody'), trMeta: $('trMeta'),
  demos: $('demos'), dHead: $('dHead'), dMeta: $('dMeta'), dBody: $('dBody'),
};

const ICON_PLAY = 'M4 2l10 6-10 6z';
const ICON_PAUSE = 'M3 2h4v12H3zM9 2h4v12H9z';

let lang = 'fr';
let T = UI.fr;
let steps = [];        // [{title,durationSec,audio,image?,cues,transcript,label}]
let cur = 0;
let cueIdx = -1;
let captions = true;
let advanceTimer = 0;
let scrubbing = false;

const mmss = (s) => {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, '0')}`;
};

function buildSteps(d) {
  const out = [{
    title: T.welcome, label: '00',
    durationSec: d.welcome.durationSec, audio: d.welcome.audio,
    cues: d.welcome.cues, transcript: d.welcome.transcript, image: null,
  }];
  d.slides.forEach((s) => out.push({
    title: s.title, label: String(s.n).padStart(2, '0'),
    durationSec: s.durationSec, audio: s.audio, image: s.image,
    cues: s.cues, transcript: s.transcript,
  }));
  return out;
}

function demosFor(label) {
  const groups = DEMOS.slides[String(Number(label))] || [];
  let clips = 0;
  groups.forEach((g) => g.items.forEach((it) => { if (it.src) clips++; }));
  return { groups, clips };
}

function renderSteps() {
  el.steps.textContent = '';
  steps.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'step';
    b.dataset.i = String(i);
    b.setAttribute('aria-current', i === cur ? 'true' : 'false');
    const n = document.createElement('span');
    n.className = 'step-n';
    n.textContent = s.label;
    const t = document.createElement('span');
    t.className = 'step-t';
    t.append(document.createTextNode(s.title));
    const d = demosFor(s.label);
    if (d.clips) {
      const x = document.createElement('span');
      x.className = 'step-x';
      x.textContent = T.stepDemos(d.clips);
      x.title = T.stepDemosTitle(d.clips);
      t.appendChild(x);
    }
    const dd = document.createElement('span');
    dd.className = 'step-d';
    dd.textContent = mmss(s.durationSec);
    b.append(n, t, dd);
    b.addEventListener('click', () => goto(i, true));
    el.steps.appendChild(b);
  });
  el.count.textContent = T.stepCount(cur + 1, steps.length);
}

function renderTranscript() {
  const s = steps[cur];
  el.trBody.textContent = '';
  cueIdx = -1;
  s.cues.forEach((c, i) => {
    const p = document.createElement('p');
    p.className = 'cue';
    p.dataset.i = String(i);
    const t = document.createElement('span');
    t.textContent = mmss(c[0]);
    p.append(t, document.createTextNode(c[2]));
    p.addEventListener('click', () => { au.currentTime = c[0] + 0.01; if (au.paused) au.play(); });
    el.trBody.appendChild(p);
  });
  el.trMeta.innerHTML = T.trMeta(s.cues.length, s.transcript.length, mmss(s.durationSec));
  $('trHead').textContent = `${T.trHead} — ${s.title}`;
}

function demoCard(it) {
  const card = document.createElement('div');
  card.className = it.src ? 'dcard' : 'dcard dtext';

  if (it.src) {
    const v = document.createElement('video');
    // Muted on purpose: every clip carries an unprompted machine-generated audio bed that
    // must not compete with the narration. controls stays on, so a learner can unmute it.
    v.controls = true; v.playsInline = true; v.preload = 'none'; v.muted = true;
    v.poster = it.poster;
    v.setAttribute('aria-label', it.label[lang]);
    const src = document.createElement('source');
    src.src = it.src; src.type = 'video/mp4';
    v.appendChild(src);
    card.appendChild(v);
  }

  const foot = document.createElement('div');
  foot.className = 'dfoot';

  const lab = document.createElement('p');
  lab.className = 'dlabel';
  lab.append(document.createTextNode(it.label[lang]));
  if (it.sec) {
    const sp = document.createElement('span');
    sp.className = 'dsec';
    // The separator lives in the text, not in a margin, so a screen reader
    // hears "Centred composition · 5.2 s" rather than the two glued together.
    sp.textContent = ' · ' + it.sec.toFixed(1) + ' s';
    lab.appendChild(sp);
  }
  foot.appendChild(lab);

  const bp = document.createElement('p');
  bp.className = 'dprompt';
  bp.textContent = it.prompt;
  foot.appendChild(bp);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'dcopy';
  btn.textContent = T.copyPrompt;
  btn.addEventListener('click', async () => {
    const flash = (msg) => {
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = T.copyPrompt; }, 1600);
    };
    try {
      await navigator.clipboard.writeText(it.prompt);
      flash(T.copied);
    } catch {
      const r = document.createRange();
      r.selectNodeContents(bp);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      flash(T.copySelected);
    }
  });
  foot.appendChild(btn);

  card.appendChild(foot);
  return card;
}

function renderDemos() {
  const { groups, clips: vids } = demosFor(steps[cur].label);
  el.dBody.querySelectorAll('video').forEach((v) => v.pause());
  el.dBody.textContent = '';

  if (!groups.length) { el.demos.hidden = true; return; }

  let proms = 0;
  groups.forEach((g) => { proms += g.items.length; });
  el.demos.hidden = false;
  el.dHead.textContent = `${T.demosTitle} — ${T.slideWord} ${Number(steps[cur].label)}`;
  el.dMeta.textContent = T.demoMeta(vids, proms);
  $('dNote').textContent = DEMOS.note[lang];
  $('dDisclaim').textContent = DEMOS.disclaimer[lang];

  groups.forEach((g) => {
    const box = document.createElement('div');
    box.className = 'dgroup';
    const h3 = document.createElement('h3');
    h3.textContent = g.title[lang];
    box.appendChild(h3);
    if (g.lead) {
      const p = document.createElement('p');
      p.className = 'dlead';
      p.textContent = g.lead[lang];
      box.appendChild(p);
    }
    const grid = document.createElement('div');
    grid.className = g.items.length === 1 ? 'dgrid one' : 'dgrid';
    g.items.forEach((it) => grid.appendChild(demoCard(it)));
    box.appendChild(grid);
    el.dBody.appendChild(box);
  });
}

function paintCaption(t) {
  const s = steps[cur];
  if (!captions || !s.cues.length) { el.caption.hidden = true; return; }
  let i = 0;
  while (i < s.cues.length && s.cues[i][1] <= t) i++;
  const hit = i < s.cues.length && t >= s.cues[i][0] ? i : -1;
  if (hit !== cueIdx) {
    cueIdx = hit;
    if (hit < 0) {
      el.caption.hidden = true;
    } else {
      el.caption.hidden = false;
      el.captionText.textContent = s.cues[hit][2];
    }
    const prev = el.trBody.querySelector('.cue.on');
    if (prev) prev.classList.remove('on');
    if (hit >= 0) {
      const node = el.trBody.querySelector(`.cue[data-i="${hit}"]`);
      if (node) {
        node.classList.add('on');
        const box = el.trBody.getBoundingClientRect(), nb = node.getBoundingClientRect();
        if (nb.top < box.top || nb.bottom > box.bottom) {
          el.trBody.scrollTop += nb.top - box.top - el.trBody.clientHeight / 2 + nb.height / 2;
        }
      }
    }
  }
}

function setPlayIcon(playing) {
  el.playIcon.firstElementChild.setAttribute('d', playing ? ICON_PAUSE : ICON_PLAY);
  el.play.title = playing ? T.pause : T.play;
  $('playLbl').textContent = playing ? T.pause : T.play;
}

function load(autoplay) {
  const s = steps[cur];
  clearTimeout(advanceTimer);
  cueIdx = -1;
  el.caption.hidden = true;

  if (s.image) {
    el.img.hidden = false;
    el.card.hidden = true;
    if (el.img.getAttribute('src') !== s.image) el.img.setAttribute('src', s.image);
    el.img.alt = `${T.slideWord} ${Number(s.label)} — ${s.title}`;
  } else {
    el.img.hidden = true;
    el.img.removeAttribute('src');
    el.card.hidden = false;
  }

  au.src = s.audio;
  au.load();
  el.all.textContent = mmss(s.durationSec);
  el.now.textContent = '0:00';
  el.scrub.value = '0';
  setPlayIcon(false);
  renderSteps();
  renderTranscript();
  renderDemos();
  el.prev.disabled = cur === 0;
  el.next.disabled = cur === steps.length - 1;
  document.title = `${s.label === '00' ? T.welcome : T.slideWord + ' ' + Number(s.label)} — ${T.docTitle}`;
  if (autoplay) au.play().catch(() => setPlayIcon(false));
}

function goto(i, autoplay) {
  cur = Math.max(0, Math.min(steps.length - 1, i));
  load(autoplay);
  const node = el.steps.querySelector(`.step[data-i="${cur}"]`);
  if (node) node.scrollIntoView({ block: 'nearest' });
}

function applyLang(next) {
  const wasPlaying = !au.paused;
  const keep = cur;
  lang = next;
  T = UI[next];
  const d = DATA[next];
  document.documentElement.lang = T.htmlLang;
  document.documentElement.dataset.lang = next;
  document.querySelectorAll('#langSwitch button').forEach((b) => {
    b.setAttribute('aria-pressed', b.dataset.setlang === next ? 'true' : 'false');
  });
  $('eyebrow').textContent = T.eyebrow;
  $('courseTitle').textContent = T.tcTitle;
  $('tcEyebrow').textContent = T.eyebrow;
  $('tcTitle').textContent = T.tcTitle;
  $('tcLede').textContent = T.tcLede;
  $('tcPres').innerHTML = T.tcPres;
  $('tcNote').textContent = T.tcNote;
  $('stepsLbl').textContent = T.steps;
  $('prevLbl').textContent = T.prev;
  $('nextLbl').textContent = T.next;
  $('playLbl').textContent = T.play;
  $('autoLbl').textContent = T.auto;
  $('fsLbl').textContent = T.fs;
  el.prev.title = T.prev;
  el.next.title = T.next;
  el.cc.title = captions ? T.ccOn : T.ccOff;
  el.cc.textContent = T.cc;
  [...el.rate.options].forEach((o, i) => { o.textContent = T.rateOpts[i]; });
  el.steps.setAttribute('aria-label', T.steps);
  el.fs.title = T.fs;
  el.rate.setAttribute('aria-label', T.rate);
  el.scrub.setAttribute('aria-label', T.scrub);
  $('keysHdr').textContent = T.keysTitle;
  $('keys').textContent = '';
  T.keys.forEach(([k, v]) => {
    const d2 = document.createElement('div');
    const kb = document.createElement('kbd');
    kb.textContent = k;
    d2.append(kb, document.createTextNode(' ' + v));
    $('keys').appendChild(d2);
  });

  steps = buildSteps(d);
  $('provPara').innerHTML = T.prov(d.slides.length);
  $('dlPara').innerHTML = T.dl('assets/audio/' + next + '/course.m4a', 'assets/audio/' + next + '/course.srt');
  cur = Math.min(keep, steps.length - 1);
  load(wasPlaying);
  document.title = T.docTitle;
}

/* ---------- events ---------- */
au.addEventListener('play', () => setPlayIcon(true));
au.addEventListener('pause', () => setPlayIcon(false));
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  el.now.textContent = mmss(t);
  if (!scrubbing) el.scrub.value = String(au.duration ? Math.round((t / au.duration) * 1000) : 0);
  paintCaption(t);
});
au.addEventListener('loadedmetadata', () => {
  el.all.textContent = mmss(au.duration || steps[cur].durationSec);
});
au.addEventListener('ended', () => {
  setPlayIcon(false);
  if (!el.auto.checked || cur >= steps.length - 1) return;
  // 600 ms of silence between one slide and the next, so they do not run together.
  advanceTimer = setTimeout(() => goto(cur + 1, true), 600);
});
au.addEventListener('error', () => {
  cueIdx = -1;
  el.caption.hidden = false;
  el.captionText.textContent = T.audioMissing(steps[cur].audio);
});

el.play.addEventListener('click', () => { if (au.paused) au.play(); else au.pause(); });
el.prev.addEventListener('click', () => goto(cur - 1, !au.paused));
el.next.addEventListener('click', () => goto(cur + 1, !au.paused));
el.scrub.addEventListener('input', () => {
  scrubbing = true;
  if (au.duration) el.now.textContent = mmss((Number(el.scrub.value) / 1000) * au.duration);
});
el.scrub.addEventListener('change', () => {
  if (au.duration) au.currentTime = (Number(el.scrub.value) / 1000) * au.duration;
  scrubbing = false;
});
el.rate.addEventListener('change', () => { au.playbackRate = Number(el.rate.value); });
el.cc.addEventListener('click', () => {
  captions = !captions;
  el.cc.setAttribute('aria-pressed', captions ? 'true' : 'false');
  el.cc.title = captions ? T.ccOn : T.ccOff;
  if (!captions) { el.caption.hidden = true; cueIdx = -1; }
  else { cueIdx = -1; paintCaption(au.currentTime); }
});
el.fs.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else el.frame.requestFullscreen?.();
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  el.fs.setAttribute('aria-pressed', on ? 'true' : 'false');
  $('fsLbl').textContent = on ? T.fsExit : T.fs;
});
document.getElementById('langSwitch').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-setlang]');
  if (b && b.dataset.setlang !== lang) applyLang(b.dataset.setlang);
});

// Pause the other examples when one starts, so the side-by-side comparisons
// stay readable. 'play' does not bubble, hence the capture phase.
document.addEventListener('play', (e) => {
  const v = e.target;
  if (!el.dBody.contains(v)) return;
  el.dBody.querySelectorAll('video').forEach((o) => { if (o !== v) o.pause(); });
}, true);

document.addEventListener('keydown', (e) => {
  // 'video' is in the list so that Space and the arrows drive a focused demo
  // clip instead of the narration underneath it.
  if (e.target.matches?.('input,select,textarea,video')) return;
  const k = e.key;
  if (k === ' ' || k === 'k') { e.preventDefault(); if (au.paused) au.play(); else au.pause(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); au.currentTime = Math.max(0, au.currentTime - 5); }
  else if (k === 'ArrowRight') { e.preventDefault(); au.currentTime = Math.min(au.duration || 0, au.currentTime + 5); }
  else if (k === 'PageUp' || k === '[') { e.preventDefault(); goto(cur - 1, !au.paused); }
  else if (k === 'PageDown' || k === ']') { e.preventDefault(); goto(cur + 1, !au.paused); }
  else if (k === 'Home') { e.preventDefault(); goto(0, !au.paused); }
  else if (k === 'End') { e.preventDefault(); goto(steps.length - 1, !au.paused); }
  else if (k === 'c' || k === 'C') { el.cc.click(); }
  else if (k === 'f' || k === 'F') { el.fs.click(); }
});

/* ---------- boot ---------- */
const q = new URLSearchParams(location.search);
applyLang(q.get('lang') === 'en' ? 'en' : 'fr');
const startAt = Number(q.get('step'));
if (Number.isInteger(startAt) && startAt > 0) goto(Math.min(startAt, steps.length - 1), false);
})();
</script>
</body>
</html>
