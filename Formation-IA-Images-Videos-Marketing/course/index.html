<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA générative appliquée aux visuels marketing — lecteur de cours IIOE</title>
<style>
:root{
  --navy:#1F4D84;
  --blue:#0077D4;
  --tint:#EAF4FC;
  --mist:#F1F4F6;
  --ink:#212121;
  --sub:#4C5054;
  --mute:#7F888F;
  --line:#D5DADD;
  --panel:#F8FBFD;
  --white:#FFFFFF;
  --bar:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;color:var(--ink);background:var(--white);
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{margin:0;color:var(--navy);line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  min-height:var(--bar);padding:10px 24px;
  background:var(--navy);color:var(--white);
}
.topbar h1{color:var(--white);font-size:17px;font-weight:600;letter-spacing:-.1px}
.eyebrow{
  display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.4px;color:#B9CFE6;margin-bottom:2px;
}
.brand{flex:1 1 320px;min-width:0}
.langswitch{display:flex;gap:0;border:1px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden}
.langswitch button{
  padding:6px 14px;background:transparent;border:0;color:#D7E4F2;
  font-size:12.5px;font-weight:600;letter-spacing:.3px;
}
.langswitch button[aria-pressed="true"]{background:var(--white);color:var(--navy)}
.langswitch button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.14);color:var(--white)}

/* ---------- layout ---------- */
main{
  display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;
  max-width:1520px;margin:0 auto;padding:26px 24px 8px;align-items:start;
}
@media (max-width:1040px){
  main{grid-template-columns:minmax(0,1fr);padding:18px 16px 8px}
  .side{order:2}
}

/* ---------- stage ---------- */
.frame{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#0E2233;border:1px solid var(--line);border-radius:3px;
  overflow:hidden;container-type:inline-size;
}
.frame img{display:block;width:100%;height:100%;object-fit:contain;background:var(--white)}
.frame img[hidden]{display:none}
.frame:fullscreen{border:0;border-radius:0;background:#000}

/* The template reserves y 650-720 of 720 for subtitles, so captions sit in that
   same band rather than floating over the content. */
.caption{
  position:absolute;left:0;right:0;bottom:0;height:9.72%;
  display:flex;align-items:center;justify-content:center;
  padding:0 4cqw;background:rgba(248,251,253,.9);
  font-size:2.05cqw;line-height:1.25;color:var(--ink);text-align:center;
}
.caption[hidden]{display:none}
.caption span{max-width:88cqw}

/* ---------- title card (welcome step, which has no slide) ---------- */
.titlecard{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 7cqw;background:linear-gradient(160deg,#1F4D84 0%,#163A63 58%,#0E2947 100%);
  color:var(--white);
}
.titlecard[hidden]{display:none}
.tc-eyebrow{
  font-size:1.35cqw;font-weight:700;text-transform:uppercase;letter-spacing:.22em;
  color:#9FC0E0;margin-bottom:2.2cqw;
}
.tc-title{font-size:4.1cqw;font-weight:600;line-height:1.16;letter-spacing:-.01em;margin:0 0 1.8cqw}
.tc-lede{font-size:1.75cqw;line-height:1.55;color:#D5E4F3;max-width:74cqw;margin:0 0 3cqw}
.tc-rule{width:9cqw;height:.35cqw;background:var(--blue);margin-bottom:2.6cqw}
.tc-pres{font-size:1.5cqw;line-height:1.6;color:#C3D7EA}
.tc-pres b{color:var(--white);font-weight:600}
.tc-note{
  position:absolute;left:7cqw;bottom:12.5cqw;right:7cqw;
  font-size:1.2cqw;line-height:1.5;color:#8FAECD;
  border-left:.28cqw solid rgba(255,255,255,.28);padding-left:1.4cqw;
}

/* ---------- transport ---------- */
.transport{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
}
.tbtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;padding:0;flex:0 0 auto;
  background:var(--white);border:1px solid var(--line);border-radius:3px;color:var(--navy);
}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.tbtn:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--mute)}
.tbtn svg{width:15px;height:15px;fill:currentColor}
#playBtn{width:42px;height:42px;background:var(--navy);border-color:var(--navy);color:var(--white)}
#playBtn:hover{background:var(--blue);border-color:var(--blue);color:var(--white)}
#playBtn svg{width:17px;height:17px}
.tsep{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.time{font-size:12.5px;color:var(--sub);white-space:nowrap;flex:0 0 auto}
#scrub{flex:1 1 160px;min-width:120px;accent-color:var(--blue);height:22px}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  background:var(--white);border:1px solid var(--line);border-radius:3px;
  font-size:12.5px;color:var(--sub);white-space:nowrap;
}
.pill[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--tint);font-weight:600}
.pill:hover{border-color:var(--blue)}
select.pill{padding:4px 6px}
.spacer{flex:1 1 auto}

/* ---------- sidebar step list ---------- */
.side{position:sticky;top:calc(var(--bar) + 18px);max-height:calc(100vh - var(--bar) - 36px);display:flex;flex-direction:column}
.sidehead{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;
  color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;
}
#stepCount{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--sub);font-weight:600}
.steps{overflow-y:auto;flex:1 1 auto;margin:0 -6px;padding:0 6px 10px}
.step{
  display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:baseline;
  width:100%;padding:7px 9px;margin-bottom:2px;text-align:left;
  background:transparent;border:0;border-left:2px solid transparent;border-radius:2px;
}
.step:hover{background:var(--mist)}
.step[aria-current="true"]{background:var(--tint);border-left-color:var(--blue)}
.step-n{
  font-size:11px;font-weight:700;color:var(--mute);
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
.step[aria-current="true"] .step-n{color:var(--blue)}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.step[aria-current="true"] .step-t{color:var(--navy);font-weight:600}
.step-d{font-size:11.5px;color:var(--mute);white-space:nowrap}
.step-x{
  display:block;margin-top:2px;
  font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);
}
.step[aria-current="true"] .step-x{color:var(--blue)}

/* ---------- transcript ---------- */
.transcript{max-width:1520px;margin:0 auto;padding:22px 24px 10px}
.thead{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;
}
.thead h2{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--navy)}
.thead .tmeta{font-size:12.5px;color:var(--mute)}
#trBody{max-height:340px;overflow-y:auto;padding-right:8px}
.cue{
  padding:3px 10px;margin:0 -10px;border-radius:2px;
  font-size:14.5px;line-height:1.65;color:var(--sub);cursor:pointer;
}
.cue:hover{background:var(--mist)}
.cue.on{background:var(--tint);color:var(--ink);font-weight:600}
.cue span{color:var(--mute);font-size:11.5px;font-weight:400;margin-right:9px;font-variant-numeric:tabular-nums}

/* ---------- demos ---------- */
.demos{max-width:1520px;margin:0 auto;padding:22px 24px 10px}
.dhead{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;
}
.dhead h2{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--navy)}
.dhead .dmeta{font-size:12.5px;color:var(--mute)}
.dnote{font-size:12.8px;line-height:1.6;color:var(--sub);max-width:100ch;margin:0 0 16px}
.dgroup{margin:0 0 24px}
.dgroup h3{font-size:14.5px;font-weight:700;color:var(--ink);margin:0 0 5px}
.dlead{font-size:13px;line-height:1.55;color:var(--sub);margin:0 0 12px;max-width:96ch}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.dgrid.one{grid-template-columns:minmax(0,1fr);max-width:660px}
.dcard{min-width:0;border:1px solid var(--line);background:var(--white)}
.dcard video{display:block;width:100%;height:auto;background:#0E2233}
.dfoot{padding:10px 12px 12px}
.dlabel{font-size:13.5px;font-weight:600;color:var(--navy);line-height:1.4;margin:0 0 7px}
.dsec{font-size:11.5px;font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.dprompt{
  margin:0;padding:9px 11px;background:var(--panel);border:1px solid var(--line);
  font-size:12.8px;line-height:1.6;color:var(--sub);white-space:pre-line;
  max-height:130px;overflow-y:auto;
}
.dcard.dtext .dprompt{max-height:none}
.dcopy{
  margin-top:9px;font:inherit;font-size:11.5px;padding:3px 10px;cursor:pointer;
  background:var(--white);border:1px solid var(--line);border-radius:2px;color:var(--navy);
}
.dcopy:hover{background:var(--mist)}
@media(max-width:900px){.dgrid,.dgrid.one{grid-template-columns:minmax(0,1fr);max-width:none}}

/* ---------- footer ---------- */
footer{
  max-width:1520px;margin:0 auto;padding:20px 24px 40px;
  border-top:1px solid var(--line);margin-top:22px;
}
footer p{margin:0 0 7px;font-size:12.8px;color:var(--sub);max-width:100ch}
.mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:12px}
footer a{color:var(--navy);text-decoration:underline}
footer h2{margin:16px 0 7px;font-size:12.8px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
kbd{
  display:inline-block;padding:1px 5px;background:var(--white);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
  font-family:"Cascadia Mono",Consolas,monospace;font-size:11.5px;color:var(--sub);
}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--sub);margin:0}
.keys div{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="eyebrow" id="eyebrow">UNESCO-ICHEI · IIOE Online Engineering Courses</span>
    <h1 id="courseTitle">—</h1>
  </div>
  <div class="langswitch" role="group" id="langSwitch">
    <button type="button" data-setlang="fr" aria-pressed="true">Français</button>
    <button type="button" data-setlang="en" aria-pressed="false">English</button>
  </div>
</header>

<main>
  <section class="stagewrap">
    <div class="frame" id="frame">
      <img id="slideImg" alt="" hidden>
      <div class="titlecard" id="titleCard" hidden>
        <div class="tc-eyebrow" id="tcEyebrow"></div>
        <div class="tc-rule"></div>
        <h2 class="tc-title" id="tcTitle"></h2>
        <p class="tc-lede" id="tcLede"></p>
        <div class="tc-pres" id="tcPres"></div>
        <div class="tc-note" id="tcNote"></div>
      </div>
      <div class="caption" id="caption" hidden><span id="captionText"></span></div>
    </div>

    <div class="transport">
      <button type="button" class="tbtn" id="prevBtn" title="Étape précédente">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg>
        <span class="sr" id="prevLbl">Étape précédente</span>
      </button>
      <button type="button" class="tbtn" id="playBtn" title="Lecture">
        <svg viewBox="0 0 16 16" id="playIcon" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg>
        <span class="sr" id="playLbl">Lecture</span>
      </button>
      <button type="button" class="tbtn" id="nextBtn" title="Étape suivante">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2h2v12h-2zM2 2l8 6-8 6z"/></svg>
        <span class="sr" id="nextLbl">Étape suivante</span>
      </button>
      <div class="tsep"></div>
      <span class="time" id="timeNow">0:00</span>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0"
             aria-label="Position dans le segment">
      <span class="time" id="timeAll">0:00</span>
      <div class="tsep"></div>
      <select class="pill" id="rate" aria-label="Vitesse de lecture">
        <option value="0.75">0,75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option>
      </select>
      <button type="button" class="pill" id="ccBtn" aria-pressed="true">CC</button>
      <button type="button" class="pill" id="fsBtn" aria-pressed="false">
        <svg viewBox="0 0 16 16" style="width:13px;height:13px;fill:currentColor" aria-hidden="true"><path d="M2 2h5v2H4v3H2zM9 2h5v5h-2V4H9zM2 9h2v3h3v2H2zM12 12h-3v2h5V9h-2z"/></svg>
        <span id="fsLbl">Plein écran</span>
      </button>
      <span class="spacer"></span>
      <label class="pill" style="cursor:pointer">
        <input type="checkbox" id="autoBtn" checked style="accent-color:var(--blue)">
        <span id="autoLbl">Enchaîner</span>
      </label>
    </div>
  </section>

  <aside class="side">
    <div class="sidehead">
      <span id="stepsLbl">Étapes</span>
      <span id="stepCount">—</span>
    </div>
    <nav class="steps" id="steps" aria-label="Étapes du cours"></nav>
  </aside>
</main>

<section class="demos" id="demos" hidden>
  <div class="dhead">
    <h2 id="dHead">Démonstrations</h2>
    <span class="dmeta" id="dMeta"></span>
  </div>
  <p class="dnote" id="dNote"></p>
  <div id="dBody"></div>
  <p class="dnote" id="dDisclaim"></p>
</section>

<section class="transcript">
  <div class="thead">
    <h2 id="trHead">Transcription</h2>
    <span class="tmeta" id="trMeta"></span>
  </div>
  <div id="trBody"></div>
</section>

<footer>
  <p id="provPara"></p>
  <p id="dlPara"></p>
  <h2 id="keysHdr">Raccourcis</h2>
  <div class="keys" id="keys"></div>
</footer>

rits en anglais… parce que c'est la langue dans laquelle les modèles sont les plus précis. Tout le reste du cours est en français. Commençons !"},"slides":[{"n":1,"title":"Votre entreprise peut-elle produire ses propres images et vidéos ?","durationSec":40.03,"audio":"assets/audio/fr/slide-01.m4a","image":"assets/slides/fr/slide-01.png","cues":[[0.004,3.933,"Cette séance ne s'adresse ni aux designers… ni aux ingénieurs."],[3.933,8.559,"Rien de ce qui va suivre ne suppose que vous ayez déjà ouvert une caméra,"],[8.559,11.221,"un outil de création ou une ligne de code."],[11.221,14.517,"Avant d'enseigner quoi que ce soit… deux questions !"],[14.637,17.129,"Combien d'entre vous ont payé une agence ou"],[17.129,21.533,"un indépendant pour des visuels marketing au cours des douze derniers mois ?"],[21.533,24.372,"Pour la plupart d'entre vous, la réponse est oui."],[24.372,27.038,"Et combien d'entre vous ont attendu plus d'une"],[27.038,30.92,"semaine pour une seule retouche… un seul changement sur une image ?"],[31.04,32.755,"Gardez ces deux chiffres en tête."],[32.755,35.094,"En quarante-cinq minutes, je veux vous donner"],[35.094,37.329,"une méthode qui change les deux… et je veux"],[37.329,40.031,"être honnête avec vous sur ce qu'elle ne change pas."]],"transcript":"Cette séance ne s'adresse ni aux designers… ni aux ingénieurs. Rien de ce qui va suivre ne suppose que vous ayez déjà ouvert une caméra, un outil de création ou une ligne de code. Avant d'enseigner quoi que ce soit… deux questions ! Combien d'entre vous ont payé une agence ou un indépendant pour des visuels marketing au cours des douze derniers mois ? Pour la plupart d'entre vous, la réponse est oui. Et combien d'entre vous ont attendu plus d'une semaine pour une seule retouche… un seul changement sur une image ? Gardez ces deux chiffres en tête. En quarante-cinq minutes, je veux vous donner une méthode qui change les deux… et je veux être honnête avec vous sur ce qu'elle ne change pas."},{"n":2,"title":"Votre formateur","durationSec":40.52,"audio":"assets/audio/fr/slide-02.m4a","image":"assets/slides/fr/slide-02.png","cues":[[0.001,3.562,"Avant de vous donner cette méthode… permettez-moi de me présenter."],[3.562,4.911,"Je m'appelle Yuefeng SUN."],[4.911,7.555,"J'ai passé vingt ans à construire des plateformes"],[7.555,11.116,"de données et des architectures cloud pour de grandes entreprises."],[11.236,13.92,"Et pendant la plus grande partie de ces vingt ans,"],[13.92,16.228,"mon métier a été d'enseigner l'intelligence"],[16.228,18.482,"artificielle générative à ceux qui doivent"],[18.482,21.81,"s'en servir dans une entreprise… pas à ceux qui la fabriquent."],[21.81,26.104,"Des équipes marketing, des équipes commerce en ligne, des équipes communication."],[26.224,28.905,"Des gens qui n'ont ni designer, ni ingénieur…"],[28.905,31.706,"et qui doivent malgré tout publier lundi matin."],[31.706,35.34,"C'est très exactement pour eux que cette séance a été écrite."],[35.34,40.524,"Tout ce qui va suivre est donc construit pour vos contraintes… pas pour un laboratoire."]],"transcript":"Avant de vous donner cette méthode… permettez-moi de me présenter. Je m'appelle Yuefeng SUN. J'ai passé vingt ans à construire des plateformes de données et des architectures cloud pour de grandes entreprises. Et pendant la plus grande partie de ces vingt ans, mon métier a été d'enseigner l'intelligence artificielle générative à ceux qui doivent s'en servir dans une entreprise… pas à ceux qui la fabriquent. Des équipes marketing, des équipes commerce en ligne, des équipes communication. Des gens qui n'ont ni designer, ni ingénieur… et qui doivent malgré tout publier lundi matin. C'est très exactement pour eux que cette séance a été écrite. Tout ce qui va suivre est donc construit pour vos contraintes… pas pour un laboratoire."},{"n":3,"title":"Vous serez capable de :","durationSec":70.59,"audio":"assets/audio/fr/slide-03.m4a","image":"assets/slides/fr/slide-03.png","cues":[[0.004,4.009,"Alors… que serez-vous capable de faire à l'issue de cette séance ?"],[4.009,4.859,"Soyons précis."],[4.859,9.774,"Une promesse que vous pouvez vérifier vaut mieux qu'une promesse impressionnante."],[9.774,10.442,"Six choses."],[10.442,14.872,"Premièrement… vous rédigerez une instruction que le modèle peut exécuter."],[14.872,18.27,"Six éléments, dans l'ordre, sans rien laisser au hasard."],[18.39,22.122,"Deuxièmement… vous distinguerez le souhait du découpage technique,"],[22.122,24.835,"et vous saurez convertir n'importe quel adjectif"],[24.835,27.889,"en quelque chose qu'une caméra peut réellement filmer."],[27.889,30.603,"Troisièmement… vous choisirez la bonne capacité."],[30.603,34.956,"Verrouiller d'abord le sujet par une image fixe… puis le mettre en mouvement."],[35.076,39.825,"Quatrièmement… vous classerez chaque visuel dans l'un des trois niveaux de fidélité,"],[39.825,44.235,"et vous saurez quand une photographie réelle doit remplacer une image générée."],[44.235,48.588,"Cinquièmement… vous maintiendrez une marque cohérente sur toute une campagne,"],[48.588,50.793,"au lieu de la redécouvrir chaque matin."],[50.913,54.631,"Et sixièmement… vous publierez sans vous mettre en danger."],[54.631,57.26,"Les droits, la divulgation, et les quatre"],[57.26,62.196,"livrables qui transforment la compétence d'une personne en capacité d'équipe."],[62.196,64.697,"Une chose que cette séance ne fera pas."],[64.697,67.133,"Elle ne vous enseignera aucun produit."],[67.133,69.569,"Les outils changent tous les six mois."],[69.569,70.595,"La méthode, non."]],"transcript":"Alors… que serez-vous capable de faire à l'issue de cette séance ? Soyons précis. Une promesse que vous pouvez vérifier vaut mieux qu'une promesse impressionnante. Six choses. Premièrement… vous rédigerez une instruction que le modèle peut exécuter. Six éléments, dans l'ordre, sans rien laisser au hasard. Deuxièmement… vous distinguerez le souhait du découpage technique, et vous saurez convertir n'importe quel adjectif en quelque chose qu'une caméra peut réellement filmer. Troisièmement… vous choisirez la bonne capacité. Verrouiller d'abord le sujet par une image fixe… puis le mettre en mouvement. Quatrièmement… vous classerez chaque visuel dans l'un des trois niveaux de fidélité, et vous saurez quand une photographie réelle doit remplacer une image générée. Cinquièmement… vous maintiendrez une marque cohérente sur toute une campagne, au lieu de la redécouvrir chaque matin. Et sixièmement… vous publierez sans vous mettre en danger. Les droits, la divulgation, et les quatre livrables qui transforment la compétence d'une personne en capacité d'équipe. Une chose que cette séance ne fera pas. Elle ne vous enseignera aucun produit. Les outils changent tous les six mois. La méthode, non."},{"n":4,"title":"Le goulot d'étranglement du contenu marketing","durationSec":118.08,"audio":"assets/audio/fr/slide-04.m4a","image":"assets/slides/fr/slide-04.png","cues":[[0.005,2.928,"Nommons le problème précisément… car dire que"],[2.928,7.606,"l'intelligence artificielle va aider votre marketing n'est pas un plan !"],[7.606,10.594,"Il y a quatre pressions sur une petite équipe."],[10.594,12.153,"Une : le coût à l'unité."],[12.153,16.571,"Une seule photographie de produit, éclairée et retouchée, a un prix."],[16.691,20.363,"Une vidéo de dix secondes a un prix beaucoup plus élevé."],[20.363,24.297,"Multipliez maintenant par chacun des marchés où vous vendez."],[24.297,25.478,"Deux : les délais."],[25.478,29.609,"Le travail n'est pas lent parce que quelqu'un serait paresseux."],[29.609,32.691,"Il est lent parce qu'une commande doit voyager."],[32.811,37.736,"De vous à l'agence, au photographe, au retoucheur… puis retour à vous,"],[37.736,42.099,"puis tout le circuit une seconde fois pour une seule retouche."],[42.099,44.351,"Trois : le volume des variantes."],[44.471,47.897,"Le même produit exige un cadrage carré pour une plateforme,"],[47.897,50.161,"un cadrage vertical pour une autre, une"],[50.161,52.6,"surcouche textuelle différente pour chaque"],[52.6,55.62,"marché… et une version saisonnière deux fois par an."],[55.62,58.233,"L'idée créative est terminée depuis des mois."],[58.233,59.975,"Il ne reste que les variantes."],[60.095,63.29,"C'est le travail qui épuise le plus les équipes…"],[63.29,67.416,"et c'est précisément celui que la génération traite le mieux !"],[67.416,69.079,"Quatre : pas de designer."],[69.079,74.27,"Beaucoup d'entre vous n'ont personne en interne capable de produire une image."],[74.27,76.732,"Maintenant la promesse… et la limite."],[76.852,80.876,"Je la dirai une fois au début de la séance, et une fois à la fin."],[80.876,83.786,"L'intelligence artificielle générative supprime"],[83.786,86.448,"le goulot d'étranglement de la production !"],[86.448,88.863,"Elle ne supprime pas celui du jugement."],[88.863,91.153,"Fabriquer l'image devient bon marché."],[91.273,94.633,"Décider si l'image est vraie, si elle est conforme à la marque,"],[94.633,96.873,"si vous avez le droit de la publier, et si"],[96.873,100.713,"elle va induire un client en erreur… rien de cela ne devient moins cher."],[100.713,102.739,"Une partie devient même plus coûteuse,"],[102.739,107.486,"parce que vous pouvez désormais produire cent mauvaises décisions en un seul après-midi !"],[107.606,109.604,"Cette séance a donc deux moitiés."],[109.604,114.328,"La première est la méthode : comment faire faire au modèle ce que vous voulez."],[114.328,118.084,"La seconde est le jugement : comment ne pas vous blesser avec."]],"transcript":"Nommons le problème précisément… car dire que l'intelligence artificielle va aider votre marketing n'est pas un plan ! Il y a quatre pressions sur une petite équipe. Une : le coût à l'unité. Une seule photographie de produit, éclairée et retouchée, a un prix. Une vidéo de dix secondes a un prix beaucoup plus élevé. Multipliez maintenant par chacun des marchés où vous vendez. Deux : les délais. Le travail n'est pas lent parce que quelqu'un serait paresseux. Il est lent parce qu'une commande doit voyager. De vous à l'agence, au photographe, au retoucheur… puis retour à vous, puis tout le circuit une seconde fois pour une seule retouche. Trois : le volume des variantes. Le même produit exige un cadrage carré pour une plateforme, un cadrage vertical pour une autre, une surcouche textuelle différente pour chaque marché… et une version saisonnière deux fois par an. L'idée créative est terminée depuis des mois. Il ne reste que les variantes. C'est le travail qui épuise le plus les équipes… et c'est précisément celui que la génération traite le mieux ! Quatre : pas de designer. Beaucoup d'entre vous n'ont personne en interne capable de produire une image. Maintenant la promesse… et la limite. Je la dirai une fois au début de la séance, et une fois à la fin. L'intelligence artificielle générative supprime le goulot d'étranglement de la production ! Elle ne supprime pas celui du jugement. Fabriquer l'image devient bon marché. Décider si l'image est vraie, si elle est conforme à la marque, si vous avez le droit de la publier, et si elle va induire un client en erreur… rien de cela ne devient moins cher. Une partie devient même plus coûteuse, parce que vous pouvez désormais produire cent mauvaises décisions en un seul après-midi ! Cette séance a donc deux moitiés. La première est la méthode : comment faire faire au modèle ce que vous voulez. La seconde est le jugement : comment ne pas vous blesser avec."},{"n":5,"title":"Deux capacités : texte-vers-image et image-vers-vidéo","durationSec":108.83,"audio":"assets/audio/fr/slide-05.m4a","image":"assets/slides/fr/slide-05.png","cues":[[0.004,3.859,"D'abord… quatre termes que nous emploierons toute la séance."],[3.859,4.565,"Notez-les !"],[4.565,9.384,"L'intelligence artificielle générative est un système qui produit du texte,"],[9.384,14.653,"des images, de l'audio ou de la vidéo nouveaux… à partir d'une instruction écrite."],[14.653,18.765,"Un prompt, en français une invite, est cette instruction écrite."],[18.885,20.371,"C'est votre seul canal."],[20.371,23.668,"Il n'existe aucun autre moyen de parler au modèle !"],[23.668,28.839,"Texte-vers-image signifie : vous donnez des mots, le modèle rend une image fixe."],[28.839,31.619,"Image-vers-vidéo signifie : vous donnez une"],[31.619,35.239,"image fixe et des mots… et le modèle rend un plan animé."],[35.359,38.126,"L'image fixe ce qui se trouve dans le cadre."],[38.126,40.264,"Les mots disent ce qui lui arrive."],[40.264,44.856,"Il existe une troisième capacité, dont vous verrez la publicité partout :"],[44.856,45.925,"texte-vers-vidéo."],[45.925,48.881,"Les mots seuls, directement vers un plan animé."],[49.001,52.136,"Je ne vais pas vous l'enseigner comme méthode par défaut,"],[52.136,54.612,"et je veux vous expliquer pourquoi… car c'est"],[54.612,57.418,"la déception la plus fréquente de tout ce domaine !"],[57.418,61.709,"En texte-vers-vidéo, le modèle invente le sujet et le mouvement en même temps,"],[61.709,62.754,"à chaque tentative."],[62.754,65.779,"Le produit est donc légèrement différent à chaque fois."],[65.899,68.989,"Pour un artiste, cette variété est une qualité."],[68.989,72.605,"Pour une entreprise qui doit montrer le même emballage,"],[72.605,76.747,"dans le même linéaire, sur toute une campagne… c'est un défaut."],[76.747,79.705,"L'image-vers-vidéo sépare les deux problèmes."],[79.825,83.223,"Vous décidez du sujet une fois, vous le validez,"],[83.223,87.683,"puis vous générez le mouvement à partir de cette image validée."],[87.683,89.595,"Le sujet cesse de dériver !"],[89.595,91.152,"Donc : deux capacités."],[91.152,94.55,"Le texte-vers-image pour décider de l'apparence."],[94.55,97.878,"L'image-vers-vidéo pour la mettre en mouvement."],[97.998,100.568,"Tout le reste, aujourd'hui… est du détail."],[100.568,103.261,"Retenez cet ordre, car à la trente-cinquième"],[103.261,105.831,"minute je déroulerai un flux de production"],[105.831,108.83,"complet construit exactement sur ces deux étapes."]],"transcript":"D'abord… quatre termes que nous emploierons toute la séance. Notez-les ! L'intelligence artificielle générative est un système qui produit du texte, des images, de l'audio ou de la vidéo nouveaux… à partir d'une instruction écrite. Un prompt, en français une invite, est cette instruction écrite. C'est votre seul canal. Il n'existe aucun autre moyen de parler au modèle ! Texte-vers-image signifie : vous donnez des mots, le modèle rend une image fixe. Image-vers-vidéo signifie : vous donnez une image fixe et des mots… et le modèle rend un plan animé. L'image fixe ce qui se trouve dans le cadre. Les mots disent ce qui lui arrive. Il existe une troisième capacité, dont vous verrez la publicité partout : texte-vers-vidéo. Les mots seuls, directement vers un plan animé. Je ne vais pas vous l'enseigner comme méthode par défaut, et je veux vous expliquer pourquoi… car c'est la déception la plus fréquente de tout ce domaine ! En texte-vers-vidéo, le modèle invente le sujet et le mouvement en même temps, à chaque tentative. Le produit est donc légèrement différent à chaque fois. Pour un artiste, cette variété est une qualité. Pour une entreprise qui doit montrer le même emballage, dans le même linéaire, sur toute une campagne… c'est un défaut. L'image-vers-vidéo sépare les deux problèmes. Vous décidez du sujet une fois, vous le validez, puis vous générez le mouvement à partir de cette image validée. Le sujet cesse de dériver ! Donc : deux capacités. Le texte-vers-image pour décider de l'apparence. L'image-vers-vidéo pour la mettre en mouvement. Tout le reste, aujourd'hui… est du détail. Retenez cet ordre, car à la trente-cinquième minute je déroulerai un flux de production complet construit exactement sur ces deux étapes."},{"n":6,"title":"Le modèle ne devine pas","durationSec":78,"audio":"assets/audio/fr/slide-06.m4a","image":"assets/slides/fr/slide-06.png","cues":[[0,4.573,"Je veux vous prouver quelque chose… avant de vous enseigner quoi que ce soit."],[4.573,5.701,"Voici une commande."],[5.701,6.771,"Lisez-la avec moi."],[6.771,11.106,"Nous sommes une petite entreprise qui vend des textiles tissés à la main."],[11.106,13.957,"Il nous faut une image produit pour le catalogue"],[13.957,17.699,"export… et une vidéo de huit secondes pour les réseaux sociaux."],[17.819,20.866,"Nous n'avons ni photographe, ni studio, ni designer."],[20.866,24.442,"C'est une commande réelle, venue d'un type d'entreprise réel."],[24.442,28.603,"Regardons maintenant à quoi ressemble une première tentative ordinaire."],[28.603,33.819,"Je vais taper le prompt que la plupart des gens tapent… une phrase courte et raisonnable."],[33.939,38.407,"Et je vais la générer quatre fois, sans changer un seul caractère !"],[38.407,39.541,"Quatre résultats."],[39.541,40.541,"Les mêmes mots."],[40.541,43.475,"Un angle de caméra différent, à chaque fois."],[43.475,45.009,"Une lumière différente."],[45.009,47.21,"Une armure de tissage différente."],[47.21,51.411,"Sur deux d'entre eux, le produit n'est pas de la même couleur !"],[51.411,53.479,"Personne n'a fait d'erreur ici."],[53.599,54.611,"Rien n'est cassé."],[54.611,57.23,"L'outil a fonctionné exactement comme prévu."],[57.23,61.813,"Voici donc la règle… et c'est le premier de mes trois messages d'aujourd'hui."],[61.813,63.301,"Le modèle ne devine pas !"],[63.301,67.527,"Tout ce que vous laissez hors du prompt, le modèle le décide au hasard."],[67.527,72.289,"Une dimension non précisée n'est pas un neutre par défaut… c'est une délégation."],[72.409,75.004,"Vous avez remis cette décision à une machine,"],[75.004,78.002,"silencieusement, et vous ne vous en êtes pas aperçu."]],"transcript":"Je veux vous prouver quelque chose… avant de vous enseigner quoi que ce soit. Voici une commande. Lisez-la avec moi. Nous sommes une petite entreprise qui vend des textiles tissés à la main. Il nous faut une image produit pour le catalogue export… et une vidéo de huit secondes pour les réseaux sociaux. Nous n'avons ni photographe, ni studio, ni designer. C'est une commande réelle, venue d'un type d'entreprise réel. Regardons maintenant à quoi ressemble une première tentative ordinaire. Je vais taper le prompt que la plupart des gens tapent… une phrase courte et raisonnable. Et je vais la générer quatre fois, sans changer un seul caractère ! Quatre résultats. Les mêmes mots. Un angle de caméra différent, à chaque fois. Une lumière différente. Une armure de tissage différente. Sur deux d'entre eux, le produit n'est pas de la même couleur ! Personne n'a fait d'erreur ici. Rien n'est cassé. L'outil a fonctionné exactement comme prévu. Voici donc la règle… et c'est le premier de mes trois messages d'aujourd'hui. Le modèle ne devine pas ! Tout ce que vous laissez hors du prompt, le modèle le décide au hasard. Une dimension non précisée n'est pas un neutre par défaut… c'est une délégation. Vous avez remis cette décision à une machine, silencieusement, et vous ne vous en êtes pas aperçu."},{"n":7,"title":"Un prompt est un découpage technique, pas un souhait","durationSec":154.21,"audio":"assets/audio/fr/slide-07.m4a","image":"assets/slides/fr/slide-07.png","cues":[[0.002,1.324,"Corrigeons donc cela."],[1.324,3.968,"Et la correction n'est pas un mot magique…"],[3.968,8.06,"c'est un changement dans la nature de la phrase que vous écrivez."],[8.06,10.579,"La plupart des gens écrivent un souhait."],[10.579,14.041,"Une image produit textile élégante et de haute qualité,"],[14.041,17.126,"avec une atmosphère chaleureuse et haut de gamme."],[17.126,18.197,"C'est un souhait."],[18.317,21.448,"Cela décrit l'émotion que vous voulez donner au client."],[21.448,24.921,"Le problème, c'est qu'une caméra ne peut pas filmer élégant !"],[24.921,27.426,"Une caméra ne peut pas filmer haut de gamme."],[27.426,29.078,"Ces mots n'ont pas de pixels."],[29.198,31.935,"Ce dont le modèle a besoin, c'est d'un découpage"],[31.935,36.496,"technique… la description de ce que la caméra voit, et de ce que la caméra fait."],[36.496,38.72,"Voici le test que je veux vous laisser."],[38.72,43.852,"C'est une seule question, et elle fonctionne sur tous les prompts que vous écrirez jamais."],[43.972,48.703,"Pour chaque adjectif, demandez-vous : comment une caméra filme-t-elle cela ?"],[48.703,52.935,"Si vous ne savez pas répondre, l'adjectif n'est pas une instruction."],[52.935,57.478,"Remplacez-le par une action, une position de lumière, ou une composition."],[57.478,58.412,"Il est nerveux."],[58.412,60.964,"Comment une caméra filme-t-elle le nerf ?"],[61.084,65.095,"Il frotte son poignet avec le pouce, à plusieurs reprises."],[65.095,68.829,"Ses yeux vont trois fois vers la porte… et reviennent."],[68.829,69.935,"Elle est triste."],[69.935,71.319,"Elle baisse la tête."],[71.319,73.324,"Ses cils tremblent deux fois."],[73.324,76.574,"Une goutte d'eau glisse le long de sa mâchoire."],[76.574,78.442,"Une atmosphère oppressante."],[78.442,79.686,"Lumière zénithale."],[79.686,81.969,"Les orbites tombent dans l'ombre."],[82.089,84.699,"Les bords du cadre sont sous-exposés."],[84.699,86.252,"Le sujet ne bouge pas."],[86.252,87.804,"Qualité haut de gamme."],[87.804,90.415,"Celui-ci est le vôtre, en entreprise."],[90.415,92.037,"Lumière latérale douce."],[92.037,93.943,"Faible profondeur de champ."],[93.943,94.93,"Finition mate."],[94.93,96.483,"Travelling avant lent."],[96.483,98.952,"De l'espace vide autour du produit."],[98.952,101.351,"Digne de confiance et sympathique."],[101.351,103.186,"Caméra à hauteur des yeux."],[103.306,104.799,"Lumière frontale douce."],[104.799,108.37,"Le sujet fait face à la caméra et ne s'en détourne pas."],[108.37,111.551,"Remarquez ce qui s'est produit, dans chaque cas !"],[111.551,116.03,"L'adjectif a disparu… et un fait physique, filmable, a pris sa place."],[116.03,118.952,"La caméra a maintenant quelque chose à faire."],[119.072,124.566,"Je réécris notre commande textile en découpage technique, et je génère une fois."],[124.566,12 hoire. Une atmosphère oppressante. Lumière zénithale. Les orbites tombent dans l'ombre. Les bords du cadre sont sous-exposés. Le sujet ne bouge pas. Qualité haut de gamme. Celui-ci est le vôtre, en entreprise. Lumière latérale douce. Faible profondeur de champ. Finition mate. Travelling avant lent. De l'espace vide autour du produit. Digne de confiance et sympathique. Caméra à hauteur des yeux. Lumière frontale douce. Le sujet fait face à la caméra et ne s'en détourne pas. Remarquez ce qui s'est produit, dans chaque cas ! L'adjectif a disparu… et un fait physique, filmable, a pris sa place. La caméra a maintenant quelque chose à faire. Je réécris notre commande textile en découpage technique, et je génère une fois. Une seule tentative. Angle correct ! Lumière correcte ! L'armure du tissu est cohérente. Ce n'est pas parfait. Mais c'est dirigé ! Et c'est toute la différence. Chaque partie réussie l'est parce que je l'ai spécifiée… et chaque partie encore ratée, je peux désormais la nommer, donc la corriger. Voilà ce qu'un souhait ne vous donne pas. Un souhait ne vous offre aucune prise pour déboguer. Un découpage, si. Deuxième message du jour : un prompt est un découpage technique… pas un souhait !"},{"n":8,"title":"La formule à six éléments","durationSec":138.04,"audio":"assets/audio/fr/slide-08.m4a","image":"assets/slides/fr/slide-08.png","cues":[[0.005,2.151,"Voici maintenant la structure."],[2.151,3.081,"Six éléments."],[3.081,6.73,"C'est la méthode entière, et elle est transférable."],[6.73,9.591,"Elle n'appartient à aucun outil, et elle"],[9.591,13.956,"restera vraie quand vous changerez d'outil l'année prochaine."],[13.956,14.957,"Un : le sujet."],[14.957,17.104,"Qui ou quoi est dans le cadre."],[17.104,20.323,"Âge, apparence, vêtements, matière, finition."],[20.443,21.624,"Deux : l'action."],[21.624,22.658,"Ce qu'il fait."],[22.658,26.792,"Une action physique précise, plus un adverbe de vitesse."],[26.792,28.047,"Trois : le décor."],[28.047,28.933,"Où et quand."],[28.933,32.698,"Lieu, heure du jour, météo, accessoires importants."],[32.698,35.06,"Quatre : le mouvement de caméra."],[35.06,37.57,"Comment la caméra virtuelle bouge."],[37.57,42.886,"Le type de mouvement, plus le cadrage de départ et le cadrage d'arrivée."],[43.006,44.34,"Cinq : le style."],[44.34,45.091,"Le rendu."],[45.091,49.261,"Étalonnage, contraste, grain, profondeur de champ."],[49.261,50.429,"Six : l'audio."],[50.429,52.014,"Ce que l'on entend."],[52.014,56.852,"Ambiance, effets, musique… ou délibérément pas de musique."],[56.852,62.023,"Je pourrais maintenant vous dire quoi écrire dans chaque case."],[62.023,65.944,"C'est la façon la moins utile d'enseigner cela."],[66.064,68.647,"Je vais plutôt vous dire ce qui se passe quand"],[68.647,73.59,"vous omettez chacun d'eux… car c'est cela que vous reconnaîtrez dans vos propres essais."],[73.59,77.185,"Omettez le sujet, et le sujet est différent à chaque génération."],[77.185,79.657,"On ne construit pas une campagne là-dessus !"],[79.777,82.278,"Omettez l'action, et le cadre est figé,"],[82.278,86.703,"ou le mouvement est incontrôlé… et le modèle en invente un pour vous."],[86.703,89.845,"Omettez le décor, et vous obtenez un arrière-plan"],[89.845,92.731,"aléatoire qui n'appartient pas à votre sujet."],[92.731,96.131,"C'est de là que vient cet aspect flottant, sans lieu."],[96.251,100.24,"Omettez le mouvement de caméra, et vous obtenez une caméra fixe."],[100.24,100.551,"Plat."],[100.551,101.112,"Sans vie."],[101.112,104.104,"On dirait une vidéosurveillance d'un bel objet !"],[104.104,107.72,"Omettez le style, et vous obtenez l'étalonnage par défaut."],[107.84,110.398,"Et l'étalonnage par défaut, c'est ce rendu"],[110.398,113.261,"générique que tout le monde reconnaît désormais"],[113.261,116.246,"en moins d'une seconde… et qui fait bas de gamme."],[116.246,118.927,"Omettez l'audio, et vous obtenez le silence."],[118.927,121.972,"Ou pire : un son qui ne correspond pas à l'image !"],[121.972,126.176,"Les éléments quatre et cinq sont ceux que presque tout le monde omet."],[126.296,130.651,"Ce sont aussi les deux qui apportent le plus de qualité visuelle par mot."],[130.651,133.812,"Alors, si vous ne retenez rien d'autre de ce tableau,"],[133.812,138.048,"retenez ceci : la caméra et le style… c'est là que se trouve la valeur."]],"transcript":"Voici maintenant la structure. Six éléments. C'est la méthode entière, et elle est transférable. Elle n'appartient à aucun outil, et elle restera vraie quand vous changerez d'outil l'année prochaine. Un : le sujet. Qui ou quoi est dans le cadre. Âge, apparence, vêtements, matière, finition. Deux : l'action. Ce qu'il fait. Une action physique précise, plus un adverbe de vitesse. Trois : le décor. Où et quand. Lieu, heure du jour, météo, accessoires importants. Quatre : le mouvement de caméra. Comment la caméra virtuelle bouge. Le type de mouvement, plus le cadrage de départ et le cadrage d'arrivée. Cinq : le style. Le rendu. Étalonnage, contraste, grain, profondeur de champ. Six : l'audio. Ce que l'on entend. Ambiance, effets, musique… ou délibérément pas de musique. Je pourrais maintenant vous dire quoi écrire dans chaque case. C'est la façon la moins utile d'enseigner cela. Je vais plutôt vous dire ce qui se passe quand vous omettez chacun d'eux… car c'est cela que vous reconnaîtrez dans vos propres essais. Omettez le sujet, et le sujet est différent à chaque génération. On ne construit pas une campagne là-dessus ! Omettez l'action, et le cadre est figé, ou le mouvement est incontrôlé… et le modèle en invente un pour vous. Omettez le décor, et vous obtenez un arrière-plan aléatoire qui n'appartient pas à votre sujet. C'est de là que vient cet aspect flottant, sans lieu. Omettez le mouvement de caméra, et vous obtenez une caméra fixe. Plat. Sans vie. On dirait une vidéosurveillance d'un bel objet ! Omettez le style, et vous obtenez l'étalonnage par défaut. Et l'étalonnage par défaut, c'est ce rendu générique que tout le monde reconnaît désormais en moins d'une seconde… et qui fait bas de gamme. Omettez l'audio, et vous obtenez le silence. Ou pire : un son qui ne correspond pas à l'image ! Les éléments quatre et cinq sont ceux que presque tout le monde omet. Ce sont aussi les deux qui apportent le plus de qualité visuelle par mot. Alors, si vous ne retenez rien d'autre de ce tableau, retenez ceci : la caméra et le style… c'est là que se trouve la valeur."},{"n":9,"title":"Éléments 1 à 3 : sujet, action, décor","durationSec":193.2,"audio":"assets/audio/fr/slide-09.m4a","image":"assets/slides/fr/slide-09.png","cues":[[0.008,2.54,"Prenons les trois premiers éléments dans un"],[2.54,6.779,"cas d'entreprise réel… car c'est dans le détail que se trouve la valeur."],[6.779,7.309,"Le sujet."],[7.309,8.192,"Pas un textile."],[8.192,10.9,"Dites en quoi il est fait, quel âge il paraît,"],[10.9,13.432,"de quelle couleur il est réellement, quelle"],[13.432,17.141,"est sa finition… et donnez au spectateur une idée de l'échelle."],[17.261,19.986,"Une couverture de laine tissée à la main,"],[19.986,22.844,"écrue non teintée avec deux rayures indigo,"],[22.844,28.162,"armure irrégulière visible, pliée une fois… de la taille d'une brassée d'adulte."],[28.162,31.287,"Maintenant la règle d'entreprise pour le sujet."],[31.287,34.677,"C'est la phrase la plus importante de cette partie."],[34.797,37.415,"Si le produit doit ressembler exactement à"],[37.415,40.407,"l'objet réel… ne le décrivez pas avec des mots !"],[40.407,43.586,"Fournissez une photographie réelle comme référence."],[43.586,46.142,"Les mots produisent un produit similaire."],[46.142,48.574,"Ils ne produisent jamais votre produit."],[48.574,53.062,"Une armure décrite est une armure que le modèle a déjà vue quelque part."],[53.182,54.57,"La vôtre est la vôtre."],[54.57,59.302,"Donc, pour tout ce qui doit correspondre à la réalité physique… le produit,"],[59.302,63.025,"l'emballage, l'étiquette, vous téléversez une photographie,"],[63.025,66.117,"et v  à ses pieds."],[156.84,159.459,"Caméra : travelling latéral lent, d'un plan"],[159.459,162.078,"moyen vers un gros plan sur les mains… pour"],[162.078,165.55,"finir sur le point où les phalanges rencontrent la corde."],[165.55,168.9,"Style : cinéma documentaire, dominante gris-bleu froid,"],[168.9,171.823,"lumière matinale à basse température de couleur,"],[171.823,176.026,"faible profondeur de champ… grain argentique trente-cinq millimètres."],[176.146,180.537,"Audio : ressac basse fréquence, le grincement d'un câble sous tension,"],[180.537,181.791,"mouettes lointaines."],[181.791,182.732,"Pas de musique."],[182.732,184.05,"Comptez les éléments."],[184.05,185.053,"Les six y sont !"],[185.053,187.876,"C'est pour cela que cela fonctionne… et c'est"],[187.876,193.208,"pour cela que cela fonctionnera encore dans trois ans, sur un outil qui n'existe pas."]],"transcript":"Prenons les trois premiers éléments dans un cas d'entreprise réel… car c'est dans le détail que se trouve la valeur. Le sujet. Pas un textile. Dites en quoi il est fait, quel âge il paraît, de quelle couleur il est réellement, quelle est sa finition… et donnez au spectateur une idée de l'échelle. Une couverture de laine tissée à la main, écrue non teintée avec deux rayures indigo, armure irrégulière visible, pliée une fois… de la taille d'une brassée d'adulte. Maintenant la règle d'entreprise pour le sujet. C'est la phrase la plus importante de cette partie. Si le produit doit ressembler exactement à l'objet réel… ne le décrivez pas avec des mots ! Fournissez une photographie réelle comme référence. Les mots produisent un produit similaire. Ils ne produisent jamais votre produit. Une armure décrite est une armure que le modèle a déjà vue quelque part. La vôtre est la vôtre. Donc, pour tout ce qui doit correspondre à la réalité physique… le produit, l'emballage, l'étiquette, vous téléversez une photographie, et vous laissez le modèle se conditionner dessus. Gardez cette idée. Dans un moment, j'en ferai une règle formelle à trois niveaux. L'action. Donnez un processus physique, et donnez-lui une vitesse. Pas un tissu qui flotte. La couverture est soulevée par un coin, par une main… et retombe lentement sous son propre poids. Maintenant le modèle sait ce qui change entre la première et la dernière image… et à quelle vitesse cela change. Le décor. Lieu, heure du jour, météo, accessoires. Et un avertissement : c'est dans les accessoires que se produisent les erreurs culturelles ! Si vous placez une scène dans un marché, un atelier ou une maison… vous affirmez des faits sur un lieu et sur un peuple. N'affirmez que ce que vous pouvez vérifier. Nous y reviendrons dans la discussion éthique. Voici l'exemple modèle auquel je reviendrai toute la séance. Ce n'est pas un exemple commercial, c'est un exemple artistique… et je le garde parce que chaque technique de ce cours atterrit quelque part à l'intérieur. Un pêcheur d'une soixantaine d'années, de la côte bretonne. Cheveux courts gris-blancs. Veste cirée sombre. Mains marquées par le sel et les gerçures. Il remonte lentement un filet. La corde glisse entre ses doigts. L'eau goutte du dos de sa main. Décor : un quai de granit à cinq heures du matin, brume fine pas encore levée… le faisceau d'un phare balayant encore la mer au loin, câbles et bouées épars à ses pieds. Caméra : travelling latéral lent, d'un plan moyen vers un gros plan sur les mains… pour finir sur le point où les phalanges rencontrent la corde. Style : cinéma documentaire, dominante gris-bleu froid, lumière matinale à basse température de couleur, faible profondeur de champ… grain argentique trente-cinq millimètres. Audio : ressac basse fréquence, le grincement d'un câble sous tension, mouettes lointaines. Pas de musique. Comptez les éléments. Les six y sont ! C'est pour cela que cela fonctionne… et c'est pour cela que cela fonctionnera encore dans trois ans, sur un outil qui n'existe pas."},{"n":10,"title":"Éléments 4 à 6 : caméra, style, audio","durationSec":173.4,"audio":"assets/audio/fr/slide-10.m4a","image":"assets/slides/fr/slide-10.png","cues":[[0.008,2.576,"Maintenant les trois éléments que l'on saute."],[2.576,3.889,"Le mouvement de caméra."],[3.889,6.115,"Je ne vais pas vous faire mémoriser dix"],[6.115,9.197,"mouvements en trois minutes… ils sont sur votre fiche."],[9.197,12.964,"Je vous donne les deux règles qui évitent presque tous les échecs."],[13.084,17.699,"Règle un : écrivez toujours le cadrage de départ et le cadrage d'arrivée."],[17.699,20.544,"Travelling avant, seul, n'est pas exécutable."],[20.544,23.325,"Cela ne dit ni où vous commencez, ni où vous"],[23.325,26.297,"vous arrêtez… donc le modèle choisit pour vous."],[26.297,29.331,"Travelling avant, d'un plan général de l'atelier"],[29.331,31.986,"vers un gros plan sur les mains au métier."],[32.106,33.504,"Cela est exécutable !"],[33.504,36.165,"Règle deux : un seul mouvement par plan."],[36.165,40.358,"Quand on empile trois ou quatre mouvements dans un même prompt,"],[40.358,44.084,"le modèle exécute le premier… ou les fond tous ensemble."],[44.084,47.877,"Si vous voulez trois mouvements, vous voulez trois plans."],[47.877,48.476,"Le style."],[48.476,50.938,"C'est ici que vit le rendu générique."],[51.058,54.073,"Et le mot cinématographique n'est pas un style."],[54.073,57.217,"C'est l'humeur que vous avez à propos d'un style."],[57.217,61.451,"Le modèle ne peut pas l'exécuter, donc il retombe sur son défaut :"],[61.451,63.953,"peau trop lissée, couleur trop saturée,"],[63.953,68.828,"contraste trop fort, aucun grain… et une lumière qui ne vient de nulle part."],[68.948,73.559,"Tout le monde reconnaît désormais ce rendu en moins d'une seconde,"],[73.559,75.235,"et il fait bas de gamme."],[75.235,78.658,"Écrivez donc le style en quatre parties séparées."],[78.658,82.291,"La température de couleur : chaude, froide ou mixte."],[82.291,84.387,"Le contraste : fort ou faible."],[84.387,90.045,"Le grain ou la texture : grain trente-cinq millimètres, numérique propre, ou mat."],[90.165,93.723,"La profondeur de champ : faible, ou profonde et nette."],[93.723,98.665,"Dominante gris-bleu froid, lumière matinale à basse température de couleur,"],[98.665,103.212,"faible profondeur de champ… grain argentique trente-cinq millimètres."],[103.212,104.661,"Cela, c'est un style !"],[104.661,110.13,"C'est exécutable, et, ce qui compte davantage pour une entreprise… c'est répétable."],[110.25,110.774,"L'audio."],[110.774,114.309,"Presque tout le monde oublie l'audio au premier essai."],[114.309,119.218,"Écrivez-le en trois couches : l'ambiance, les effets précis, et la musique."],[119.218,124.193,"Ou écrivez pas de musique, ce qui est un choix légitime et souvent meilleur."],[124.193,129.365,"Un silence habité par un seul son réel bat une musique générique à chaque fois."],[129.485,133.128,"Et maintenant un avertissement d'entreprise, avant de continuer."],[133.128,134.039,"Notez celui-là !"],[134.039,136.202,"Les modèles d'images rendent le texte,"],[136.202,139.333,"les logos et la typographie fine de manière peu fiable."],[139.333,141.212,"Ils se trompent dans les lettres."],[141.212,143.432,"Ils inventent des mots supplémentaires."],[143.552,149.003,"Ils approximent un logo presque juste… ce qui est pire qu'un logo manifestement faux !"],[149.003,152.488,"Donc : ne laissez jamais le modèle dessiner votre logo,"],[152.488,155.848,"le texte de votre emballage, ou vos mentions légales."],[155.848,156.862,"Générez l'image."],[156.982,161.264,"Puis posez dessus de véritables tracés vectoriels et une véritable typographie,"],[161.264,163.974,"dans un outil de conception classique… après coup."],[163.974,168.148,"Cette seule habitude vous évitera la plupart des embarras de tout ce domaine,"],[168.148,170.262,"et elle ne coûte rien… puisqu'il s'agit"],[170.262,173.406,"uniquement de changer l'ordre dans lequel vous travaillez."]],"transcript":"Maintenant les trois éléments que l'on saute. Le mouvement de caméra. Je ne vais pas vous faire mémoriser dix mouvements en trois minutes… ils sont sur votre fiche. Je vous donne les deux règles qui évitent presque tous les échecs. Règle un : écrivez toujours le cadrage de départ et le cadrage d'arrivée. Travelling avant, seul, n'est pas exécutable. Cela ne dit ni où vous commencez, ni où vous vous arrêtez… donc le modèle choisit pour vous. Travelling avant, d'un plan général de l'atelier vers un gros plan sur les mains au métier. Cela est exécutable ! Règle deux : un seul mouvement par plan. Quand on empile trois ou quatre mouvements dans un même prompt, le modèle exécute le premier… ou les fond tous ensemble. Si vous voulez trois mouvements, vous voulez trois plans. Le style. C'est ici que vit le rendu générique. Et le mot cinématographique n'est pas un style. C'est l'humeur que vous avez à propos d'un style. Le modèle ne peut pas l'exécuter, donc il retombe sur son défaut : peau trop lissée, couleur trop saturée, contraste trop fort, aucun grain… et une lumière qui ne vient de nulle part. Tout le monde reconnaît désormais ce rendu en moins d'une seconde, et il fait bas de gamme. Écrivez donc le style en quatre parties séparées. La température de couleur : chaude, froide ou mixte. Le contraste : fort ou faible. Le grain ou la texture : grain trente-cinq millimètres, numérique propre, ou mat. La profondeur de champ : faible, ou profonde et nette. Dominante gris-bleu froid, lumière matinale à basse température de couleur, faible profondeur de champ… grain argentique trente-cinq millimètres. Cela, c'est un style ! C'est exécutable, et, ce qui compte davantage pour une entreprise… c'est répétable. L'audio. Presque tout le monde oublie l'audio au premier essai. Écrivez-le en trois couches : l'ambiance, les effets précis, et la musique. Ou écrivez pas de musique, ce qui est un choix légitime et souvent meilleur. Un silence habité par un seul son réel bat une musique générique à chaque fois. Et maintenant un avertissement d'entreprise, avant de continuer. Notez celui-là ! Les modèles d'images rendent le texte, les logos et la typographie fine de manière peu fiable. Ils se trompent dans les lettres. Ils inventent des mots supplémentaires. Ils approximent un logo presque juste… ce qui est pire qu'un logo manifestement faux ! Donc : ne laissez jamais le modèle dessiner votre logo, le texte de votre emballage, ou vos mentions légales. Générez l'image. Puis posez dessus de véritables tracés vectoriels et une véritable typographie, dans un outil de conception classique… après coup. Cette seule habitude vous évitera la plupart des embarras de tout ce domaine, et elle ne coûte rien… puisqu'il s'agit uniquement de changer l'ordre dans lequel vous travaillez."},{"n":11,"title":"Les trois niveaux de fidélité","durationSec":158.18,"audio":"assets/audio/fr/slide-11.m4a","image":"assets/slides/fr/slide-11.png","cues":[[0.006,4.645,"Voici la diapositive la plus importante de la séance pour une entreprise."],[4.645,8.521,"Si vous oubliez les six éléments, vous ferez une image laide."],[8.521,11.952,"Si vous oubliez ceci… vous ferez une erreur coûteuse !"],[11.952,15.511,"Toutes les images n'ont pas à être vraies au même degré."],[15.631,21.418,"Donc, avant d'écrire un seul prompt, classez l'actif dans l'un des trois niveaux."],[21.418,24.347,"Niveau un : doit être littéralement vrai."],[24.347,25.776,"Le produit lui-même."],[25.776,26.633,"L'emballage."],[26.633,27.49,"L'étiquette."],[27.49,29.276,"La liste des ingrédients."],[29.276,31.277,"Le visage d'un salarié réel."],[31.397,34.103,"Tout ce sur quoi un client peut raisonnablement"],[34.103,37.731,"se fonder… ou qu'il peut comparer à ce qui arrive par la poste."],[37.731,41.877,"La règle du niveau un : utilisez la photographie réelle comme référence,"],[41.877,44.237,"générez le moins possible, et vérifiez le"],[44.237,47.174,"résultat contre l'objet physique avant publication."],[47.174,48.671,"Niveau deux : illustratif."],[48.791,49.895,"Scènes de vie."],[49.895,50.763,"Atmosphère."],[50.763,51.867,"Arrière-plans."],[51.867,52.577,"Concepts."],[52.577,57.546,"Une main qui tient une tasse, une rue, un paysage, une texture."],[57.546,63.224,"Rien, dans un actif de niveau deux, n'affirme un fait sur votre produit."],[63.224,66.773,"La règle du niveau deux : générez librement !"],[66.893,69.531,"C'est là que se trouve réellement le gain de"],[69.531,73.308,"productivité… et l'essentiel de vos volumes est de niveau deux."],[73.308,75.466,"Niveau trois : une personne fictive."],[75.466,77.444,"Un porte-parole qui n'existe pas."],[77.444,82.539,"Une personne présentée comme un client dans votre vidéo… et qui n'est pas un client !"],[82.659,88.443,"La règle du niveau trois : des obligations de consentement et de divulgation s'appliquent."],[88.443,90.564,"Nous y venons dans vingt minutes."],[90.564,91.657,"Regardez l'écran."],[91.657,95.641,"Voici l'image catalogue que nous avons générée tout à l'heure."],[95.641,98.276,"À côté, une photographie du produit réel."],[98.276,99.818,"Même armure de tissage ?"],[99.818,100.075,"Non."],[100.195,102.759,"Même couleur en lumière du jour ?"],[102.759,103.302,"Proche."],[103.302,104.39,"Pas identique."],[104.39,105.788,"Mêmes dimensions ?"],[105.788,107.186,"Impossible à dire."],[107.186,111.38,"Et le client non plus… jusqu'à ce que le colis arrive."],[111.38,113.788,"Ceci est un actif de niveau un."],[113.908,116.806,"Et ce que vous venez de voir est la façon la"],[116.806,119.704,"plus fréquente dont une petite entreprise se"],[119.704,122.997,"nuit avec l'intelligence artificielle générative :"],[122.997,127.41,"elle traite un actif de niveau un comme s'il était de niveau deux !"],[127.41,128.596,"L'image est belle."],[128.596,130.506,"Le client reçoit autre chose."],[130.506,132.811,"Ce n'est pas un problème technique."],[132.931,136.414,"C'est un problème de protection du consommateur… et,"],[136.414,140.969,"dans la plupart des juridictions, c'est aussi un problème juridique."],[140.969,143.783,"Toute la discipline tient en une question,"],[143.783,147.869,"posée avant de commencer : à quel niveau se situe cet actif ?"],[147.989,150.971,"La réponse change votre flux de production,"],[150.971,155.756,"votre budget, votre étape de relecture et votre exposition juridique."],[155.756,158.184,"Posez-la en premier… à chaque fois."]],"transcript":"Voici la diapositive la plus importante de la séance pour une entreprise. Si vous oubliez les six éléments, vous ferez une image laide. Si vous oubliez ceci… vous ferez une erreur coûteuse ! Toutes les images n'ont pas à être vraies au même degré. Donc, avant d'écrire un seul prompt, classez l'actif dans l'un des trois niveaux. Niveau un : doit être littéralement vrai. Le produit lui-même. L'emballage. L'étiquette. La liste des ingrédients. Le visage d'un salarié réel. Tout ce sur quoi un client peut raisonnablement se fonder… ou qu'il peut comparer à ce qui arrive par la poste. La règle du niveau un : utilisez la photographie réelle comme référence, générez le moins possible, et vérifiez le résultat contre l'objet physique avant publication. Niveau deux : illustratif. Scènes de vie. Atmosphère. Arrière-plans. Concepts. Une main qui tient une tasse, une rue, un paysage, une texture. Rien, dans un actif de niveau deux, n'affirme un fait sur votre produit. La règle du niveau deux : générez librement ! C'est là que se trouve réellement le gain de productivité… et l'essentiel de vos volumes est de niveau deux. Niveau trois : une personne fictive. Un porte-parole qui n'existe pas. Une personne présentée comme un client dans votre vidéo… et qui n'est pas un client ! La règle du niveau trois : des obligations de consentement et de divulgation s'appliquent. Nous y venons dans vingt minutes. Regardez l'écran. Voici l'image catalogue que nous avons générée tout à l'heure. À côté, une photographie du produit réel. Même armure de tissage ? Non. Même couleur en lumière du jour ? Proche. Pas identique. Mêmes dimensions ? Impossible à dire. Et le client non plus… jusqu'à ce que le colis arrive. Ceci est un actif de niveau un. Et ce que vous venez de voir est la façon la plus fréquente dont une petite entreprise se nuit avec l'intelligence artificielle générative : elle traite un actif de niveau un comme s'il était de niveau deux ! L'image est belle. Le client reçoit autre chose. Ce n'est pas un problème technique. C'est un problème de protection du consommateur… et, dans la plupart des juridictions, c'est aussi un problème juridique. Toute la discipline tient en une question, posée avant de commencer : à quel niveau se situe cet actif ? La réponse change votre flux de production, votre budget, votre étape de relecture et votre exposition juridique. Posez-la en premier… à chaque fois."},{"n":12,"title":"La lumière : direction, qualité et couleur","durationSec":113.36,"audio":"assets/audio/fr/slide-12.m4a","image":"assets/slides/fr/slide-12.png","cues":[[0.004,2.597,"Deux minutes sur la lumière… car c'est la"],[2.597,6.646,"qualité la moins chère que vous puissiez acheter avec des mots !"],[6.646,8.353,"La lumière a une direction."],[8.353,12.781,"La lumière frontale donne un détail net… et presque aucune profondeur."],[12.781,18.411,"Elle est plate, et convient à une présentation produit ou à un portrait de type identité."],[18.531,21.145,"La lumière latérale donne moitié lumière,"],[21.145,25.418,"moitié ombre… et c'est de là que viennent la texture et le volume !"],[25.418,29.308,"C'est votre plan de savoir-faire, votre gros plan de matière."],[29.308,34.855,"Le contre-jour détache le sujet du fond par un contour lumineux… sous-expose le visage,"],[34.855,36.513,"et est très atmosphérique."],[36.633,41.878,"Il appartient à un film de marque aspirationnel, généralement en plan de clôture."],[41.878,47.511,"La lumière zénithale fait tomber les orbites dans l'ombre… et se lit comme oppressante."],[47.511,51.914,"L'éclairage par en dessous paraît faux à tout œil humain sur terre !"],[51.914,54.828,"Évitez les deux en marketing, sauf intention."],[54.948,56.948,"La lumière a une qualité ?"],[56.948,61.718,"Lumière dure : bords d'ombre nets, contraste fort… dramatique."],[61.718,65.411,"Lumière douce : ombres progressives, indulgente,"],[65.411,70.028,"et le bon défaut pour les personnes comme pour les produits."],[70.148,72.735,"Et la lumière volumétrique : des faisceaux"],[72.735,77.786,"visibles… quand l'air lui-même porte de la brume, de la poussière ou de la fumée !"],[77.786,80.496,"Laissez-moi vous donner un secret de métier."],[80.496,85.794,"De tous les mots de cette séance, lumière volumétrique a la meilleure valeur par mot !"],[85.914,89.306,"Une seule expression, et la qualité de production"],[89.306,92.284,"perçue de votre image fait un bond visible."],[92.284,95.4,"Employez-la délibérément… et n'en abusez pas."],[95.4,96.438,"Et la couleur ?"],[96.438,102.185,"Écrivez trois instructions séparées : la dominante, le contraste, et la saturation."],[102.185,104.816,"N'écrivez pas un rendu haut de gamme !"],[104.936,109.392,"Écrivez : dominante chaude, contraste faible, désaturé."],[109.392,111.012,"L'un est une humeur."],[111.012,113.361,"L'autre est une instruction !"]],"transcript":"Deux minutes sur la lumière… car c'est la qualité la moins chère que vous puissiez acheter avec des mots ! La lumière a une direction. La lumière frontale donne un détail net… et presque aucune profondeur. Elle est plate, et convient à une présentation produit ou à un portrait de type identité. La lumière latérale donne moitié lumière, moitié ombre… et c'est de là que viennent la texture et le volume ! C'est votre plan de savoir-faire, votre gros plan de matière. Le contre-jour détache le sujet du fond par un contour lumineux… sous-expose le visage, et est très atmosphérique. Il appartient à un film de marque aspirationnel, généralement en plan de clôture. La lumière zénithale fait tomber les orbites dans l'ombre… et se lit comme oppressante. L'éclairage par en dessous paraît faux à tout œil humain sur terre ! Évitez les deux en marketing, sauf intention. La lumière a une qualité ? Lumière dure : bords d'ombre nets, contraste fort… dramatique. Lumière douce : ombres progressives, indulgente, et le bon défaut pour les personnes comme pour les produits. Et la lumière volumétrique : des faisceaux visibles… quand l'air lui-même porte de la brume, de la poussière ou de la fumée ! Laissez-moi vous donner un secret de métier. De tous les mots de cette séance, lumière volumétrique a la meilleure valeur par mot ! Une seule expression, et la qualité de production perçue de votre image fait un bond visible. Employez-la délibérément… et n'en abusez pas. Et la couleur ? Écrivez trois instructions séparées : la dominante, le contraste, et la saturation. N'écrivez pas un rendu haut de gamme ! Écrivez : dominante chaude, contraste faible, désaturé. L'un est une humeur. L'autre est une instruction !"},{"n":13,"title":"Cadrage et composition","durationSec":95.18,"audio":"assets/audio/fr/slide-13.m4a","image":"assets/slides/fr/slide-13.png","cues":[[0.001,2.592,"Le cadrage n'est pas une décoration."],[2.592,5.76,"Le cadrage décide de ce à quoi sert ce plan."],[5.76,6.768,"Du plus large."],[6.768,11.806,"Plan d'ensemble : l'échelle de l'exploitation, le site, la géographie."],[11.806,13.966,"Plan général : poser la scène."],[13.966,18.645,"Plan moyen : le produit entier, ou la personne entière en action."],[18.645,21.452,"Plan américain : le cheval de bataille."],[21.572,24.472,"C'est là que vivent la démonstration et la"],[24.472,27.924,"conversation… et ce sera l'essentiel de vos plans."],[27.924,31.169,"Gros plan : la réaction, la qualité, le détail."],[31.169,35.449,"Très gros plan : le savoir-faire, la texture, l'objet décisif."],[35.449,37.175,"Trois autres à connaître."],[37.175,41.041,"Le plan subjectif : le spectateur devient le personnage."],[41.161,44.215,"C'est votre outil d'identification le plus puissant."],[44.215,48.736,"Le plan par-dessus l'épaule : le standard pour deux personnes qui se parlent."],[48.736,51.261,"Et le plan de coupe : un décrochage vers un"],[51.261,55.958,"objet… qui contrôle le rythme et contrôle quand le public apprend quelque chose."],[56.078,62.07,"Composition : règle des tiers, symétrie, lignes de fuite, premier plan, et espace négatif."],[62.07,65.599,"Une règle, et c'est la même qu'ailleurs aujourd'hui :"],[65.599,69.661,"les termes de composition doivent être écrits dans le prompt."],[69.661,72.857,"Le modèle ne suit pas la composition par défaut."],[72.977,76.202,"Si vous voulez le sujet sur le tiers gauche… dites-le."],[76.202,79.428,"Et un ajout métier que les designers connaissent déjà,"],[79.428,83.789,"mais que les marketeurs oublient : si l'actif est destiné à la publicité,"],[83.789,86.357,"réservez de l'espace négatif pour le texte."],[86.477,88.924,"Dites-le dans le prompt, par exemple espace"],[88.924,93.705,"vide dans le tiers supérieur… car sinon il n'y aura nulle part où poser votre titre,"],[93.705,95.185,"et vous régénérerez tout !"]],"transcript":"Le cadrage n'est pas une décoration. Le cadrage décide de ce à quoi sert ce plan. Du plus large. Plan d'ensemble : l'échelle de l'exploitation, le site, la géographie. Plan général : poser la scène. Plan moyen : le produit entier, ou la personne entière en action. Plan américain : le cheval de bataille. C'est là que vivent la démonstration et la conversation… et ce sera l'essentiel de vos plans. Gros plan : la réaction, la qualité, le détail. Très gros plan : le savoir-faire, la texture, l'objet décisif. Trois autres à connaître. Le plan subjectif : le spectateur devient le personnage. C'est votre outil d'identification le plus puissant. Le plan par-dessus l'épaule : le standard pour deux personnes qui se parlent. Et le plan de coupe : un décrochage vers un objet… qui contrôle le rythme et contrôle quand le public apprend quelque chose. Composition : règle des tiers, symétrie, lignes de fuite, premier plan, et espace négatif. Une règle, et c'est la même qu'ailleurs aujourd'hui : les termes de composition doivent être écrits dans le prompt. Le modèle ne suit pas la composition par défaut. Si vous voulez le sujet sur le tiers gauche… dites-le. Et un ajout métier que les designers connaissent déjà, mais que les marketeurs oublient : si l'actif est destiné à la publicité, réservez de l'espace négatif pour le texte. Dites-le dans le prompt, par exemple espace vide dans le tiers supérieur… car sinon il n'y aura nulle part où poser votre titre, et vous régénérerez tout !"},{"n":14,"title":"Mouvement de caméra : nommez-le, donnez-lui un début et une fin","durationSec":159.83,"audio":"assets/audio/fr/slide-14.m4a","image":"assets/slides/fr/slide-14.png","cues":[[0.005,2.328,"Nous passons de l'image fixe à la vidéo."],[2.328,4.942,"En vidéo, le mouvement de caméra fait le plus"],[4.942,8.718,"gros du travail… et c'est l'élément que l'on ne peut pas truquer."],[8.718,9.937,"Voici le vocabulaire."],[9.937,10.809,"Dix mouvements."],[10.809,13.422,"Vous ne les mémoriserez pas en trois minutes,"],[13.422,16.501,"et ce n'est pas nécessaire… ils sont sur votre fiche."],[16.621,19.1,"Mais vous devez savoir les reconnaître,"],[19.1,23.994,"car nommer un mouvement précisément est exactement ce qui le rend exécutable."],[23.994,27.49,"Travelling avant : la caméra se rapproche physiquement."],[27.49,31.431,"Il concentre l'attention et entre dans l'intériorité du sujet."],[31.431,34.037,"Travelling arrière : la caméra se retire."],[34.157,37.769,"Il révèle l'environnement, et crée l'isolement ou l'échelle."],[37.769,41.321,"Panoramique : la caméra tourne horizontalement sur son axe."],[41.321,45.294,"Il déplace l'attention et établit la position relative des choses."],[45.294,48.063,"Panoramique vertical : le même, verticalement."],[48.063,51.856,"Il montre la hauteur, et nous fait passer de la partie au tout."],[51.976,57.098,"Travelling d'accompagnement : la caméra se déplace aux côtés du sujet."],[57.098,59.806,"De l'énergie… et de l'identification."],[59.806,63.319,"Travelling circulaire : la caméra tourne autour."],[63.319,66.904,"Il dit : ce sujet mérite qu'on lui tourne autour."],[66.904,68.368,"Il suspend le temps."],[68.368,73.71,"Plan à la grue : le point de vue s'élève, d'une personne vers un paysage."],[73.83,74.954,"Échelle épique."],[74.954,77.428,"Caméra épaule : le cadre respire."],[77.428,81.025,"Tension, vérité documentaire, perte de contrôle."],[81.025,85.297,"Plan aérien : la géographie, et la comparaison d'échelle."],[85.297,88.669,"Panoramique filé : un flou horizontal rapide."],[88.669,93.016,"C'est à la fois une transition et un changement de rythme."],[93.136,95.933,"Faisons maintenant l'exercice à l'envers… qui"],[95.933,99.103,"est la façon dont vous vous en servirez réellement."],[99.103,100.719,"Je vous donne une émotion."],[100.719,102.397,"Vous me dites le mouvement."],[102.397,106.313,"Ne cherchez pas la bonne réponse, cherchez celle qui l'exprime."],[106.313,107.245,"Le soulagement."],[107.245,108.924,"Un travelling arrière lent."],[109.044,114.775,"Le cadre s'ouvre, le personnage devient plus petit… le monde devient plus grand."],[114.775,115.706,"Être observé."],[115.706,119.647,"Un travelling avant très lent, qui ne se résout jamais."],[119.647,123.874,"Le public sent l'approche sans jamais voir ce qui approche."],[123.874,125.235,"La fierté du geste."],[125.235,127.026,"Un travelling circulaire."],[127.146,131.287,"Parce qu'un circulaire dit : cet objet mérite qu'on lui tourne autour."],[131.287,133.18,"Une longue journée qui s'achève."],[133.18,136.788,"Une grue, ou un plan général fixe avec la lumière qui change."],[136.788,138.031,"Les deux sont justes."],[138.031,140.693,"Remarquez ce qui s'est produit à chaque fois."],[140.693,144.774,"Vous n'avez pas choisi un mouvement parce qu'il était impressionnant."],[144.894,147.934,"Vous l'avez choisi parce qu'il voulait dire quelque chose."],[147.934,150.345,"C'est la troisième règle du travail de caméra,"],[150.345,154.172,"et c'est elle qui sépare une vidéo compétente d'une bande démonstrative :"],[154.172,156.268,"le mouvement sert l'intention narrative."],[156.268,159.832,"Si un mouvement ne veut rien dire… coupez-le et gardez le plan fixe."]],"transcript":"Nous passons de l'image fixe à la vidéo. En vidéo, le mouvement de caméra fait le plus gros du travail… et c'est l'élément que l'on ne peut pas truquer. Voici le vocabulaire. Dix mouvements. Vous ne les mémoriserez pas en trois minutes, et ce n'est pas nécessaire… ils sont sur votre fiche. Mais vous devez savoir les reconnaître, car nommer un mouvement précisément est exactement ce qui le rend exécutable. Travelling avant : la caméra se rapproche physiquement. Il concentre l'attention et entre dans l'intériorité du sujet. Travelling arrière : la caméra se retire. Il révèle l'environnement, et crée l'isolement ou l'échelle. Panoramique : la caméra tourne horizontalement sur son axe. Il déplace l'attention et établit la position relative des choses. Panoramique vertical : le même, verticalement. Il montre la hauteur, et nous fait passer de la partie au tout. Travelling d'accompagnement : la caméra se déplace aux côtés du sujet. De l'énergie… et de l'identification. Travelling circulaire : la caméra tourne autour. Il dit : ce sujet mérite qu'on lui tourne autour. Il suspend le temps. Plan à la grue : le point de vue s'élève, d'une personne vers un paysage. Échelle épique. Caméra épaule : le cadre respire. Tension, vérité documentaire, perte de contrôle. Plan aérien : la géographie, et la comparaison d'échelle. Panoramique filé : un flou horizontal rapide. C'est à la fois une transition et un changement de rythme. Faisons maintenant l'exercice à l'envers… qui est la façon dont vous vous en servirez réellement. Je vous donne une émotion. Vous me dites le mouvement. Ne cherchez pas la bonne réponse, cherchez celle qui l'exprime. Le soulagement. Un travelling arrière lent. Le cadre s'ouvre, le personnage devient plus petit… le monde devient plus grand. Être observé. Un travelling avant très lent, qui ne se résout jamais. Le public sent l'approche sans jamais voir ce qui approche. La fierté du geste. Un travelling circulaire. Parce qu'un circulaire dit : cet objet mérite qu'on lui tourne autour. Une longue journée qui s'achève. Une grue, ou un plan général fixe avec la lumière qui change. Les deux sont justes. Remarquez ce qui s'est produit à chaque fois. Vous n'avez pas choisi un mouvement parce qu'il était impressionnant. Vous l'avez choisi parce qu'il voulait dire quelque chose. C'est la troisième règle du travail de caméra, et c'est elle qui sépare une vidéo compétente d'une bande démonstrative : le mouvement sert l'intention narrative. Si un mouvement ne veut rien dire… coupez-le et gardez le plan fixe."},{"n":15,"title":"Scripts multi-plans : trois façons de segmenter","durationSec":160.09,"audio":"assets/audio/fr/slide-15.m4a","image":"assets/slides/fr/slide-15.png","cues":[[0.002,2.86,"Une vidéo de marque n'est jamais un seul plan."],[2.86,4.04,"C'est une séquence."],[4.04,7.704,"Alors, comment écrire plusieurs plans dans un même prompt ?"],[7.704,10.748,"Il y a trois méthodes, et chacune a un coût réel."],[10.748,13.543,"Je vais vous donner le coût, pas seulement la"],[13.543,16.71,"technique… car choisir entre elles est un jugement."],[16.83,19.679,"Méthode A : les segments en langage naturel."],[19.679,23.176,"Vous écrivez : le plan s'ouvre sur le métier à tisser."],[23.176,25.183,"Puis la caméra passe aux mains."],[25.183,27.967,"Puis on voit la couverture terminée, pliée."],[27.967,32.306,"C'est la plus facile à écrire, la plus accessible pour un débutant,"],[32.306,35.025,"et elle convient pour deux à quatre plans."],[35.145,38.241,"Le coût : les limites de plans sont instables."],[38.241,42.749,"Le modèle peut fondre vos trois plans en un seul mouvement continu."],[42.749,45.508,"Ou couper là où vous n'avez rien demandé."],[45.508,47.393,"Méthode B : les horodatages."],[47.393,51.699,"Vous écrivez : zéro à trois secondes, plan général de l'atelier."],[51.699,54.189,"Trois à six, gros plan sur les mains."],[54.309,56.249,"Six à huit, le produit fini."],[56.249,59.298,"Les limites sont maintenant sans ambiguïté !"],[59.298,62.07,"C'est la méthode la plus claire, et elle"],[62.07,67.059,"convient à la publicité rythmique… où la coupe doit tomber sur le temps."],[67.059,70.593,"Le coût : le temps codé en dur précipite le modèle."],[70.713,74.757,"Si vous donnez deux secondes à une action qui en demande quatre,"],[74.757,77.095,"le modèle n'échoue pas… il compresse."],[77.095,79.813,"Le mouvement paraît accéléré et artificiel,"],[79.813,84.552,"et vous n'y comprendrez rien, parce que le prompt était parfaitement clair."],[84.552,86.385,"Méthode C : l'ancre de style."],[86.385,89.544,"Ce n'est pas vraiment une méthode de segmentation."],[89.664,92.359,"C'est ce qui rend la segmentation supportable."],[92.359,95.053,"Vous écrivez une déclaration de style globale,"],[95.053,97.806,"qui s'applique à tous les plans de la séquence."],[97.926,101.388,"Quelque chose comme : tous plans, cinéma documentaire,"],[101.388,106.197,"dominante gris-bleu froid, lumière matinale à basse température de couleur,"],[106.197,111.647,"faible profondeur de champ, grain argentique trente-cinq millimètres… pas de musique."],[111.647,114.917,"Puis vous écrivez vos plans individuels en dessous."],[115.037,118.407,"La méthode C est la technique centrale de tout ce module,"],[118.407,121.718,"et je veux expliquer pourquoi… car ce n'est pas évident."],[121.718,124.201,"Quand les gens font une vidéo multi-plans,"],[124.201,128.635,"l'échec dont ils se plaignent n'est presque jamais : le plan deux est laid."],[128.635,132.241,"C'est : le plan deux a l'air d'un autre film que le plan un !"],[132.361,134.343,"Grain chaud dans le premier."],[134.343,137.175,"Froid, propre, numérique dans le second."],[137.175,142.06,"Même produit, mê
