,[78.998,85.135,"Of every word in this session, volumetric lighting has the highest value per word!"],[85.135,91.122,"One phrase, and the perceived production quality of your image jumps noticeably."],[91.242,94.975,"Use it deliberately… and do not overuse it."],[94.975,96.711,"Light also has time."],[96.711,100.964,"Golden hour is warm, low… and casts long shadows."],[100.964,102.527,"Blue hour is cold."],[102.527,110.252,"Solar noon is flat, and it is the reason professional photographers do not shoot at noon."],[110.252,111.207,"And colour."],[111.327,119.627,"Write three separate instructions: the dominant colour, the contrast, and the saturation."],[119.627,122.332,"Do not write a high-end feel!"],[122.332,126.808,"Write: warm dominant, low contrast, desaturated."],[126.808,128.114,"One is a mood."],[128.114,130.725,"The other is an instruction!"]],"transcript":"Two minutes on light, because it is the cheapest quality you can buy with words! Light has direction. Frontal light gives clear detail… and almost no depth. It is flat, and it suits a product display. Lateral light gives half light and half shade… and that is where texture and volume come from! This is your craftsmanship shot, your material close-up. Backlight separates the subject from the background with a bright outline… and underexposes the face. It belongs in an aspirational brand film, usually as the closing shot. Top light drops the eye sockets into shadow… and reads as oppressive. Under-lighting looks wrong to every human eye on earth! Avoid both in marketing unless you mean it. Light has quality. Hard light: sharp shadow edges, high contrast… dramatic. Soft light: graduated shadows, forgiving, and the right default for people and for products. And volumetric light: visible beams… where the air itself carries mist, dust, or smoke! Let me give you a trade secret. Of every word in this session, volumetric lighting has the highest value per word! One phrase, and the perceived production quality of your image jumps noticeably. Use it deliberately… and do not overuse it. Light also has time. Golden hour is warm, low… and casts long shadows. Blue hour is cold. Solar noon is flat, and it is the reason professional photographers do not shoot at noon. And colour. Write three separate instructions: the dominant colour, the contrast, and the saturation. Do not write a high-end feel! Write: warm dominant, low contrast, desaturated. One is a mood. The other is an instruction!"},{"n":13,"title":"Shot Size and Composition","durationSec":100.71,"audio":"assets/audio/en/slide-13.m4a","image":"assets/slides/en/slide-13.png","cues":[[0.005,2.223,"Shot size is not decoration."],[2.223,5.39,"Shot size decides what this shot is for."],[5.39,6.657,"From the widest."],[6.657,11.884,"Extreme wide: the scale of the operation, the site, the geography."],[11.884,13.943,"Wide: establish the scene."],[13.943,18.299,"Full: the whole product, or the whole person in action."],[18.299,20.041,"Medium: the workhorse."],[20.161,27.359,"This is where demonstration and conversation live… and it will be most of your shots."],[27.359,30.407,"Close-up: reaction, quality, detail."],[30.407,35.997,"Extreme close-up: craftsmanship, texture, the one decisive object."],[35.997,38.114,"Three more worth knowing."],[38.114,42.178,"Point of view: the viewer becomes the character."],[42.298,45.758,"And it is the strongest identification tool you have."],[45.758,49.348,"Over-the-shoulder: the standard for two people talking."],[49.348,53.395,"And the insert: a cutaway to an object… which controls pacing,"],[53.395,56.529,"and controls when the audience learns something."],[56.649,59.713,"Composition: rule of thirds, symmetry,"],[59.713,64.229,"leading lines, foreground occlusion, and negative space."],[64.229,68.987,"One rule, and it is the same rule as everything else today:"],[68.987,73.019,"composition words must be written into the prompt."],[73.019,76.97,"The model does not follow composition by default."],[76.97,81.003,"If you want the subject on the left third… say so."],[81.123,84.521,"And one business addition that designers already know,"],[84.521,88.611,"and that marketers usually miss: if the asset is for advertising,"],[88.611,90.877,"reserve negative space for the text."],[90.877,92.198,"Say it in the prompt."],[92.198,94.149,"Empty space in the upper third."],[94.269,96.918,"Because if you do not, there will be nowhere"],[96.918,100.712,"to put your headline… and you will regenerate the entire thing!"]],"transcript":"Shot size is not decoration. Shot size decides what this shot is for. From the widest. Extreme wide: the scale of the operation, the site, the geography. Wide: establish the scene. Full: the whole product, or the whole person in action. Medium: the workhorse. This is where demonstration and conversation live… and it will be most of your shots. Close-up: reaction, quality, detail. Extreme close-up: craftsmanship, texture, the one decisive object. Three more worth knowing. Point of view: the viewer becomes the character. And it is the strongest identification tool you have. Over-the-shoulder: the standard for two people talking. And the insert: a cutaway to an object… which controls pacing, and controls when the audience learns something. Composition: rule of thirds, symmetry, leading lines, foreground occlusion, and negative space. One rule, and it is the same rule as everything else today: composition words must be written into the prompt. The model does not follow composition by default. If you want the subject on the left third… say so. And one business addition that designers already know, and that marketers usually miss: if the asset is for advertising, reserve negative space for the text. Say it in the prompt. Empty space in the upper third. Because if you do not, there will be nowhere to put your headline… and you will regenerate the entire thing!"},{"n":14,"title":"Camera Movement: Name It, Give It a Start and an End","durationSec":170.33,"audio":"assets/audio/en/slide-14.m4a","image":"assets/slides/en/slide-14.png","cues":[[0.002,3.275,"We have now moved from still images to video."],[3.275,9.384,"In video, camera movement does the most work… and it is the element you cannot fake."],[9.384,11.057,"Here is the vocabulary."],[11.057,12.075,"Ten movements."],[12.075,15.275,"You will not memorise them in three minutes,"],[15.275,18.621,"and you do not need to… they are on your card."],[18.741,21.783,"But you should be able to recognise them…"],[21.783,27.124,"because naming a movement precisely is exactly what makes it executable."],[27.124,30.315,"Dolly in: the camera physically approaches."],[30.315,34.988,"It concentrates attention, and enters the subject's inner life."],[34.988,37.363,"Dolly out: the camera withdraws."],[37.363,41.962,"It reveals the environment, and it creates isolation or scale."],[42.082,45.548,"Pan: the camera turns horizontally on its axis."],[45.548,51.153,"It moves attention, and establishes where things are relative to each other."],[51.153,53.144,"Tilt: the same, vertically."],[53.144,57.421,"It shows height, and it takes us from a part to the whole."],[57.421,61.183,"Tracking: the camera travels alongside the subject."],[61.183,63.174,"Energy… and identification."],[63.174,65.091,"Orbit: the camera circles."],[65.211,69.531,"It says this subject is worth walking around."],[69.531,71.163,"It suspends time."],[71.163,76.634,"Crane: the viewpoint rises, from a person to a landscape."],[76.634,77.69,"Epic scale."],[77.69,80.474,"Handheld: the frame breathes."],[80.474,84.889,"Tension, documentary truth, a loss of control."],[84.889,89.017,"Aerial: geography, and comparison of scale."],[89.017,92.185,"Whip pan: a fast horizontal blur."],[92.305,96.954,"It is a transition and a rhythm change at the same time."],[96.954,103.595,"Now let us do this backwards… which is how you will actually use it in practice."],[103.595,105.837,"I will give you an emotion."],[105.837,107.912,"You tell me the movement."],[107.912,110.486,"Do not look for a right answer."],[110.486,113.392,"Look for the one that expresses it."],[113.392,113.973,"Relief."],[113.973,115.384,"A slow dolly out."],[115.504,121.224,"The frame opens, the character gets smaller… the world gets bigger."],[121.224,122.419,"Being watched."],[122.419,125.833,"A very slow push-in that never resolves."],[125.833,132.065,"The audience feels the approach, without ever seeing what is approaching."],[132.065,133.345,"Pride in craft."],[133.345,134.114,"An orbit."],[134.114,139.15,"Because an orbit says: this object is worth walking around."],[139.27,140.739,"A long day ending."],[140.739,145.145,"A crane, or a locked-off wide with the light changing."],[145.145,146.532,"Both are correct."],[146.532,149.387,"Notice what happened in every case."],[149.387,154.201,"You did not choose a movement because it looked impressive."],[154.201,157.465,"You chose it because it meant something."],[157.585,159.982,"That is the third rule of camera work,"],[159.982,164.209,"and it is the one that separates a competent video from a showreel:"],[164.209,166.291,"movement serves narrative intent."],[166.291,170.328,"If a movement does not mean anything… cut it, and hold the shot."]],"transcript":"We have now moved from still images to video. In video, camera movement does the most work… and it is the element you cannot fake. Here is the vocabulary. Ten movements. You will not memorise them in three minutes, and you do not need to… they are on your card. But you should be able to recognise them… because naming a movement precisely is exactly what makes it executable. Dolly in: the camera physically approaches. It concentrates attention, and enters the subject's inner life. Dolly out: the camera withdraws. It reveals the environment, and it creates isolation or scale. Pan: the camera turns horizontally on its axis. It moves attention, and establishes where things are relative to each other. Tilt: the same, vertically. It shows height, and it takes us from a part to the whole. Tracking: the camera travels alongside the subject. Energy… and identification. Orbit: the camera circles. It says this subject is worth walking around. It suspends time. Crane: the viewpoint rises, from a person to a landscape. Epic scale. Handheld: the frame breathes. Tension, documentary truth, a loss of control. Aerial: geography, and comparison of scale. Whip pan: a fast horizontal blur. It is a transition and a rhythm change at the same time. Now let us do this backwards… which is how you will actually use it in practice. I will give you an emotion. You tell me the movement. Do not look for a right answer. Look for the one that expresses it. Relief. A slow dolly out. The frame opens, the character gets smaller… the world gets bigger. Being watched. A very slow push-in that never resolves. The audience feels the approach, without ever seeing what is approaching. Pride in craft. An orbit. Because an orbit says: this object is worth walking around. A long day ending. A crane, or a locked-off wide with the light changing. Both are correct. Notice what happened in every case. You did not choose a movement because it looked impressive. You chose it because it meant something. That is the third rule of camera work, and it is the one that separates a competent video from a showreel: movement serves narrative intent. If a movement does not mean anything… cut it, and hold the shot."},{"n":15,"title":"Multi-Shot Scripts: Three Ways to Segment","durationSec":173.7,"audio":"assets/audio/en/slide-15.m4a","image":"assets/slides/en/slide-15.png","cues":[[0,2.368,"A brand video is never one shot."],[2.368,3.627,"It is a sequence."],[3.627,7.478,"So how do you write several shots inside one prompt?"],[7.478,11.476,"There are three methods, and each one has a real cost."],[11.476,14.809,"I am going to give you the cost, not just the"],[14.809,19.326,"technique… because choosing between them is a judgement call."],[19.446,21.994,"Method A: natural-language segments."],[21.994,24.685,"You write: the shot opens on the loom,"],[24.685,30.136,"then the camera moves to the hands, then we see the finished blanket, folded."],[30.136,36.295,"It is the easiest to write, the easiest for a beginner, and it suits two to four shots."],[36.295,39.056,"The cost: shot boundaries are unstable."],[39.176,43.849,"The model may merge your three shots into one continuous move."],[43.849,47.315,"Or it may cut where you never asked for a cut."],[47.315,48.897,"Method B: timestamps."],[48.897,53.419,"You write: zero to three seconds, wide shot of the workshop."],[53.419,56.132,"Three to six, close-up of the hands."],[56.132,58.769,"Six to eight, the finished product."],[58.769,61.406,"The boundaries are now unambiguous!"],[61.526,64.619,"This is the clearest method, and it suits"],[64.619,69.523,"rhythm-driven advertising… where the cut has to land on the beat."],[69.523,73.069,"The cost: hard-coded time makes the model rush."],[73.069,76.991,"If you give an action two seconds and it needs four,"],[76.991,79.934,"the model does not fail… it compresses."],[80.054,83.764,"The movement looks accelerated and artificial,"],[83.764,89.572,"and you will not understand why… because the prompt was perfectly clear."],[89.572,91.75,"Method C: the style anchor."],[91.75,95.621,"This is not really a segmentation method at all."],[95.621,99.735,"It is the thing that makes segmentation survivable."],[99.855,106.486,"You write one global style declaration, and it applies to every shot in the sequence."],[106.486,108.046,"Something like this."],[108.046,112.337,"All shots: documentary cinema, cold grey-blue dominant,"],[112.337,115.223,"low colour-temperature morning light,"],[115.223,120.528,"shallow depth of field, thirty-five millimetre film grain… no score."],[120.648,124.148,"Then you write your individual shots underneath it."],[124.148,127.786,"Method C is the core technique of this entire module,"],[127.786,131.424,"and I want to explain why… because it is not obvious."],[131.424,134.17,"When people make a multi-shot video, the"],[134.17,138.701,"failure they complain about is almost never that shot two is ugly."],[138.821,143.868,"It is that shot two looks like a different film from shot one!"],[143.868,146.228,"Warm grain in the first shot."],[146.228,149.077,"Cold, clean, digital in the second."],[149.077,151.927,"Same product, same day, same story."],[151.927,157.055,"And the audience feels the seam… even when they cannot name it."],[157.055,161.044,"Style drift is the real enemy of multi-shot work."],[161.044,162.183,"Not bad shots."],[162.303,163.79,"Inconsistent ones."],[163.79,167.011,"The style anchor is the countermeasure."],[167.011,173.702,"Write it once, at the top… and reuse it word for word across the entire campaign."]],"transcript":"A brand video is never one shot. It is a sequence. So how do you write several shots inside one prompt? There are three methods, and each one has a real cost. I am going to give you the cost, not just the technique… because choosing between them is a judgement call. Method A: natural-language segments. You write: the shot opens on the loom, then the camera moves to the hands, then we see the finished blanket, folded. It is the easiest to write, the easiest for a beginner, and it suits two to four shots. The cost: shot boundaries are unstable. The model may merge your three shots into one continuous move. Or it may cut where you never asked for a cut. Method B: timestamps. You write: zero to three seconds, wide shot of the workshop. Three to six, close-up of the hands. Six to eight, the finished product. The boundaries are now unambiguous! This is the clearest method, and it suits rhythm-driven advertising… where the cut has to land on the beat. The cost: hard-coded time makes the model rush. If you give an action two seconds and it needs four, the model does not fail… it compresses. The movement looks accelerated and artificial, and you will not understand why… because the prompt was perfectly clear. Method C: the style anchor. This is not really a segmentation method at all. It is the thing that makes segmentation survivable. You write one global style declaration, and it applies to every shot in the sequence. Something like this. All shots: documentary cinema, cold grey-blue dominant, low colour-temperature morning light, shallow depth of field, thirty-five millimetre film grain… no score. Then you write your individual shots underneath it. Method C is the core technique of this entire module, and I want to explain why… because it is not obvious. When people make a multi-shot video, the failure they complain about is almost never that shot two is ugly. It is that shot two looks like a different film from shot one! Warm grain in the first shot. Cold, clean, digital in the second. Same product, same day, same story. And the audience feels the seam… even when they cannot name it. Style drift is the real enemy of multi-shot work. Not bad shots. Inconsistent ones. The style anchor is the countermeasure. Write it once, at the top… and reuse it word for word across the entire campaign."},{"n":16,"title":"Brand Consistency: The Style Anchor","durationSec":163.88,"audio":"assets/audio/en/slide-16.m4a","image":"assets/slides/en/slide-16.png","cues":[[0.002,2.569,"Three more levers for consistency."],[2.569,8.006,"They are small… and they matter more than anything else in this session."],[8.006,12.235,"Lever one: repeat the subject description word for word."],[12.235,14.727,"Not approximately… word for word!"],[14.727,18.503,"A sixty-year-old fisherman, and the old fisherman,"],[18.503,21.524,"are, to the model, two different people."],[21.644,24.854,"It has no memory of your last prompt."],[24.854,27.803,"So synonyms are not elegance here."],[27.803,29.451,"Synonyms are drift."],[29.451,34.656,"Copy and paste your subject sentence into every single shot."],[34.656,38.907,"Lever two: use image-to-video, not text-to-video."],[38.907,44.633,"Fix the character or the product once, with a text-to-image still."],[44.633,46.281,"Approve that still."],[46.401,48.964,"Then generate every shot from it."],[48.964,55.954,"This is the single largest consistency improvement available to you… and it costs nothing!"],[55.954,59.527,"Lever three: name the key props in every shot."],[59.527,63.178,"If the story depends on an object… the blanket,"],[63.178,68.149,"the tool, the cup, the box, mention it explicitly in every shot,"],[68.149,70.401,"even when it feels redundant."],[70.521,73.321,"Especially when it feels redundant."],[73.321,76.84,"Now let me break all three rules on purpose."],[76.84,78.68,"Look at the third shot."],[78.68,80.999,"Different colour temperature."],[80.999,82.279,"Different grain."],[82.279,87.238,"And the product now has a different weave from the first shot!"],[87.238,90.358,"Now I restore both, and generate again."],[90.358,91.158,"Same film."],[91.158,92.198,"Same product."],[92.198,93.317,"Same campaign!"],[93.437,96.963,"That failure was more instructive than any"],[96.963,103.931,"success I could have shown you… because this is exactly what happens in real teams."],[103.931,107.625,"Somebody rewrites a prompt to make it nicer."],[107.625,109.976,"Somebody tidies the wording."],[109.976,113.838,"And the campaign silently loses its coherence…"],[113.838,118.287,"and nobody notices until the assets are side by side."],[118.407,124.678,"Now the business point, which is why this page matters more than the technique on it."],[124.678,127.851,"The style anchor is where your brand lives."],[127.851,128.81,"Brand colour."],[128.81,129.917,"Lens character."],[129.917,130.359,"Grade."],[130.359,130.802,"Grain."],[130.802,133.68,"You write them once, as a style anchor,"],[133.68,137.664,"and you reuse them across every asset in the campaign."],[137.784,143.165,"And next year, and for the next product, and for the product after that."],[143.165,146.529,"At that point it is no longer a prompt trick."],[146.529,152.807,"It is a brand asset, stored in a file, that anyone on your team can pick up and use!"],[152.807,155.946,"That is the moment prompting stops being a"],[155.946,160.58,"personal skill… and starts being an organisational capability."],[160.7,161.61,"Hold that thought."],[161.61,163.886,"We come back to it at the end of the session."]],"transcript":"Three more levers for consistency. They are small… and they matter more than anything else in this session. Lever one: repeat the subject description word for word. Not approximately… word for word! A sixty-year-old fisherman, and the old fisherman, are, to the model, two different people. It has no memory of your last prompt. So synonyms are not elegance here. Synonyms are drift. Copy and paste your subject sentence into every single shot. Lever two: use image-to-video, not text-to-video. Fix the character or the product once, with a text-to-image still. Approve that still. Then generate every shot from it. This is the single largest consistency improvement available to you… and it costs nothing! Lever three: name the key props in every shot. If the story depends on an object… the blanket, the tool, the cup, the box, mention it explicitly in every shot, even when it feels redundant. Especially when it feels redundant. Now let me break all three rules on purpose. Look at the third shot. Different colour temperature. Different grain. And the product now has a different weave from the first shot! Now I restore both, and generate again. Same film. Same product. Same campaign! That failure was more instructive than any success I could have shown you… because this is exactly what happens in real teams. Somebody rewrites a prompt to make it nicer. Somebody tidies the wording. And the campaign silently loses its coherence… and nobody notices until the assets are side by side. Now the business point, which is why this page matters more than the technique on it. The style anchor is where your brand lives. Brand colour. Lens character. Grade. Grain. You write them once, as a style anchor, and you reuse them across every asset in the campaign. And next year, and for the next product, and for the product after that. At that point it is no longer a prompt trick. It is a brand asset, stored in a file, that anyone on your team can pick up and use! That is the moment prompting stops being a personal skill… and starts being an organisational capability. Hold that thought. We come back to it at the end of the session."},{"n":17,"title":"The Default Business Workflow","durationSec":150.38,"audio":"assets/audio/en/slide-17.m4a","image":"assets/slides/en/slide-17.png","cues":[[0.006,3.221,"Here is the entire method on one page!"],[3.221,10.835,"This is the default business workflow, and it is exactly what I am about to run on screen."],[10.835,12.104,"One: the brief."],[12.104,14.303,"Not what image do we want."],[14.303,16.333,"What must this asset do?"],[16.333,20.986,"Who sees it, where, and what should they do afterwards?"],[20.986,23.44,"Two: the fidelity tier check."],[23.56,25.719,"Tier one, two, or three."],[25.719,32.285,"This decides whether you need a real photograph in hand before you begin."],[32.285,34.804,"Three: capability selection."],[34.804,38.043,"Text-to-image to decide the subject."],[38.043,40.831,"Image-to-video to make it move."],[40.831,42.36,"Four: the prompt."],[42.36,43.53,"Six elements."],[43.53,48.567,"Subject, action, setting, camera movement, style, audio."],[48.567,50.816,"Five: the reference lock."],[50.936,56.055,"An approved subject still, plus your brand style anchor."],[56.055,58.979,"Written once, reused everywhere!"],[58.979,61.356,"Six: generate short shots."],[61.356,63.64,"Five to ten seconds each."],[63.64,65.468,"Seven: human review."],[65.468,66.382,"Brand fit."],[66.382,70.221,"Factual accuracy against the real product."],[70.221,71.135,"Artefacts!"],[71.135,73.237,"Representation… Rights."],[73.357,76.941,"Eight: provenance mark and disclosure label,"],[76.941,80.851,"for the platform you are actually publishing on."],[80.851,85.413,"Nine: publish, and store the prompt in the team library."],[85.413,86.553,"Let me run it."],[86.553,92.092,"Watch the length of each clip… About five seconds… About eight… Six."],[92.092,94.454,"That is not the tool failing."],[94.574,97.665,"That is the current reality of this technology,"],[97.665,100.427,"and I want you to hear it plainly, because"],[100.427,105.819,"managing this one expectation will save you a great deal of frustration next week."],[105.819,109.633,"Most tools generate roughly five to ten seconds at a time,"],[109.633,112.723,"and consistency degrades as a clip gets longer."],[112.723,114.893,"So a brand film is not generated."],[115.013,118.77,"A brand film is assembled — from many short shots,"],[118.77,124.104,"held together by one style anchor, and cut together in a normal editor."],[124.104,130.866,"If you go back to your office and try to produce a sixty second film from a single prompt,"],[130.866,131.918,"you will fail."],[131.918,136.125,"And you will conclude that the technology does not work."],[136.125,137.102,"It does work."],[137.222,140.56,"It works at eight seconds at a time!"],[140.56,145.753,"Plan for eight seconds, and you will look like a genius."],[145.753,150.39,"Plan for sixty, and you will look like a beginner."]],"transcript":"Here is the entire method on one page! This is the default business workflow, and it is exactly what I am about to run on screen. One: the brief. Not what image do we want. What must this asset do? Who sees it, where, and what should they do afterwards? Two: the fidelity tier check. Tier one, two, or three. This decides whether you need a real photograph in hand before you begin. Three: capability selection. Text-to-image to decide the subject. Image-to-video to make it move. Four: the prompt. Six elements. Subject, action, setting, camera movement, style, audio. Five: the reference lock. An approved subject still, plus your brand style anchor. Written once, reused everywhere! Six: generate short shots. Five to ten seconds each. Seven: human review. Brand fit. Factual accuracy against the real product. Artefacts! Representation… Rights. Eight: provenance mark and disclosure label, for the platform you are actually publishing on. Nine: publish, and store the prompt in the team library. Let me run it. Watch the length of each clip… About five seconds… About eight… Six. That is not the tool failing. That is the current reality of this technology, and I want you to hear it plainly, because managing this one expectation will save you a great deal of frustration next week. Most tools generate roughly five to ten seconds at a time, and consistency degrades as a clip gets longer. So a brand film is not generated. A brand film is assembled — from many short shots, held together by one style anchor, and cut together in a normal editor. If you go back to your office and try to produce a sixty second film from a single prompt, you will fail. And you will conclude that the technology does not work. It does work. It works at eight seconds at a time! Plan for eight seconds, and you will look like a genius. Plan for sixty, and you will look like a beginner."},{"n":18,"title":"Rights, Disclosure, and Trust","durationSec":203.15,"audio":"assets/audio/en/slide-18.m4a","image":"assets/slides/en/slide-18.png","cues":[[0.01,6.682,"Third message of the day: for business, one impressive image is not the deliverable!"],[6.682,9.939,"Repeatable consistency, factual fidelity,"],[9.939,14.944,"cleared rights, and honest disclosure… That is the deliverable!"],[14.944,20.901,"A beautiful asset you cannot reproduce… or that misrepresents your product,"],[20.901,22.093,"is a liability."],[22.093,23.443,"Four obligations."],[23.563,29.661,"And one disclaimer first, which I will not skip: this is not legal advice!"],[29.661,32.298,"I am a trainer, not your lawyer."],[32.298,38.396,"Regulation in this area is moving quickly, and it differs by jurisdiction."],[38.396,42.351,"What I am teaching you is the habit of checking."],[42.351,43.67,"One: disclosure."],[43.79,46.947,"In the European Union, Article fifty of the"],[46.947,52.82,"Artificial Intelligence Act applies from the second of August twenty twenty-six."],[52.82,56.711,"A deepfake, meaning a synthetic or manipulated image,"],[56.711,59.942,"audio, or video that would falsely appear to"],[59.942,65.595,"a person to be authentic… must be disclosed to the viewer, at first exposure!"],[65.715,69.684,"And here is the detail that catches people out."],[69.684,75.597,"An embedded, machine-readable mark alone does not discharge that duty."],[75.597,80.326,"A provenance mark is a technical signal inside the file."],[80.326,84.971,"A disclosure label is a message a human being can read."],[85.091,91.09,"They are different objects, doing different jobs… and you may well need both."],[91.09,95.608,"For systems already placed on the market before that date,"],[95.608,99.815,"the machine-readable marking duty under Article fifty,"],[99.815,105.19,"paragraph two, applies from the second of December twenty twenty-six."],[105.19,106.826,"Two: platform labels."],[106.946,110.989,"Completely independently of any law, the major"],[110.989,114.592,"advertising and social platforms each run"],[114.592,121.711,"their own artificial intelligence labelling rule… And they are not the same rule!"],[121.711,125.05,"Check the one you actually publish on."],[125.05,126.017,"Every time."],[126.017,127.951,"Three: substantiation."],[127.951,132.433,"Generating an image does not relax advertising law!"],[132.553,136.083,"Your claims still need evidence… and a generated"],[136.083,140.717,"image must not materially mislead a consumer about the product."],[140.717,145.498,"This is exactly the tier one problem from earlier in the session,"],[145.498,148.146,"now with a regulator attached to it."],[148.146,149.912,"Four: likeness and data."],[149.912,155.208,"Get consent before you generate the face of a real, identifiable person!"],[155.328,158.207,"Some jurisdictions now impose specific"],[158.207,162.374,"advertising disclosure duties for synthetic performers."],[162.374,165.708,"And the one businesses most often get wrong:"],[165.708,168.511,"do not upload customer personal data,"],[168.511,172.148,"employee records, or unreleased product designs…"],[172.148,177.983,"to a tool whose terms of service and data retention policy you have not read!"],[178.103,180.485,"Your prompt is an upload."],[180.485,182.2,"Treat it like one."],[182.2,187.155,"Our demonstration asset is finished, and it is good."],[187.155,190.491,"Two questions before we publish it."],[190.491,192.301,"What must we label?"],[192.301,196.113,"And on which platform, under which rule?"],[196.113,201.163,"If you cannot answer both, the asset is not finished."],[201.163,203.164,"It is only generated."]],"transcript":"Third message of the day: for business, one impressive image is not the deliverable! Repeatable consistency, factual fidelity, cleared rights, and honest disclosure… That is the deliverable! A beautiful asset you cannot reproduce… or that misrepresents your product, is a liability. Four obligations. And one disclaimer first, which I will not skip: this is not legal advice! I am a trainer, not your lawyer. Regulation in this area is moving quickly, and it differs by jurisdiction. What I am teaching you is the habit of checking. One: disclosure. In the European Union, Article fifty of the Artificial Intelligence Act applies from the second of August twenty twenty-six. A deepfake, meaning a synthetic or manipulated image, audio, or video that would falsely appear to a person to be authentic… must be disclosed to the viewer, at first exposure! And here is the detail that catches people out. An embedded, machine-readable mark alone does not discharge that duty. A provenance mark is a technical signal inside the file. A disclosure label is a message a human being can read. They are different objects, doing different jobs… and you may well need both. For systems already placed on the market before that date, the machine-readable marking duty under Article fifty, paragraph two, applies from the second of December twenty twenty-six. Two: platform labels. Completely independently of any law, the major advertising and social platforms each run their own artificial intelligence labelling rule… And they are not the same rule! Check the one you actually publish on. Every time. Three: substantiation. Generating an image does not relax advertising law! Your claims still need evidence… and a generated image must not materially mislead a consumer about the product. This is exactly the tier one problem from earlier in the session, now with a regulator attached to it. Four: likeness and data. Get consent before you generate the face of a real, identifiable person! Some jurisdictions now impose specific advertising disclosure duties for synthetic performers. And the one businesses most often get wrong: do not upload customer personal data, employee records, or unreleased product designs… to a tool whose terms of service and data retention policy you have not read! Your prompt is an upload. Treat it like one. Our demonstration asset is finished, and it is good. Two questions before we publish it. What must we label? And on which platform, under which rule? If you cannot answer both, the asset is not finished. It is only generated."},{"n":19,"title":"Building a Repeatable Team Practice","durationSec":127.37,"audio":"assets/audio/en/slide-19.m4a","image":"assets/slides/en/slide-19.png","cues":[[0.014,2.217,"Everything so far is a skill."],[2.217,5.179,"And a skill lives in one person's head,"],[5.179,9.052,"and it leaves the building when that person leaves."],[9.052,14.824,"Here is how you turn it into a capability that belongs to your organisation!"],[14.824,15.963,"Four artefacts."],[15.963,17.938,"None of them is expensive."],[17.938,20.899,"One: a written prompt template library."],[21.019,26.5,"Every prompt that produced a published asset goes into a shared file,"],[26.5,30.154,"with the tool name, the date, and the licence."],[30.154,33.808,"Not a folder of pictures… a folder of recipes!"],[33.808,36.27,"Two: an approved reference set."],[36.27,40.559,"The locked subject images, and the brand style anchor."],[40.679,48.156,"Once these exist, a new colleague can produce an on-brand asset on their first afternoon,"],[48.156,52.692,"because the hard decisions were made once, and stored."],[52.692,57.144,"Three: a review step with a named person accountable."],[57.144,59.16,"Not the team reviews it."],[59.16,59.748,"A name!"],[59.748,63.193,"Automation changes who produces the work."],[63.313,66.625,"It does not change who is accountable for it."],[66.625,68.613,"Four: a disclosure default."],[68.613,72.294,"Decide once, in advance, what you label and where,"],[72.294,75.312,"so that nobody has to make that judgement"],[75.312,79.729,"under deadline pressure… at four o'clock on a Friday, alone."],[79.729,83.631,"One more note for the library, and it is a legal one."],[83.751,89.953,"The copyright position of artificially generated output varies by jurisdiction,"],[89.953,91.68,"and it is not settled."],[91.68,95.291,"Rights in training data are actively disputed."],[95.411,100.261,"And generated images can accidentally contain a third-party logo,"],[100.261,106.903,"a trademarked character, or a recognisable building design… So record what you generated,"],[106.903,110.783,"with which tool, under which licence, on which date."],[110.783,113.395,"That record is almost free to keep."],[113.395,117.499,"And if it is ever questioned, it is extremely valuable!"],[117.619,118.861,"Four artefacts."],[118.861,119.689,"A library."],[119.689,121.014,"A reference set."],[121.014,122.422,"A named approver."],[122.422,124.16,"A disclosure default."],[124.16,127.389,"That is the entire organisational work!"]],"transcript":"Everything so far is a skill. And a skill lives in one person's head, and it leaves the building when that person leaves. Here is how you turn it into a capability that belongs to your organisation! Four artefacts. None of them is expensive. One: a written prompt template library. Every prompt that produced a published asset goes into a shared file, with the tool name, the date, and the licence. Not a folder of pictures… a folder of recipes! Two: an approved reference set. The locked subject images, and the brand style anchor. Once these exist, a new colleague can produce an on-brand asset on their first afternoon, because the hard decisions were made once, and stored. Three: a review step with a named person accountable. Not the team reviews it. A name! Automation changes who produces the work. It does not change who is accountable for it. Four: a disclosure default. Decide once, in advance, what you label and where, so that nobody has to make that judgement under deadline pressure… at four o'clock on a Friday, alone. One more note for the library, and it is a legal one. The copyright position of artificially generated output varies by jurisdiction, and it is not settled. Rights in training data are actively disputed. And generated images can accidentally contain a third-party logo, a trademarked character, or a recognisable building design… So record what you generated, with which tool, under which licence, on which date. That record is almost free to keep. And if it is ever questioned, it is extremely valuable! Four artefacts. A library. A reference set. A named approver. A disclosure default. That is the entire organisational work!"},{"n":20,"title":"Conclusions and Questions","durationSec":118.19,"audio":"assets/audio/en/slide-20.m4a","image":"assets/slides/en/slide-20.png","cues":[[0.019,1.261,"Three messages."],[1.261,3.082,"And then one question."],[3.082,5.564,"One: the model does not guess!"],[5.564,9.289,"Anything you leave out, it decides at random."],[9.289,15.082,"An unspecified dimension is not a neutral default… It is a delegation."],[15.082,18.972,"Two: a prompt is a shooting script, not a wish."],[18.972,23.524,"For every adjective, ask how a camera would capture it?"],[23.644,28.487,"If you cannot answer, replace the adjective with an action,"],[28.487,31.36,"a light position, or a composition."],[31.36,36.696,"Three: for business, one impressive image is not the deliverable!"],[36.696,38.584,"Repeatable consistency."],[38.584,39.979,"Factual fidelity."],[39.979,41.21,"Cleared rights."],[41.21,42.688,"Honest disclosure."],[42.808,45.534,"A beautiful asset you cannot reproduce,"],[45.534,49.098,"or that misrepresents your product… is a liability."],[49.098,51.754,"And the whole session in one sentence."],[51.754,56.158,"Generative AI removes the production bottleneck from marketing."],[56.158,59.233,"It does not remove the judgement bottleneck!"],[59.353,62.661,"The businesses that benefit are the ones that"],[62.661,67.292,"pair a disciplined prompt method with an honest fidelity check,"],[67.292,70.379,"and a named person who approves the asset."],[70.379,72.658,"The tool will change next year."],[72.658,77.068,"The method, the tier check, and the accountability will not!"],[77.068,78.539,"Your course project?"],[78.659,82.319,"Produce one tier one catalogue product image,"],[82.319,86.142,"built from a real photograph of a real product."],[86.142,93.057,"And one eight second, three shot brand video… held together by a single style anchor."],[93.057,95.823,"Submit the assets and the prompts."],[95.823,98.995,"The prompts are half of the assessment,"],[98.995,103.225,"because the prompts are the part that is repeatable!"],[103.345,107.582,"Now the question I want you to answer before you leave."],[107.582,110.663,"Which one asset will you make on Monday?"],[110.663,112.974,"And which fidelity tier is it?"],[112.974,114.284,"Hold that answer."],[114.284,117.442,"That is where the course actually starts!"],[117.442,118.212,"Thank you."]],"transcript":"Three messages. And then one question. One: the model does not guess! Anything you leave out, it decides at random. An unspecified dimension is not a neutral default… It is a delegation. Two: a prompt is a shooting script, not a wish. For every adjective, ask how a camera would capture it? If you cannot answer, replace the adjective with an action, a light position, or a composition. Three: for business, one impressive image is not the deliverable! Repeatable consistency. Factual fidelity. Cleared rights. Honest disclosure. A beautiful asset you cannot reproduce, or that misrepresents your product… is a liability. And the whole session in one sentence. Generative AI removes the production bottleneck from marketing. It does not remove the judgement bottleneck! The businesses that benefit are the ones that pair a disciplined prompt method with an honest fidelity check, and a named person who approves the asset. The tool will change next year. The method, the tier check, and the accountability will not! Your course project? Produce one tier one catalogue product image, built from a real photograph of a real product. And one eight second, three shot brand video… held together by a single style anchor. Submit the assets and the prompts. The prompts are half of the assessment, because the prompts are the part that is repeatable! Now the question I want you to answer before you leave. Which one asset will you make on Monday? And which fidelity tier is it? Hold that answer. That is where the course actually starts! Thank you."}]}};
const DEMOS = {"note":{"fr":"Chaque extrait ci-dessous est généré par intelligence artificielle à partir du prompt affiché sous lui. Les images et les vidéos sont produites par le formateur, Yuefeng SUN, avec Alibaba Cloud Model Studio (HappyHorse / WAN). Les exemples de prompts restent en anglais : c'est la langue dans laquelle les modèles de génération sont les plus précis. Les extraits sont coupés par le lecteur, ils se jouent donc sous la narration sans la couvrir.","en":"Every clip below is generated by artificial intelligence from the prompt displayed under it. The images and the videos are produced by the trainer, Yuefeng SUN, with Alibaba Cloud Model Studio (HappyHorse / WAN). Prompt examples stay in English: it is the language in which generation models are most accurate. The clips are muted by the player, so they play underneath the narration without covering it."},"disclaimer":{"fr":"Ces exemples vidéo sont des supports d'observation, pas des garanties de résultat. Ils sont publiés ici à des fins pédagogiques : aucune licence de réutilisation n'est accordée, et toute réutilisation doit être demandée à leur auteur.","en":"These video examples are material for observation, not a guarantee of results. They are published here for teaching purposes: no reuse licence is granted, and any reuse must be requested from their author."},"slides":{"7":[{"title":{"fr":"Le prompt complet qui a produit l'extrait","en":"The full prompt behind the clip"},"lead":{"fr":"Un seul prompt, entièrement spécifié : durée, mouvement de caméra, jeu des personnages, arrière-plan, lumière, style. Rien n'est laissé au hasard, donc rien n'est décidé au hasard.","en":"One prompt, fully specified: duration, camera move, character performance, background, light, style. Nothing is left to chance, so nothing is decided by chance."},"items":[{"label":{"fr":"Travelling arrière au coucher du soleil","en":"Dolly out at sunset"},"src":"../lab/assets/demos/media/slide20.mp4","poster":"../lab/assets/demos/posters/slide20.jpg","sec":10.1,"prompt":"A cinematic 10-second video based on the input image. The camera performs a slow and smooth dolly out (pull back) movement, gradually revealing more of the romantic riverside environment. The young European couple remains seated on the stone steps. The man gently brushes a strand of hair behind the woman's ear, and they share a loving glance before both turning to look at the sunset. The wind softly blows through their hair and clothes. In the background, the Eiffel Tower sparkles under the twilight sky, and the river water flows naturally with realistic light reflections. Warm golden hour lighting, photorealistic, highly detailed, slow-motion romantic atmosphere."},{"label":{"fr":"Intention contre description","en":"Intent versus description"},"prompt":"Weak: \"show that he is nervous\". Strong: \"close-up on fingers repeatedly rubbing the edge of the phone\"."}]}],"8":[{"title":{"fr":"Les six éléments, ligne par ligne","en":"The six elements, line by line"},"lead":{"fr":"Le même découpage que la formule : sujet, action, décor, caméra, style, audio. Chaque ligne porte une information différente, aucune n'est répétée.","en":"The same breakdown as the formula: subject, action, setting, camera, style, audio. Each line carries different information, none of it repeated."},"items":[{"label":{"fr":"Application de la formule en six éléments","en":"The six-element formula applied"},"src":"../lab/assets/demos/media/slide33.mp4","poster":"../lab/assets/demos/posters/slide33.jpg","sec":8.1,"prompt":"Subject: A thirty-year-old Asian woman, shoulder-length black hair, wearing a navy blue suit. Action & Motion: She slowly extends her right hand, fingertips touching the water surface, ripples spreading outward. Scene & Environment: A Tokyo street after rain, wet asphalt reflecting neon lights. Camera Movement: The camera slowly dollies in from a wide shot to a facial close-up. Style & Mood: Cinematic, warm tones, 35mm film grain, shallow depth of field. Audio: Soft piano score, distant ocean waves and seagull calls."}]}],"10":[{"title":{"fr":"Élément 5 — le style : température et saturation","en":"Element 5 — style: temperature and saturation"},"lead":{"fr":"Quatre extraits, quatre palettes, quatre décors sans rapport : c'est le réglage de couleur qui porte l'émotion, quel que soit le lieu. C'est aussi là que naît le « look IA » quand il est poussé trop loin.","en":"Four clips, four palettes, four unrelated settings: the colour grade is what carries the emotion, whatever the place. It is also where the \"AI look\" is born when pushed too far."},"items":[{"label":{"fr":"Tons chauds","en":"Warm Tone"},"src":"../lab/assets/demos/media/slide28_1.mp4","poster":"../lab/assets/demos/posters/slide28_1.jpg","sec":15.3,"prompt":"[Style] Cinematic romantic drama, warm color palette dominated by golden hour sunlight, amber and soft orange hues. Photorealistic, 35mm film grain texture.[Scene] A rustic countryside terrace in Tuscany at sunset. The background features rolling hills of wheat fields glowing under the sun and an old stone farmhouse with climbing ivy.[Characters] A young European couple, Lucas and Sophie. Lucas wears a loose white linen shirt; Sophie wears a light yellow floral sundress.[Action & Camera][00:00-00:05] Medium shot. They are sitting at a wooden table sharing a plate of grapes. The camera slowly pushes in. Lucas looks at Sophie with deep affection, smiling gently.[00:05-00:10] Close-up on Sophie. She laughs shyly, tucking a strand of hair behind her ear. The warm backlight creates a halo effect on her hair.[00:10-00:15] Two-shot profile. They lean in closer, foreheads almost touching, enjoying the peaceful moment.[Audio & Dialogue]Background Music: A slow, acoustic guitar melody mixed with the sound of cicadas and a gentle breeze.Dialogue (French): Lucas whispers softly, \"Tu es magnifique ce soir.\" (You are magnificent tonight.) Sophie replies with a giggle, \"Et toi, tu es romantique.\" (And you, you are romantic.)[Atmosphere] The lighting is soft and diffused, evoking a sense of nostalgia and eternal love."},{"label":{"fr":"Tons froids","en":"Cool Tone"},"src":"../lab/assets/demos/media/slide28_2.mp4","poster":"../lab/assets/demos/posters/slide28_2.jpg","sec":15.2,"prompt":"[Style] Melancholic urban drama, cold color palette dominated by steel blue, cyan, and desaturated grey tones. High contrast, neon reflections on wet surfaces.[Scene] A narrow street in Paris at night, raining heavily. Steam rises from a subway grate. The environment feels isolating and damp.[Characters] Thomas and Camille. Thomas wears a dark trench coat; Camille wears a thin grey wool coat, shivering slightly.[Action & Camera][00:00-00:05] Wide shot. They stand apart under a streetlamp, the rain forming a curtain between them. The camera is static, emphasizing the distance.[00:05-00:10] Over-the-shoulder shot from Thomas's perspective. Focus on Camille’s face, illuminated by the cold blue street light. Her eyes are red-rimmed, expressionless but holding back tears.[00:10-00:15] Extreme close-up on their hands. Thomas reaches out but stops mid-air, then drops his hand. Camille turns away into the darkness.[Audio & Dialogue]Background Music: A lonely, minimal piano melody accompanied by the heavy sound of rain hitting the pavement and distant thunder.Dialogue (French): Thomas says with a trembling voice, \"C'est fini, n'est-ce pas ?\" (It's over, isn't it?) Camille answers coldly without looking back, \"Il faut qu'on arrête.\" (We need to stop.)[Atmosphere] The scene conveys a heavy heartbreak, where the cold environment mirrors their internal emotional freeze."},{"label":{"fr":"Saturation forte","en":"High Saturation"},"src":"../lab/assets/demos/media/slide28_3.mp4","poster":"../lab/assets/demos/posters/slide28_3.jpg","sec":15.3,"prompt":"[Style] Vibrant pop-art aesthetic, high saturation, vivid primary colors (red, yellow, electric blue). Wes Anderson-inspired symmetry and whimsical vibe.[Scene] A lively amusement park by the sea. Brightly colored balloons, a red Ferris wheel against a deep azure sky, and colorful confetti in the air.[Characters] Leo and Julie. Leo wears a bright red jacket; Julie wears a turquoise skirt and oversized sunglasses.[Action & Camera][00:00-00:05] Dynamic tracking shot. They are running hand-in-hand through the crowd, laughing hysterically. The camera moves fast, matching their energy.[00:05-00:10] Low angle shot. They are on a carousel, waving at the camera. The colors of the carousel lights swirl around them.[00:10-00:15] Medium shot. They stop to eat bright pink cotton candy, making funny faces at each other.[Audio & Dialogue]Background Music: Upbeat electro-swing music, fast tempo, mixed with the sounds of carnival rides and children cheering.Dialogue (French): Julie shouts excitedly, \"Regarde, c'est comme un rêve !\" (Look, it's like a dream!) Leo replies energetically, \"On ne rentre jamais !\" (We never go home!)[Atmosphere] An explosion of joy and visual energy, capturing the peak of youthful adrenaline."},{"label":{"fr":"Saturation faible","en":"Low Saturation"},"src":"../lab/assets/demos/media/slide28_4.mp4","poster":"../lab/assets/demos/posters/slide28_4.jpg","sec":15.3,"prompt":"[Style] Gritty historical realism, low saturation, desaturated earth tones, muted greens and greys. Soft, flat lighting typical of an overcast day.[Scene] An abandoned train station platform in Eastern Europe. Cracked concrete, rusty tracks, and thick fog obscuring the horizon.[Characters] Antoine and Elena. Both look tired, wearing worn-out, dusty beige coats. Their faces show signs of hardship.[Action & Camera][00:00-00:05] Long shot. Antoine stands alone on the platform, a silhouette in the fog. A train whistle blows in the distance.[00:05-00:10] Medium shot. Elena walks towards him slowly. There is no running, just a heavy, deliberate walk.[00:10-00:15] Close-up. They embrace tightly, burying their faces in each other's shoulders. The camera lingers on their exhausted expressions, finding solace in the bleakness.[Audio & Dialogue]Background Music: A low, droning cello sound, wind howling through the station, and the metallic screech of train wheels.Dialogue (French): Antoine murmurs hoarsely, \"Je croyais t'avoir perdue.\" (I thought I had lost you.) Elena whispers, \"Nous sommes vivants. C'est tout.\" (We are alive. That is all.)[Atmosphere] A somber, grounded reality where the lack of color emphasizes the raw human connection amidst despair."}]}],"12":[{"title":{"fr":"La source de lumière","en":"The light source"},"lead":{"fr":"Même action, même cadre, deux sources opposées. Nommer la source dans le prompt est ce qui rend l'éclairage reproductible.","en":"Same action, same setting, two opposing sources. Naming the source in the prompt is what makes the lighting reproducible."},"items":[{"label":{"fr":"Lumière nocturne","en":"Moonlight"},"src":"../lab/assets/demos/media/slide22_2.mp4","poster":"../lab/assets/demos/posters/slide22_2.jpg","sec":5.2,"prompt":"Like a classic scene straight out of Roman Holiday, the two of them pulled over on a Vespa in the streets of Rome. It was a blue moonlit night, with the light casting from their rear three-quarter angle. It traced a beautiful rim light along their jawlines and hair, perfectly separating the subjects from the dark background. The woman nestled against the man's back, eyes closed, reluctant to let go. The man gazed into the distance and let out a deep sigh"},{"label":{"fr":"Lumière diffuse","en":"Overcast Light"},"src":"../lab/assets/demos/media/slide22_4.mp4","poster":"../lab/assets/demos/posters/slide22_4.jpg","sec":5.2,"prompt":"Like a classic scene straight out of Roman Holiday, the two europeans of them cruised slowly through the streets of Rome on a Vespa. It was a rainy, overcast day, with the sky wrapped in soft, diffused light tinted with cool blue hues. With their parting imminent, their faces betrayed a sense of reluctance and a trace of sorrow."}]},{"title":{"fr":"La direction et la qualité","en":"Direction and quality"},"lead":{"fr":"Douce, zénithale, en contre-jour, par en dessous : quatre directions, quatre lectures du même personnage.","en":"Soft, top, back and under light: four directions, four readings of the same character."},"items":[{"label":{"fr":"Lumière douce","en":"Soft Light"},"src":"../lab/assets/demos/media/slide23_1.mp4","poster":"../lab/assets/demos/posters/slide23_1.jpg","sec":5.2,"prompt":"A table lamp with a soft shade, or natural light filtering through sheer curtains, evenly and gently illuminates the faces of the Godfather and Bonasera. The Godfather appears as a benevolent elder, patiently listening to Bonasera's troubles; the two share a warm, human conversation, much like friendly neighbors chatting."},{"label":{"fr":"Lumière zénithale","en":"Top Light"},"src":"../lab/assets/demos/media/slide23_2.mp4","poster":"../lab/assets/demos/posters/slide23_2.jpg","sec":5.2,"prompt":"The entire room is engulfed in darkness, with the light source positioned directly above the Godfather's head. His eye sockets sink into pitch-black shadows, revealing only his high forehead and cheekbones. The heavy shadows cast by the top light render the Godfather's gaze inscrutable, making him appear like an aloof 'judge' presiding from on high. Bonasera, by contrast, is placed in a relatively vulnerable position, and the whole space is saturated with a suffocating sense of oppression, mystery, and unquestionable authority."},{"label":{"fr":"Contre-jour","en":"Back Light"},"src":"../lab/assets/demos/media/slide23_3.mp4","poster":"../lab/assets/demos/posters/slide23_3.jpg","sec":5.2,"prompt":"The entire room is plunged into darkness, with the light source shifted to the window behind them. The intense backlight turns the Godfather and Bonasera into deep silhouettes, their forms traced only by a cold rim of light. With their expressions obscured, all that remains are two solitary black figures. This enhances the sense of alienation and fatalism in the frame, as if implying that both characters are trapped within a dark system from which they cannot escape—filled with loneliness, contemplation, and a touch of tragic heroism."},{"label":{"fr":"Éclairage par en dessous","en":"Under Light"},"src":"../lab/assets/demos/media/slide23_4.mp4","poster":"../lab/assets/demos/posters/slide23_4.jpg","sec":5.2,"prompt":"The Godfather and Bonasera sit around an eerie bonfire, with light illuminating the Godfather's face from below. This lighting distorts his facial structure, transforming him from a rational ruler into a raving, sinister monster with almost supernatural undertones. The mob negotiation takes on the chilling atmosphere of a horror movie, plunging the audience into extreme unease and grotesqueness."}]},{"title":{"fr":"L'heure de la journée","en":"The time of day"},"lead":{"fr":"Jour, nuit, aube, crépuscule. L'heure est une instruction de production, pas une ambiance : elle fixe la hauteur du soleil, la température et la longueur des ombres.","en":"Day, night, dawn, dusk. The hour is a production instruction, not a mood: it fixes the height of the sun, the temperature and the length of the shadows."},"items":[{"label":{"fr":"Plein jour","en":"Daytime (The Fiery Passion of New Love)"},"src":"../lab/assets/demos/media/slide24_1.mp4","poster":"../lab/assets/demos/posters/slide24_1.jpg","sec":5.2,"prompt":"With the sun high overhead, intense direct sunlight makes the entire scene vibrant and saturated, pushing color richness to its peak. Dappled yet sharply defined shadows fall under the trees, and their smiles blossom openly in the sunshine. Perhaps they are sharing a parasol or running and laughing freely down the street, with sweat and sunlight intertwining. This high-contrast, energetic lighting symbolizes the most intense and straightforward phase of love—no secrets, no hiding, just the bubbling sweetness and passion, much like a fizzy summer soda."},{"label":{"fr":"Nuit","en":"Night (The Quiet Intimacy of Devotion)"},"src":"../lab/assets/demos/media/slide24_2.mp4","poster":"../lab/assets/demos/posters/slide24_2.jpg","sec":5.2,"prompt":"As night falls, city neon signs and street lamps become the key light sources. Dim streetlights cast overlapping shadows at their feet. The surroundings darken, and the lighting isolates them from the bustling world, creating a private space that belongs only to them. Perhaps they are in a dimly lit bistro, where the warm yellow halo of a table lamp illuminates only each other's faces. This low-key, focused nighttime lighting creates an immense sense of security and intimacy, suggesting that their relationship has settled into a deeper stage of soulful connection and quiet companionship."},{"label":{"fr":"Lever du soleil","en":"Sunrise (The Fluttering Heartbeat of First Sight)"},"src":"../lab/assets/demos/media/slide24_3.mp4","poster":"../lab/assets/demos/posters/slide24_3.jpg","sec":5.2,"prompt":"The first rays of morning sun pierce through the mist, casting a fresh and translucent pale gold hue. The light falls gently upon them, as if outlining their silhouettes with a dreamlike glow. The scene is brimming with vitality and hope, with the flow of light and shadow feeling incredibly dynamic. The girl, wearing a fresh dress, turns back in the morning light, while the boy shyly hands her a cup of hot coffee. This clear, bright natural light perfectly highlights the cautious tentativeness, pure palpitations, and beautiful expectations—like spring buds breaking through the soil—of their first date."},{"label":{"fr":"Coucher du soleil — heure magique","en":"Sunset (The Tender Intimacy of Ambiguity)"},"src":"../lab/assets/demos/media/slide24_4.mp4","poster":"../lab/assets/demos/posters/slide24_4.jpg","sec":5.2,"prompt":"We arrive at the most enchanting \"Magic Hour\" in cinematography. As the sun sets, the sky is painted in rich oranges and romantic pinks and purples, and the light becomes exceptionally soft and layered. Backlighting or rim lighting elongates their figures, tracing their hair and shoulders with a stunning golden outline. They sit side by side on a bench watching the twilight, exchanging glances filled with unspoken words. This warm, hazy, and slightly melancholic light is perfect for expressing the ultimate tenderness, lingering ambiguity, and deep affection that wishes to freeze time in this very moment."}]}],"13":[{"title":{"fr":"Composer le cadre","en":"Composing the frame"},"lead":{"fr":"Centrée, symétrique, équilibrée, décentrée. La composition choisie dit au spectateur où regarder — et laisse, ou non, la place au texte publicitaire.","en":"Centred, symmetrical, balanced, off-centre. The chosen composition tells the viewer where to look — and leaves room for advertising copy, or does not."},"items":[{"label":{"fr":"Composition centrée","en":"Centered Composition"},"src":"../lab/assets/demos/media/slide25_1.mp4","poster":"../lab/assets/demos/posters/slide25_1.jpg","sec":5.2,"prompt":"A cinematic medium shot using central composition. A young couple stands perfectly in the center of the frame, facing each other intimately under soft golden hour lighting. The background is a blurred park pathway that naturally guides the eye to their faces in the middle. The visual focus is intensely concentrated on their emotional connection, creating a solemn and romantic atmosphere. High resolution, shallow depth of field."},{"label":{"fr":"Composition symétrique","en":"Symmetrical Composition"},"src":"../lab/assets/demos/media/slide25_2.mp4","poster":"../lab/assets/demos/posters/slide25_2.jpg","sec":5.2,"prompt":"A wide shot featuring strict symmetrical composition. The couple sits on opposite sides of a small round table in an elegant cafe, creating a mirror-like balance. A window is perfectly centered in the background with soft daylight filtering through. The left and right sides of the frame are visually identical, evoking a sense of perfect order, harmony, and classical aesthetic beauty. Wes Anderson style symmetry."},{"label":{"fr":"Équilibre des personnages","en":"Balanced Composition"},"src":"../lab/assets/demos/media/slide25_3.mp4","poster":"../lab/assets/demos/posters/slide25_3.jpg","sec":5.2,"prompt":"An artistic shot utilizing balanced composition. The woman stands in the foreground on one side, gently holding a translucent umbrella, while the man walks towards her from the background on the opposite side. The visual weight of the close-up figure is perfectly balanced by the distant figure and the negative space, creating a dynamic yet harmonious scene. Soft ambient lighting, natural and storytelling visual flow."},{"label":{"fr":"Sujet décentré","en":"Right/Left-Focused Composition"},"src":"../lab/assets/demos/media/slide25_4.mp4","poster":"../lab/assets/demos/posters/slide25_4.jpg","sec":5.2,"prompt":"A cinematic frame employing right-weighted composition (rule of thirds). The man stands alone on the far right third of the screen, looking longingly into the vast open space on the left. The majority of the frame is filled with a beautiful, moody sunset sky (negative space), emphasizing his solitude and anticipation. The off-center placement creates strong narrative tension and an artistic, film-like mood."}]},{"title":{"fr":"L'échelle du plan","en":"Shot size"},"lead":{"fr":"Le même au revoir raconté à quatre échelles. Plus le plan est large, plus le décor parle ; plus il est serré, plus le visage parle.","en":"The same farewell told at four sizes. The wider the shot, the more the setting speaks; the tighter, the more the face speaks."},"items":[{"label":{"fr":"Gros plan","en":"Close-up"},"src":"../lab/assets/demos/media/slide26_1.mp4","poster":"../lab/assets/demos/posters/slide26_1.jpg","sec":5.2,"prompt":"A highly detailed cinematic close-up shot focusing exclusively on the face of a young European girl with soft blonde hair. She is looking slightly off-camera to her right, her eyes sparkling with the innocent light of first love. Her expression captures a fleeting moment of shyness mixed with pure joy; she bites her lower lip gently, cheeks flushing a soft pink, while a suppressed smile plays on her lips. The background is a heavily blurred bokeh of a sunlit European cobblestone street and ancient stone walls, ensuring all attention remains on her micro-expressions. The lighting is warm and golden, highlighting the texture of her skin and the emotion in her eyes. 8k resolution, photorealistic, capturing the intimate essence of a crush."},{"label":{"fr":"Plan rapproché","en":"Medium Shot"},"src":"../lab/assets/demos/media/slide26_2.mp4","poster":"../lab/assets/demos/posters/slide26_2.jpg","sec":5.2,"prompt":"A romantic medium shot featuring a young European couple standing close together on a charming old street. The camera is positioned behind the girl, showing only the back of her head and shoulders in the foreground, creating an over-the-shoulder perspective. The focus is sharply on the young man facing the camera. He has messy brown hair and is looking down at her with an expression of deep affection and adoration. He is smiling broadly, a natural, sunny, and happy grin that lights up his face, conveying the warmth of new love. The background consists of the same European architecture and stone pavement seen in previous shots, bathed in consistent afternoon sunlight. High fidelity, emotional storytelling through body language."},{"label":{"fr":"Plan d’ensemble","en":"Long Shot"},"src":"../lab/assets/demos/media/slide26_3.mp4","poster":"../lab/assets/demos/posters/slide26_3.jpg","sec":5.2,"prompt":"A serene long shot capturing the full bodies of the young European couple standing on a picturesque cobblestone street lined with vintage lamp posts. They are standing a few feet apart, facing each other in profile. The girl is on the left and the boy is on the right. Although they are distant from the camera, their connection is palpable as they gaze deeply into each other's eyes, ignoring the world around them. The surrounding environment features classic European facades and flower boxes, providing context to their date. The lighting is consistent with the previous scenes, casting long, romantic shadows on the ground. The shot emphasizes their relationship within the space, evoking a sense of timeless romance and tranquility."},{"label":{"fr":"Grand angle","en":"Wide Angle Shot"},"src":"../lab/assets/demos/media/slide26_4.mp4","poster":"../lab/assets/demos/posters/slide26_4.jpg","sec":5.2,"prompt":"A stunning wide-angle shot using a 24mm lens aesthetic, capturing the young European couple standing in the center of a grand, expansive town square paved with stones. The perspective is vast, showcasing the towering historical architecture and the sweeping sky above them. The couple appears smaller within the frame, emphasizing the grandeur of the world around them, yet they remain the focal point as they stand close, holding hands or looking at one another. The wide field of view distorts the edges slightly for a cinematic effect, drawing the eye toward the center. The atmosphere is filled with bright, natural sunlight that floods the entire scene, creating a hopeful and liberating artistic mood suitable for a movie poster."}]},{"title":{"fr":"Types de plans et points de vue","en":"Shot types and points of view"},"lead":{"fr":"Un sujet, deux sujets, un groupe, un plan de situation : quatre façons d'ouvrir une scène et de dire au spectateur qui compte.","en":"One subject, two subjects, a group, an establishing shot: four ways to open a scene and tell the viewer who matters."},"items":[{"label":{"fr":"Un personnage","en":"Single Shot"},"src":"../lab/assets/demos/media/slide27_1.mp4","poster":"../lab/assets/demos/posters/slide27_1.jpg","sec":5.3,"prompt":"A clean single shot focusing solely on the young European girl. She stands alone in the center of the frame against a softly blurred background of the old town street. There are no foreground obstructions or other people; the visual field is completely dedicated to her. She is looking slightly downward with a shy, tender smile, her blonde hair glowing in the backlight. The composition isolates her emotion, allowing the viewer to intimately connect with her inner feelings of first love. Shallow depth of field, portrait photography style, detailed facial expression."},{"label":{"fr":"Deux personnages","en":"Two Shot"},"src":"../lab/assets/demos/media/slide27_2.mp4","poster":"../lab/assets/demos/posters/slide27_2.jpg","sec":5.3,"prompt":"A classic medium two-shot capturing a young European couple standing side by side on the sunlit street. They are positioned closely together, sharing an intimate moment. The boy has his arm gently around the girl's shoulder, and they are both looking at each other with natural, happy smiles. The background features the charming European architecture slightly blurred to keep the focus on their interaction. The lighting is soft and warm, highlighting their youthful chemistry and the harmony of their relationship. Photorealistic, emotional connection."},{"label":{"fr":"Plan de groupe","en":"Group Shot"},"src":"../lab/assets/demos/media/slide27_3.mp4","poster":"../lab/assets/demos/posters/slide27_3.jpg","sec":5.3,"prompt":"A lively group shot set on the same European cobblestone street. The young couple is now surrounded by a small group of their friends (about 4-5 diverse young adults) laughing and chatting together. They are arranged naturally in a semi-circle, some sitting on a low stone wall and others standing. The scene is full of energy and camaraderie, capturing a candid moment of youth and friendship. The warm sunlight illuminates the whole group evenly. The camera captures the collective joy and social dynamic of the scene. Cinematic storytelling, vibrant atmosphere."},{"label":{"fr":"Plan de situation","en":"Establishing Shot"},"src":"../lab/assets/demos/media/slide27_4.mp4","poster":"../lab/assets/demos/posters/slide27_4.jpg","sec":5.3,"prompt":"A cinematic establishing shot using a wide-angle lens. It captures a picturesque, quiet cobblestone street in a historic European town during the golden hour. Ancient stone buildings with flower boxes line both sides of the street, and warm afternoon sunlight casts long, peaceful shadows. In the far distance, the tiny silhouettes of a young couple can be seen standing near a vintage fountain, emphasizing the grandeur of the environment and the romantic, tranquil atmosphere of the setting. High resolution, architectural beauty, serene mood."}]}],"14":[{"title":{"fr":"Travellings","en":"Dolly and tracking moves"},"lead":{"fr":"Approcher, reculer, longer, suivre. Chaque verbe donne un début et une fin au mouvement — c'est ce qui empêche le plan de dériver.","en":"Move in, move out, travel alongside, follow. Each verb gives the move a start and an end — that is what stops the shot from drifting."},"items":[{"label":{"fr":"Travelling avant","en":"Dolly in"},"src":"../lab/assets/demos/media/slide35_1.mp4","poster":"../lab/assets/demos/posters/slide35_1.jpg","sec":8.2,"prompt":"A moody urban night scene featuring a young European woman with short dark hair standing on a neon-lit street in the rain. She holds a transparent umbrella, with colorful city lights reflecting on the wet pavement. Camera: Steady dolly in movement. The camera starts from a medium-long shot and slowly pushes forward towards her upper body. The background traffic and pedestrians gradually blur out as the camera gets closer, isolating her from the chaotic environment. She looks slightly melancholic, gazing into the distance, then slowly lowers her eyes with a deep sigh. Raindrops fall naturally, realistic reflections, dramatic atmosphere. Cinematic look, cool tones, high contrast, volumetric lighting, photorealistic, 8k detail."},{"label":{"fr":"Travelling arrière","en":"Dolly-out"},"src":"../lab/assets/demos/media/slide35_2.mp4","poster":"../lab/assets/demos/posters/slide35_2.jpg","sec":8.2,"prompt":"A cinematic close-up of a young European man wearing a dark wool coat. He stands on a rooftop terrace at twilight, looking contemplative with a slight breeze messing up his hair. Camera: Slow and steady dolly out (pull back). The camera gradually moves backward and slightly upward, revealing more of the environment. As it pulls back, we see the rusty railing of the rooftop, then the sprawling city skyline behind him with thousands of windows lighting up in the evening. The movement transforms the shot from an intimate portrait into a grand wide establishing shot, emphasizing his solitude against the vast urban backdrop. Photorealistic skin texture, dramatic atmosphere, highly detailed city lights. Cinematic look, 35mm film stock, cool tones, shallow depth of field, volumetric lighting."},{"label":{"fr":"Travelling latéral","en":"Tracking"},"src":"../lab/assets/demos/media/slide35_3.mp4","poster":"../lab/assets/demos/posters/slide35_3.jpg","sec":5.3,"prompt":"An energetic scene featuring a young European woman with long wavy brown hair tied in a ponytail, running freely along a rugged coastal cliff path. She wears a white summer dress that billows dramatically in the strong sea breeze, with the vast blue ocean visible in the distance. Camera: Fast-paced tracking shot. The camera follows her movement from a side angle, maintaining a consistent distance to convey a strong sense of speed and momentum. Her hair and dress flow dynamically in the wind as she runs. The foreground grass and wildflowers blur past rapidly, while the distant waves crash against the rocks under bright daylight. Realistic motion blur, high energy, joyful atmosphere. Cinematic look, vivid colors, high contrast, photorealistic, 8k detail, volumetric fog."},{"label":{"fr":"Plan de suivi","en":"Follow shot"},"src":"../lab/assets/demos/media/slide35_4.mp4","poster":"../lab/assets/demos/posters/slide35_4.jpg","sec":8.2,"prompt":"A serene morning scene in a lush, ancient forest. A young European man in a casual olive-green hoodie and carrying a backpack hikes along a narrow dirt path covered in fallen leaves. Sun rays pierce through the dense canopy ahead, creating beautiful god rays and illuminating floating dust particles. Camera: Steady low-angle follow shot. The camera follows him from behind at a slightly lower height, gliding smoothly forward as if walking right behind him. The focus remains on his back and the path ahead, while ferns and wildflowers in the immediate foreground blur past, adding depth and a sense of journey. He occasionally reaches out to brush against the tree trunks as he passes. Natural lighting, peaceful vibe, realistic foliage details. Cinematic look, warm golden hour tones, film grain texture, photorealistic, 8k detail."}]},{"title":{"fr":"Grue, orbite et panoramiques","en":"Crane, orbit and pans"},"lead":{"fr":"Trois mouvements qui révèlent un espace, plus l'orbite qui isole un sujet en faisant tourner son décor.","en":"Three moves that reveal a space, plus the orbit that isolates a subject by revolving its background."},"items":[{"label":{"fr":"Orbite autour du sujet","en":"Orbit / Arc shot"},"src":"../lab/assets/demos/media/slide36_1.mp4","poster":"../lab/assets/demos/posters/slide36_1.jpg","sec":8.2,"prompt":"A breathtaking aerial view of a vast lavender field in Provence during the golden hour, with endless rows of purple flowers stretching to the horizon. Camera: Slow and majestic crane down (descending boom shot). The camera starts from a high-altitude bird's-eye view and gradually descends vertically towards the ground. As it lowers, a young European woman in a flowing white summer dress comes into focus, standing gracefully in the middle of the field. She looks up at the sky with her arms slightly open, enjoying the warm breeze. The descending movement transitions the perspective from an epic landscape reveal to an intimate medium shot of the woman, emphasizing her connection with nature. Soft sunset lighting, dreamy atmosphere, highly detailed flower textures. Cinematic look, 35mm film stock, warm tones, shallow depth of field, volumetric lighting."},{"label":{"fr":"Descente de grue","en":"Crane / Boom shot"},"src":"../lab/assets/demos/media/slide36_2.mp4","poster":"../lab/assets/demos/posters/slide36_2.jpg","sec":8.2,"prompt":"A cinematic medium shot of a young European woman with long wavy brunette hair, wearing an elegant vintage lace dress. She stands in a lush, sunlit English garden filled with blooming roses. Camera: Slow and smooth pan left. The camera starts focused on a cluster of vibrant red roses in the foreground, then steadily pans to the left to reveal the woman standing gracefully near an ancient stone fountain. As the camera reaches her, she turns her head slightly towards the lens with a gentle, mysterious smile. The background features a grand historic manor bathed in soft afternoon light. Highly detailed textures, photorealistic, romantic atmosphere. Cinematic look, 35mm film stock, warm tones, shallow depth of field, natural lighting."},{"label":{"fr":"Panoramique horizontal","en":"Pan Left / Right"},"src":"../lab/assets/demos/media/slide36_3.mp4","poster":"../lab/assets/demos/posters/slide36_3.jpg","sec":8.2,"prompt":"A cinematic medium shot of a young European woman with long wavy brunette hair, wearing an elegant vintage lace dress. She stands in a lush, sunlit English garden filled with blooming roses. Camera: Slow and smooth pan left. The camera starts focused on a cluster of vibrant red roses in the foreground, then steadily pans to the left to reveal the woman standing gracefully near an ancient stone fountain. As the camera reaches her, she turns her head slightly towards the lens with a gentle, mysterious smile. The background features a grand historic manor bathed in soft afternoon light. Highly detailed textures, photorealistic, romantic atmosphere. Cinematic look, 35mm film stock, warm tones, shallow depth of field, natural lighting."},{"label":{"fr":"Bascule verticale","en":"Tilt Up / Down"},"src":"../lab/assets/demos/media/slide36_4.mp4","poster":"../lab/assets/demos/posters/slide36_4.jpg","sec":8.2,"prompt":"A powerful urban scene in the financial district at noon. A young European man in a sharp, tailored navy blue suit stands confidently in front of a gleaming glass skyscraper, holding a leather briefcase. Camera: Dynamic and steady tilt up. The camera starts at a very low angle, focused on his polished dress shoes and the hem of his trousers. It then swiftly tilts upward, emphasizing his tall stature and broad shoulders, passing his determined face looking straight ahead, and continuing up to reveal the full, dizzying height of the modern glass幕墙 reflecting the bright sunlight and blue sky behind him. The rapid vertical motion conveys a strong sense of ambition, power, and success. Realistic reflections, high contrast, dramatic vibe. Cinematic look, vivid colors, crisp details, photorealistic, 8k detail."}]},{"title":{"fr":"Épaule, drone, fouetté et bascule de point","en":"Handheld, drone, whip pan and rack focus"},"lead":{"fr":"Quatre effets de style. Ils sont efficaces parce qu'ils sont rares : un plan sur dix, pas dix plans sur dix.","en":"Four style effects. They work because they are rare: one shot in ten, not ten shots in ten."},"items":[{"label":{"fr":"Caméra portée","en":"Handheld"},"src":"../lab/assets/demos/media/slide37_1.mp4","poster":"../lab/assets/demos/posters/slide37_1.jpg","sec":8.2,"prompt":"A tense action scene inside an abandoned, dusty factory with shafts of light piercing through broken windows. A young European man in a dirty white t-shirt is out of breath, looking over his shoulder nervously as if being chased. Camera: Aggressive handheld shaky footage. The camera stays close to his face in a tight medium shot, shaking violently and erratically to reflect his panic and chaotic state of mind. As he ducks beh
