me jour, même histoire… et le public sent la couture,"],[142.06,144.042,"même sans pouvoir la nommer."],[144.042,148.927,"La dérive stylistique est le véritable ennemi du travail multi-plans."],[148.927,150.343,"Pas les plans ratés."],[150.343,151.901,"Les plans incohérents."],[152.021,154.576,"L'ancre de style est la contre-mesure."],[154.576,160.091,"Écrivez-la une fois, en tête… et réutilisez-la mot pour mot sur toute la campagne."]],"transcript":"Une vidéo de marque n'est jamais un seul plan. C'est une séquence. Alors, comment écrire plusieurs plans dans un même prompt ? Il y a trois méthodes, et chacune a un coût réel. Je vais vous donner le coût, pas seulement la technique… car choisir entre elles est un jugement. Méthode A : les segments en langage naturel. Vous écrivez : le plan s'ouvre sur le métier à tisser. Puis la caméra passe aux mains. Puis on voit la couverture terminée, pliée. C'est la plus facile à écrire, la plus accessible pour un débutant, et elle convient pour deux à quatre plans. Le coût : les limites de plans sont instables. Le modèle peut fondre vos trois plans en un seul mouvement continu. Ou couper là où vous n'avez rien demandé. Méthode B : les horodatages. Vous écrivez : zéro à trois secondes, plan général de l'atelier. Trois à six, gros plan sur les mains. Six à huit, le produit fini. Les limites sont maintenant sans ambiguïté ! C'est la méthode la plus claire, et elle convient à la publicité rythmique… où la coupe doit tomber sur le temps. Le coût : le temps codé en dur précipite le modèle. Si vous donnez deux secondes à une action qui en demande quatre, le modèle n'échoue pas… il compresse. Le mouvement paraît accéléré et artificiel, et vous n'y comprendrez rien, parce que le prompt était parfaitement clair. Méthode C : l'ancre de style. Ce n'est pas vraiment une méthode de segmentation. C'est ce qui rend la segmentation supportable. Vous écrivez une déclaration de style globale, qui s'applique à tous les plans de la séquence. Quelque chose comme : tous plans, cinéma documentaire, dominante gris-bleu froid, lumière matinale à basse température de couleur, faible profondeur de champ, grain argentique trente-cinq millimètres… pas de musique. Puis vous écrivez vos plans individuels en dessous. La méthode C est la technique centrale de tout ce module, et je veux expliquer pourquoi… car ce n'est pas évident. Quand les gens font une vidéo multi-plans, l'échec dont ils se plaignent n'est presque jamais : le plan deux est laid. C'est : le plan deux a l'air d'un autre film que le plan un ! Grain chaud dans le premier. Froid, propre, numérique dans le second. Même produit, même jour, même histoire… et le public sent la couture, même sans pouvoir la nommer. La dérive stylistique est le véritable ennemi du travail multi-plans. Pas les plans ratés. Les plans incohérents. L'ancre de style est la contre-mesure. Écrivez-la une fois, en tête… et réutilisez-la mot pour mot sur toute la campagne."},{"n":16,"title":"Cohérence de marque : l'ancre de style","durationSec":162.43,"audio":"assets/audio/fr/slide-16.m4a","image":"assets/slides/fr/slide-16.png","cues":[[0.001,2.786,"Trois leviers supplémentaires de cohérence."],[2.786,7.578,"Ils sont petits… et ils comptent plus que tout le reste dans cette séance."],[7.578,11.269,"Levier un : répétez la description du sujet mot pour mot."],[11.269,13.665,"Pas approximativement… mot pour mot !"],[13.785,16.103,"Un pêcheur d'une soixantaine d'années,"],[16.103,20.372,"et le vieux pêcheur, sont, pour le modèle, deux personnes différentes."],[20.372,23.3,"Il n'a aucune mémoire de votre prompt précédent."],[23.3,26.349,"Donc les synonymes ne sont pas de l'élégance, ici."],[26.349,28.301,"Les synonymes sont de la dérive."],[28.301,31.838,"Copiez-collez votre phrase de sujet dans chacun des plans."],[31.958,36.247,"Levier deux : utilisez l'image-vers-vidéo, pas le texte-vers-vidéo."],[36.247,41.623,"Fixez le personnage ou le produit une fois, avec une image fixe en texte-vers-image."],[41.623,42.903,"Validez cette image."],[42.903,45.528,"Puis générez chaque plan à partir d'elle."],[45.528,50.648,"C'est le plus grand gain de cohérence à votre disposition… et il ne coûte rien !"],[50.768,54.804,"Levier trois : nommez les accessoires clés dans chaque plan."],[54.804,57.965,"Si l'histoire dépend d'un objet… la couverture,"],[57.965,62.942,"l'outil, la tasse, la boîte, mentionnez-le explicitement dans chaque plan,"],[62.942,65.498,"même quand cela vous paraît redondant."],[65.498,68.255,"Surtout quand cela vous paraît redondant."],[68.375,71.973,"Maintenant, laissez-moi casser les trois règles exprès."],[71.973,74.001,"Je modifie le prompt à l'écran."],[74.001,79.038,"Je remplace un mot par un synonyme, et je supprime la ligne d'ancre de style."],[79.038,79.692,"Je génère."],[79.692,81.458,"Regardez le troisième plan."],[81.458,83.682,"Température de couleur différente."],[83.682,84.729,"Grain différent."],[84.849,90.613,"Et le produit a maintenant une armure de tissage différente de celle du premier plan !"],[90.613,93.63,"Je restaure les deux, et je génère à nouveau."],[93.63,94.3,"Même film."],[94.3,95.171,"Même produit."],[95.171,96.177,"Même campagne !"],[96.297,99.184,"Cet échec était plus instructif que n'importe"],[99.184,102.072,"quel succès que j'aurais pu vous montrer… car"],[102.072,105.858,"c'est exactement ce qui se produit dans les vraies équipes."],[105.858,109.259,"Quelqu'un réécrit un prompt pour le rendre plus joli."],[109.259,111.376,"Quelqu'un nettoie la formulation."],[111.496,114.267,"Et la campagne perd silencieusement sa cohérence…"],[114.267,118.168,"et personne ne s'en aperçoit avant que les actifs soient côte à côte."],[118.168,120.656,"Maintenant le point d'entreprise, qui est la"],[120.656,125.462,"raison pour laquelle cette diapositive compte plus que la technique qu'elle contient."],[125.462,128.346,"L'ancre de style est l'endroit où vit votre marque."],[128.466,129.551,"Couleur de marque."],[129.551,130.816,"Caractère d'objectif."],[130.816,131.479,"Étalonnage."],[131.479,131.841,"Grain."],[131.841,135.155,"Vous les écrivez une fois, sous forme d'ancre de style,"],[135.155,138.469,"et vous les réutilisez sur chaque actif de la campagne."],[138.469,142.808,"Et l'année prochaine, et pour le produit suivant, et pour celui d'après."],[142.808,145.882,"À ce moment-là, ce n'est plus une astuce de prompt."],[146.002,148.817,"C'est un actif de marque, rangé dans un fichier,"],[148.817,152.572,"que n'importe qui dans votre équipe peut reprendre et utiliser !"],[152.572,155.211,"C'est l'instant où le prompt cesse d'être une"],[155.211,159.083,"compétence personnelle… et devient une capacité organisationnelle."],[159.083,162.426,"Gardez cette idée, nous y revenons à la fin de la séance."]],"transcript":"Trois leviers supplémentaires de cohérence. Ils sont petits… et ils comptent plus que tout le reste dans cette séance. Levier un : répétez la description du sujet mot pour mot. Pas approximativement… mot pour mot ! Un pêcheur d'une soixantaine d'années, et le vieux pêcheur, sont, pour le modèle, deux personnes différentes. Il n'a aucune mémoire de votre prompt précédent. Donc les synonymes ne sont pas de l'élégance, ici. Les synonymes sont de la dérive. Copiez-collez votre phrase de sujet dans chacun des plans. Levier deux : utilisez l'image-vers-vidéo, pas le texte-vers-vidéo. Fixez le personnage ou le produit une fois, avec une image fixe en texte-vers-image. Validez cette image. Puis générez chaque plan à partir d'elle. C'est le plus grand gain de cohérence à votre disposition… et il ne coûte rien ! Levier trois : nommez les accessoires clés dans chaque plan. Si l'histoire dépend d'un objet… la couverture, l'outil, la tasse, la boîte, mentionnez-le explicitement dans chaque plan, même quand cela vous paraît redondant. Surtout quand cela vous paraît redondant. Maintenant, laissez-moi casser les trois règles exprès. Je modifie le prompt à l'écran. Je remplace un mot par un synonyme, et je supprime la ligne d'ancre de style. Je génère. Regardez le troisième plan. Température de couleur différente. Grain différent. Et le produit a maintenant une armure de tissage différente de celle du premier plan ! Je restaure les deux, et je génère à nouveau. Même film. Même produit. Même campagne ! Cet échec était plus instructif que n'importe quel succès que j'aurais pu vous montrer… car c'est exactement ce qui se produit dans les vraies équipes. Quelqu'un réécrit un prompt pour le rendre plus joli. Quelqu'un nettoie la formulation. Et la campagne perd silencieusement sa cohérence… et personne ne s'en aperçoit avant que les actifs soient côte à côte. Maintenant le point d'entreprise, qui est la raison pour laquelle cette diapositive compte plus que la technique qu'elle contient. L'ancre de style est l'endroit où vit votre marque. Couleur de marque. Caractère d'objectif. Étalonnage. Grain. Vous les écrivez une fois, sous forme d'ancre de style, et vous les réutilisez sur chaque actif de la campagne. Et l'année prochaine, et pour le produit suivant, et pour celui d'après. À ce moment-là, ce n'est plus une astuce de prompt. C'est un actif de marque, rangé dans un fichier, que n'importe qui dans votre équipe peut reprendre et utiliser ! C'est l'instant où le prompt cesse d'être une compétence personnelle… et devient une capacité organisationnelle. Gardez cette idée, nous y revenons à la fin de la séance."},{"n":17,"title":"Le flux de production métier par défaut","durationSec":140.88,"audio":"assets/audio/fr/slide-17.m4a","image":"assets/slides/fr/slide-17.png","cues":[[0,3.139,"Voici toute la méthode sur une seule diapositive !"],[3.139,6.03,"C'est le flux de production métier par défaut,"],[6.03,9.424,"et c'est exactement ce que je vais dérouler à l'écran."],[9.424,10.492,"Un : la commande."],[10.492,14.389,"Pas quelle image voulons-nous, mais que doit faire cet actif ?"],[14.389,17.908,"Qui le voit, où, et que doit faire la personne ensuite ?"],[18.028,21.081,"Deux : la vérification du niveau de fidélité."],[21.081,22.777,"Niveau un, deux ou trois."],[22.777,28.409,"Cela décide si vous devez avoir une photographie réelle en main avant de commencer."],[28.409,30.58,"Trois : le choix de la capacité."],[30.58,33.226,"Texte-vers-image pour décider du sujet."],[33.226,36.279,"Image-vers-vidéo pour le mettre en mouvement."],[36.279,37.568,"Quatre : le prompt."],[37.688,42.991,"Six éléments : sujet, action, décor, mouvement de caméra, style, audio."],[42.991,45.68,"Cinq : le verrouillage de référence."],[45.68,50.236,"Une image-sujet validée, plus votre ancre de style de marque."],[50.236,52.999,"Écrite une fois, réutilisée partout !"],[52.999,55.315,"Six : générez des plans courts."],[55.315,57.331,"Cinq à dix secondes chacun."],[57.331,59.422,"Sept : la relecture humaine."],[59.542,61.149,"Adéquation à la marque."],[61.149,64.223,"Exactitude factuelle contre le produit réel."],[64.223,64.991,"Artefacts !"],[64.991,66.598,"Représentation… Droits."],[66.598,69.811,"Huit : le marquage de provenance et la mention"],[69.811,74.91,"de divulgation — pour la plateforme sur laquelle vous publiez réellement."],[74.91,79.52,"Neuf : publiez, et rangez le prompt dans la bibliothèque d'équipe."],[79.52,80.498,"Déroulons-le !"],[80.618,85.243,"Regardez la durée de chaque plan… Environ cinq secondes… Environ huit… Six."],[85.243,87.217,"Ce n'est pas l'outil qui échoue."],[87.217,90.115,"C'est la réalité actuelle de cette technologie,"],[90.115,92.767,"et je veux que vous l'entendiez clairement,"],[92.767,98.317,"car gérer cette seule attente vous évitera beaucoup de découragement la semaine prochaine."],[98.437,102.825,"La plupart des outils génèrent environ cinq à dix secondes à la fois,"],[102.825,106.513,"et la cohérence se dégrade à mesure que le plan s'allonge."],[106.513,109.057,"Donc un film de marque ne se génère pas."],[109.177,112.928,"Un film de marque s'assemble — à partir de nombreux plans courts,"],[112.928,115.468,"tenus ensemble par une seule ancre de style,"],[115.468,118.238,"et montés dans un logiciel de montage ordinaire."],[118.238,121.008,"Si vous rentrez chez vous et essayez de produire"],[121.008,125.106,"un film de soixante secondes à partir d'un seul prompt, vous échouerez."],[125.226,129.039,"Et vous en conclurez que la technologie ne fonctionne pas."],[129.039,130.091,"Elle fonctionne."],[130.091,133.575,"Elle fonctionne à raison de huit secondes à la fois !"],[133.575,137.191,"Prévoyez huit secondes, et vous passerez pour un génie."],[137.191,140.872,"Prévoyez-en soixante, et vous passerez pour un débutant."]],"transcript":"Voici toute la méthode sur une seule diapositive ! C'est le flux de production métier par défaut, et c'est exactement ce que je vais dérouler à l'écran. Un : la commande. Pas quelle image voulons-nous, mais que doit faire cet actif ? Qui le voit, où, et que doit faire la personne ensuite ? Deux : la vérification du niveau de fidélité. Niveau un, deux ou trois. Cela décide si vous devez avoir une photographie réelle en main avant de commencer. Trois : le choix de la capacité. Texte-vers-image pour décider du sujet. Image-vers-vidéo pour le mettre en mouvement. Quatre : le prompt. Six éléments : sujet, action, décor, mouvement de caméra, style, audio. Cinq : le verrouillage de référence. Une image-sujet validée, plus votre ancre de style de marque. Écrite une fois, réutilisée partout ! Six : générez des plans courts. Cinq à dix secondes chacun. Sept : la relecture humaine. Adéquation à la marque. Exactitude factuelle contre le produit réel. Artefacts ! Représentation… Droits. Huit : le marquage de provenance et la mention de divulgation — pour la plateforme sur laquelle vous publiez réellement. Neuf : publiez, et rangez le prompt dans la bibliothèque d'équipe. Déroulons-le ! Regardez la durée de chaque plan… Environ cinq secondes… Environ huit… Six. Ce n'est pas l'outil qui échoue. C'est la réalité actuelle de cette technologie, et je veux que vous l'entendiez clairement, car gérer cette seule attente vous évitera beaucoup de découragement la semaine prochaine. La plupart des outils génèrent environ cinq à dix secondes à la fois, et la cohérence se dégrade à mesure que le plan s'allonge. Donc un film de marque ne se génère pas. Un film de marque s'assemble — à partir de nombreux plans courts, tenus ensemble par une seule ancre de style, et montés dans un logiciel de montage ordinaire. Si vous rentrez chez vous et essayez de produire un film de soixante secondes à partir d'un seul prompt, vous échouerez. Et vous en conclurez que la technologie ne fonctionne pas. Elle fonctionne. Elle fonctionne à raison de huit secondes à la fois ! Prévoyez huit secondes, et vous passerez pour un génie. Prévoyez-en soixante, et vous passerez pour un débutant."},{"n":18,"title":"Droits, divulgation et confiance","durationSec":182.23,"audio":"assets/audio/fr/slide-18.m4a","image":"assets/slides/fr/slide-18.png","cues":[[0,3.15,"Troisième message du jour : pour une entreprise,"],[3.15,6.374,"une image impressionnante n'est pas le livrable !"],[6.374,9.4,"La cohérence répétable, la fidélité factuelle,"],[9.4,13.545,"les droits purgés et la divulgation honnête… voilà le livrable."],[13.545,16.637,"Un bel actif que vous ne pouvez pas reproduire,"],[16.637,19.532,"ou qui déforme votre produit, est un passif."],[19.652,20.877,"Quatre obligations !"],[20.877,26.147,"Et d'abord une réserve, que je ne sauterai pas : ceci n'est pas un conseil juridique !"],[26.147,28.352,"Je suis formateur, pas votre avocat."],[28.352,33.193,"La réglementation de ce domaine évolue vite… et diffère selon les juridictions."],[33.193,36.501,"Ce que je vous enseigne, c'est l'habitude de vérifier."],[36.621,37.917,"Une : la divulgation."],[37.917,40.63,"Dans l'Union européenne, l'article cinquante"],[40.63,43.344,"du règlement sur l'intelligence artificielle"],[43.344,46.674,"s'applique à partir du deux août deux mille vingt-six."],[46.794,49.456,"Les hypertrucages, c'est-à-dire une image,"],[49.456,52.498,"un audio ou une vidéo synthétiques ou manipulés,"],[52.498,55.287,"qui apparaîtraient faussement authentiques à"],[55.287,60.103,"une personne… doivent être divulgués au spectateur, dès le premier contact !"],[60.103,62.511,"Et voici le détail qui piège les gens."],[62.631,65.321,"Un marquage embarqué, lisible par machine,"],[65.321,68.779,"ne suffit pas, à lui seul, à remplir cette obligation."],[68.779,73.582,"Un marquage de provenance est un signal technique à l'intérieur du fichier."],[73.582,78.065,"Une mention de divulgation est un message qu'un être humain peut lire."],[78.185,80.554,"Ce sont deux objets différents, qui font deux"],[80.554,83.712,"métiers différents… et il vous faudra probablement les deux."],[83.712,86.766,"Pour les systèmes déjà mis sur le marché avant cette date,"],[86.766,90.661,"l'obligation de marquage lisible par machine prévue à l'article cinquante,"],[90.661,94.61,"paragraphe deux, s'applique à partir du deux décembre deux mille vingt-six."],[94.73,96.866,"Deux : les règles des plateformes."],[96.866,99.38,"Indépendamment de toute loi, les grandes"],[99.38,102.397,"plateformes publicitaires et sociales appliquent"],[102.397,104.974,"chacune leur propre règle d'étiquetage de"],[104.974,108.619,"l'intelligence artificielle… et ce ne sont pas les mêmes !"],[108.619,112.328,"Vérifiez celle de la plateforme où vous publiez réellement."],[112.328,113.207,"À chaque fois."],[113.327,114.407,"Trois : l'étayage."],[114.407,117.884,"Générer une image ne détend pas le droit de la publicité !"],[117.884,120.583,"Vos allégations exigent toujours des preuves…"],[120.583,122.981,"et une image générée ne doit pas induire"],[122.981,126.339,"matériellement le consommateur en erreur sur le produit."],[126.339,130.956,"C'est exactement le problème du niveau un, avec un régulateur attaché dessus."],[131.076,133.775,"Quatre : l'image de la personne et les données."],[133.775,138.773,"Obtenez un consentement avant de générer le visage d'une personne réelle identifiable !"],[138.773,141.357,"Certaines juridictions imposent désormais des"],[141.357,146.297,"obligations de divulgation publicitaire spécifiques pour les interprètes synthétiques."],[146.417,149.329,"Et celle que les entreprises ratent le plus souvent :"],[149.329,152.405,"ne téléversez jamais de données personnelles de clients,"],[152.405,154.658,"de dossiers de salariés, ou de designs de"],[154.658,157.13,"produits non publiés… vers un outil dont vous"],[157.13,161.965,"n'avez pas lu les conditions d'utilisation et la politique de conservation des données !"],[161.965,163.833,"Votre prompt est un téléversement."],[163.953,165.343,"Traitez-le comme tel."],[165.343,169.049,"Notre actif de démonstration est terminé, et il est bon."],[169.049,171.365,"Deux questions avant de le publier."],[171.365,173.152,"Que devons-nous étiqueter ?"],[173.152,176.196,"Et sur quelle plateforme, selon quelle règle ?"],[176.196,180.63,"Si vous ne pouvez pas répondre aux deux, l'actif n'est pas terminé."],[180.63,182.218,"Il est seulement généré."]],"transcript":"Troisième message du jour : pour une entreprise, une image impressionnante n'est pas le livrable ! La cohérence répétable, la fidélité factuelle, les droits purgés et la divulgation honnête… voilà le livrable. Un bel actif que vous ne pouvez pas reproduire, ou qui déforme votre produit, est un passif. Quatre obligations ! Et d'abord une réserve, que je ne sauterai pas : ceci n'est pas un conseil juridique ! Je suis formateur, pas votre avocat. La réglementation de ce domaine évolue vite… et diffère selon les juridictions. Ce que je vous enseigne, c'est l'habitude de vérifier. Une : la divulgation. Dans l'Union européenne, l'article cinquante du règlement sur l'intelligence artificielle s'applique à partir du deux août deux mille vingt-six. Les hypertrucages, c'est-à-dire une image, un audio ou une vidéo synthétiques ou manipulés, qui apparaîtraient faussement authentiques à une personne… doivent être divulgués au spectateur, dès le premier contact ! Et voici le détail qui piège les gens. Un marquage embarqué, lisible par machine, ne suffit pas, à lui seul, à remplir cette obligation. Un marquage de provenance est un signal technique à l'intérieur du fichier. Une mention de divulgation est un message qu'un être humain peut lire. Ce sont deux objets différents, qui font deux métiers différents… et il vous faudra probablement les deux. Pour les systèmes déjà mis sur le marché avant cette date, l'obligation de marquage lisible par machine prévue à l'article cinquante, paragraphe deux, s'applique à partir du deux décembre deux mille vingt-six. Deux : les règles des plateformes. Indépendamment de toute loi, les grandes plateformes publicitaires et sociales appliquent chacune leur propre règle d'étiquetage de l'intelligence artificielle… et ce ne sont pas les mêmes ! Vérifiez celle de la plateforme où vous publiez réellement. À chaque fois. Trois : l'étayage. Générer une image ne détend pas le droit de la publicité ! Vos allégations exigent toujours des preuves… et une image générée ne doit pas induire matériellement le consommateur en erreur sur le produit. C'est exactement le problème du niveau un, avec un régulateur attaché dessus. Quatre : l'image de la personne et les données. Obtenez un consentement avant de générer le visage d'une personne réelle identifiable ! Certaines juridictions imposent désormais des obligations de divulgation publicitaire spécifiques pour les interprètes synthétiques. Et celle que les entreprises ratent le plus souvent : ne téléversez jamais de données personnelles de clients, de dossiers de salariés, ou de designs de produits non publiés… vers un outil dont vous n'avez pas lu les conditions d'utilisation et la politique de conservation des données ! Votre prompt est un téléversement. Traitez-le comme tel. Notre actif de démonstration est terminé, et il est bon. Deux questions avant de le publier. Que devons-nous étiqueter ? Et sur quelle plateforme, selon quelle règle ? Si vous ne pouvez pas répondre aux deux, l'actif n'est pas terminé. Il est seulement généré."},{"n":19,"title":"Construire une pratique d'équipe répétable","durationSec":119.42,"audio":"assets/audio/fr/slide-19.m4a","image":"assets/slides/fr/slide-19.png","cues":[[0,2.274,"Tout ce qui précède est une compétence."],[2.274,5.555,"Et une compétence vit dans la tête d'une seule personne,"],[5.555,8.896,"et elle quitte l'immeuble quand cette personne le quitte."],[8.896,13.466,"Voici comment la transformer en capacité qui appartient à votre organisation !"],[13.466,14.462,"Quatre livrables."],[14.462,15.634,"Aucun n'est coûteux."],[15.754,19.168,"Un : une bibliothèque écrite de modèles de prompts."],[19.168,24.12,"Chaque prompt ayant produit un actif publié entre dans un fichier partagé,"],[24.12,27.199,"avec le nom de l'outil, la date et la licence."],[27.199,30.545,"Pas un dossier d'images — un dossier de recettes !"],[30.545,32.887,"Deux : un jeu de références validé."],[33.007,36.561,"Les images-sujets verrouillées, et l'ancre de style de marque."],[36.561,39.14,"Dès qu'ils existent, un nouveau collègue peut"],[39.14,42.922,"produire un actif conforme à la marque dès son premier après-midi,"],[42.922,46.991,"parce que les décisions difficiles ont été prises une fois, et rangées."],[46.991,51.06,"Trois : une étape de relecture avec une personne nommément responsable."],[51.18,52.534,"Pas l'équipe relit."],[52.534,53.104,"Un nom !"],[53.104,56.452,"L'automatisation change qui produit le travail."],[56.452,59.444,"Elle ne change pas qui en est responsable."],[59.444,62.649,"Quatre : une règle de divulgation par défaut."],[62.769,66.59,"Décidez une fois, à l'avance, ce que vous étiquetez et où,"],[66.59,69.488,"afin que personne n'ait à porter ce jugement"],[69.488,73.836,"sous la pression d'une échéance… un vendredi à seize heures, seul."],[73.836,77.92,"Une dernière note pour la bibliothèque, et elle est juridique."],[78.04,80.402,"Le statut de droit d'auteur des productions"],[80.402,85.348,"générées par intelligence artificielle varie selon les juridictions, et il n'est pas fixé."],[85.348,89.084,"Les droits sur les données d'entraînement sont activement contestés."],[89.204,93.143,"Et les images générées peuvent contenir accidentellement un logo tiers,"],[93.143,95.472,"un personnage sous marque, ou un dessin de"],[95.472,99.134,"bâtiment reconnaissable… Donc enregistrez ce que vous avez généré,"],[99.134,102.018,"avec quel outil, sous quelle licence, à quelle date."],[102.138,105.099,"Ce registre est quasiment gratuit à tenir,"],[105.099,109.33,"et s'il est un jour contesté, il a une valeur considérable !"],[109.33,110.529,"Quatre livrables."],[110.529,111.727,"Une bibliothèque."],[111.727,113.208,"Un jeu de références."],[113.208,114.688,"Un responsable nommé."],[114.688,116.451,"Une règle de divulgation."],[116.451,119.412,"C'est là tout le travail organisationnel !"]],"transcript":"Tout ce qui précède est une compétence. Et une compétence vit dans la tête d'une seule personne, et elle quitte l'immeuble quand cette personne le quitte. Voici comment la transformer en capacité qui appartient à votre organisation ! Quatre livrables. Aucun n'est coûteux. Un : une bibliothèque écrite de modèles de prompts. Chaque prompt ayant produit un actif publié entre dans un fichier partagé, avec le nom de l'outil, la date et la licence. Pas un dossier d'images — un dossier de recettes ! Deux : un jeu de références validé. Les images-sujets verrouillées, et l'ancre de style de marque. Dès qu'ils existent, un nouveau collègue peut produire un actif conforme à la marque dès son premier après-midi, parce que les décisions difficiles ont été prises une fois, et rangées. Trois : une étape de relecture avec une personne nommément responsable. Pas l'équipe relit. Un nom ! L'automatisation change qui produit le travail. Elle ne change pas qui en est responsable. Quatre : une règle de divulgation par défaut. Décidez une fois, à l'avance, ce que vous étiquetez et où, afin que personne n'ait à porter ce jugement sous la pression d'une échéance… un vendredi à seize heures, seul. Une dernière note pour la bibliothèque, et elle est juridique. Le statut de droit d'auteur des productions générées par intelligence artificielle varie selon les juridictions, et il n'est pas fixé. Les droits sur les données d'entraînement sont activement contestés. Et les images générées peuvent contenir accidentellement un logo tiers, un personnage sous marque, ou un dessin de bâtiment reconnaissable… Donc enregistrez ce que vous avez généré, avec quel outil, sous quelle licence, à quelle date. Ce registre est quasiment gratuit à tenir, et s'il est un jour contesté, il a une valeur considérable ! Quatre livrables. Une bibliothèque. Un jeu de références. Un responsable nommé. Une règle de divulgation. C'est là tout le travail organisationnel !"},{"n":20,"title":"Conclusions et questions","durationSec":109.89,"audio":"assets/audio/fr/slide-20.m4a","image":"assets/slides/fr/slide-20.png","cues":[[0,1.002,"Trois messages."],[1.002,2.415,"Et puis une question."],[2.415,4.434,"Un : le modèle ne devine pas !"],[4.434,8.27,"Tout ce que vous laissez de côté, il le décide au hasard."],[8.27,13.654,"Une dimension non précisée n'est pas un neutre par défaut… c'est une délégation."],[13.654,17.692,"Deux : un prompt est un découpage technique, pas un souhait."],[17.812,22.24,"Pour chaque adjectif, demandez-vous comment une caméra le filmerait ?"],[22.24,26.539,"Si vous ne savez pas répondre, remplacez l'adjectif par une action,"],[26.539,29.299,"une position de lumière ou une composition."],[29.299,34.304,"Trois : pour une entreprise, une image impressionnante n'est pas le livrable !"],[34.304,35.588,"Cohérence répétable."],[35.588,36.807,"Fidélité factuelle."],[36.807,37.705,"Droits purgés."],[37.825,39.136,"Divulgation honnête."],[39.136,42.217,"Un bel actif que vous ne pouvez pas reproduire,"],[42.217,45.101,"ou qui déforme votre produit… est un passif."],[45.101,47.264,"Et toute la séance en une phrase."],[47.264,50.344,"L'intelligence artificielle générative supprime"],[50.344,53.752,"le goulot d'étranglement de la production marketing."],[53.752,56.374,"Elle ne supprime pas celui du jugement !"],[56.494,59.418,"Les entreprises qui en bénéficient sont celles"],[59.418,62.469,"qui associent une méthode de prompt disciplinée,"],[62.469,68.19,"une vérification honnête du niveau de fidélité, et une personne nommée qui valide l'actif."],[68.19,70.415,"L'outil changera l'année prochaine."],[70.415,74.547,"La méthode, la vérification de niveau et la responsabilité, non !"],[74.667,76.077,"Votre projet de cours ?"],[76.077,79.203,"Produisez une image produit catalogue de niveau un,"],[79.203,83.127,"construite à partir d'une photographie réelle d'un produit réel."],[83.127,85.702,"Et une vidéo de marque de huit secondes en"],[85.702,88.644,"trois plans… tenue par une seule ancre de style."],[88.644,90.667,"Rendez les actifs et les prompts."],[90.787,93.621,"Les prompts comptent pour la moitié de l'évaluation,"],[93.621,96.237,"parce que les prompts sont la partie répétable !"],[96.237,101.032,"Maintenant, la question à laquelle je veux que vous répondiez avant de quitter la salle."],[101.032,103.103,"Quel actif allez-vous produire lundi ?"],[103.103,105.501,"Et à quel niveau de fidélité se situe-t-il ?"],[105.501,106.645,"Gardez cette réponse."],[106.765,109.483,"C'est là que le cours commence vraiment !"],[109.483,109.881,"Merci."]],"transcript":"Trois messages. Et puis une question. Un : le modèle ne devine pas ! Tout ce que vous laissez de côté, il le décide au hasard. Une dimension non précisée n'est pas un neutre par défaut… c'est une délégation. Deux : un prompt est un découpage technique, pas un souhait. Pour chaque adjectif, demandez-vous comment une caméra le filmerait ? Si vous ne savez pas répondre, remplacez l'adjectif par une action, une position de lumière ou une composition. Trois : pour une entreprise, une image impressionnante n'est pas le livrable ! Cohérence répétable. Fidélité factuelle. Droits purgés. Divulgation honnête. Un bel actif que vous ne pouvez pas reproduire, ou qui déforme votre produit… est un passif. Et toute la séance en une phrase. L'intelligence artificielle générative supprime le goulot d'étranglement de la production marketing. Elle ne supprime pas celui du jugement ! Les entreprises qui en bénéficient sont celles qui associent une méthode de prompt disciplinée, une vérification honnête du niveau de fidélité, et une personne nommée qui valide l'actif. L'outil changera l'année prochaine. La méthode, la vérification de niveau et la responsabilité, non ! Votre projet de cours ? Produisez une image produit catalogue de niveau un, construite à partir d'une photographie réelle d'un produit réel. Et une vidéo de marque de huit secondes en trois plans… tenue par une seule ancre de style. Rendez les actifs et les prompts. Les prompts comptent pour la moitié de l'évaluation, parce que les prompts sont la partie répétable ! Maintenant, la question à laquelle je veux que vous répondiez avant de quitter la salle. Quel actif allez-vous produire lundi ? Et à quel niveau de fidélité se situe-t-il ? Gardez cette réponse. C'est là que le cours commence vraiment ! Merci."}]},"en":{"lang":"en","welcome":{"title":"Course welcome","durationSec":56.45,"audio":"assets/audio/en/welcome.m4a","cues":[[0,1.705,"Hello, and welcome!"],[1.705,5.565,"This course is delivered on the platform of"],[5.565,10.771,"the International Institute of Online Education… the IIOE."],[10.771,14.99,"It is a micro-credential of forty-five minutes."],[14.99,20.106,"It is called Applied Generative AI for Marketing Visuals."],[20.226,23.722,"It is for people who run marketing, communications,"],[23.722,26.943,"online commerce, or training inside a business."],[26.943,29.342,"No technical knowledge is required."],[29.342,32.289,"We will look at how to write an instruction"],[32.289,36.675,"that produces a reliable image… how to set that image in motion,"],[36.675,39.554,"and how to govern this work inside a team."],[39.674,41.75,"One note before we begin."],[41.75,46.651,"Every prompt example shown on screen is written in English,"],[46.651,50.472,"and you should type it in English too… because"],[50.472,55.373,"that is the language in which the models are most accurate."],[55.373,56.452,"Let us begin!"]],"transcript":"Hello, and welcome! This course is delivered on the platform of the International Institute of Online Education… the IIOE. It is a micro-credential of forty-five minutes. It is called Applied Generative AI for Marketing Visuals. It is for people who run marketing, communications, online commerce, or training inside a business. No technical knowledge is required. We will look at how to write an instruction that produces a reliable image… how to set that image in motion, and how to govern this work inside a team. One note before we begin. Every prompt example shown on screen is written in English, and you should type it in English too… because that is the language in which the models are most accurate. Let us begin!"},"slides":[{"n":1,"title":"Can Your Business Make Its Own Images and Videos?","durationSec":64.45,"audio":"assets/audio/en/slide-01.m4a","image":"assets/slides/en/slide-01.png","cues":[[0.002,4.86,"This session is not for designers… and it is not for engineers."],[4.86,11.415,"Nothing here assumes you have ever opened a camera, a design tool, or a line of code."],[11.415,17.738,"It is for the person who has to approve the visual, pay for it, and answer for it."],[17.738,20.746,"Before I teach anything… two questions!"],[20.866,24.306,"And I would like you to answer them honestly."],[24.306,27.594,"How many of you paid an outside agency or a"],[27.594,32.105,"freelancer for marketing visuals in the last twelve months?"],[32.105,34.781,"For most of you, the answer is yes."],[34.781,40.898,"And how many of you waited more than one week for a single revision… one change,"],[40.898,41.892,"to one image?"],[42.012,46.26,"That is not a new campaign, and it is not a new idea."],[46.26,49.787,"That is one detail changed, and a week lost."],[49.787,52.672,"Keep those two numbers in your head."],[52.672,56.279,"In the next forty-five minutes I want to give"],[56.279,59.726,"you a method that changes both of them… and"],[59.726,64.455,"I want to be honest with you about what it does not change."]],"transcript":"This session is not for designers… and it is not for engineers. Nothing here assumes you have ever opened a camera, a design tool, or a line of code. It is for the person who has to approve the visual, pay for it, and answer for it. Before I teach anything… two questions! And I would like you to answer them honestly. How many of you paid an outside agency or a freelancer for marketing visuals in the last twelve months? For most of you, the answer is yes. And how many of you waited more than one week for a single revision… one change, to one image? That is not a new campaign, and it is not a new idea. That is one detail changed, and a week lost. Keep those two numbers in your head. In the next forty-five minutes I want to give you a method that changes both of them… and I want to be honest with you about what it does not change."},{"n":2,"title":"Your Trainer","durationSec":48.03,"audio":"assets/audio/en/slide-02.m4a","image":"assets/slides/en/slide-02.png","cues":[[0.005,5.095,"Before I give you that method… let me tell you who is speaking."],[5.095,6.953,"My name is Yuefeng SUN."],[6.953,13.739,"I have spent twenty years building enterprise data platforms and cloud architecture."],[13.859,17.186,"And for most of those twenty years, my job"],[17.186,20.75,"has been to teach generative AI to the people"],[20.75,25.899,"who have to use it in a business… not to the people who build it."],[25.899,27.166,"Marketing teams."],[27.166,28.909,"Online commerce teams."],[28.909,30.572,"Communications teams."],[30.572,34.057,"People who have no designer and no engineer…"],[34.057,37.859,"and who still have to publish on Monday morning."],[37.979,41.601,"That is exactly who this session was written for."],[41.601,48.032,"So everything you are about to see is built for your constraints… not for a laboratory."]],"transcript":"Before I give you that method… let me tell you who is speaking. My name is Yuefeng SUN. I have spent twenty years building enterprise data platforms and cloud architecture. And for most of those twenty years, my job has been to teach generative AI to the people who have to use it in a business… not to the people who build it. Marketing teams. Online commerce teams. Communications teams. People who have no designer and no engineer… and who still have to publish on Monday morning. That is exactly who this session was written for. So everything you are about to see is built for your constraints… not for a laboratory."},{"n":3,"title":"You Will Be Able To:","durationSec":76.25,"audio":"assets/audio/en/slide-03.m4a","image":"assets/slides/en/slide-03.png","cues":[[0.002,5.444,"So… what will you actually be able to do at the end of this session?"],[5.444,6.884,"Let me be precise."],[6.884,11.765,"A promise you can check is worth more than an impressive one."],[11.765,12.645,"Six things."],[12.645,16.726,"One… you will write a prompt the model can execute."],[16.726,20.887,"Six elements, in order, with nothing left to chance."],[21.007,24.476,"Two… you will tell a wish from a shooting script,"],[24.476,29.291,"and turn any adjective into something a camera can actually capture."],[29.291,33.255,"Three… you will choose the right capability for the job."],[33.255,37.432,"Lock the subject as a still image first… then make it move."],[37.552,42.397,"Four… you will sort every asset into one of three fidelity tiers,"],[42.397,46.944,"and know when a real photograph must replace a generated one."],[46.944,50.447,"Five… you will hold one brand consistent across"],[50.447,54.919,"a whole campaign… instead of rediscovering it every morning."],[54.919,58.72,"And six… you will publish without hurting yourself."],[58.84,62.307,"Rights, disclosure, and the four artefacts"],[62.307,66.599,"that turn one person's skill into a team capability."],[66.599,69.488,"One thing this session will not do."],[69.488,72.129,"It will not teach you a product."],[72.129,74.605,"Tools change every six months."],[74.605,76.256,"The method does not."]],"transcript":"So… what will you actually be able to do at the end of this session? Let me be precise. A promise you can check is worth more than an impressive one. Six things. One… you will write a prompt the model can execute. Six elements, in order, with nothing left to chance. Two… you will tell a wish from a shooting script, and turn any adjective into something a camera can actually capture. Three… you will choose the right capability for the job. Lock the subject as a still image first… then make it move. Four… you will sort every asset into one of three fidelity tiers, and know when a real photograph must replace a generated one. Five… you will hold one brand consistent across a whole campaign… instead of rediscovering it every morning. And six… you will publish without hurting yourself. Rights, disclosure, and the four artefacts that turn one person's skill into a team capability. One thing this session will not do. It will not teach you a product. Tools change every six months. The method does not."},{"n":4,"title":"The Marketing Content Bottleneck","durationSec":126.05,"audio":"assets/audio/en/slide-04.m4a","image":"assets/slides/en/slide-04.png","cues":[[0.006,3.202,"Let me name the problem precisely… because"],[3.202,8.908,"saying that artificial intelligence will help your marketing is not a plan!"],[8.908,12.028,"There are four pressures on a small team."],[12.028,13.55,"One: cost per asset."],[13.55,18.115,"A single product photograph, lit and retouched, has a price."],[18.115,21.387,"A ten second video has a much larger price."],[21.507,25.955,"Now multiply that by every market you sell into."],[25.955,27.438,"Two: turnaround."],[27.438,31.609,"The work is not slow because anybody is lazy."],[31.609,35.409,"It is slow because a brief has to travel."],[35.409,39.301,"From you, to an agency, to a photographer,"],[39.301,46.993,"to a retoucher… back to you, and then around the whole loop again for one revision."],[47.114,49.328,"Three: the volume of variants."],[49.328,53.315,"The same product needs a square crop for one platform,"],[53.315,56.268,"a vertical crop for another, a different"],[56.268,61.436,"language overlay for each market… and a seasonal version twice a year."],[61.436,64.241,"The creative idea finished months ago."],[64.241,66.087,"Only the variants remain."],[66.207,69.455,"This is the work that drains teams the most…"],[69.455,72.999,"and it is the work that generation handles best!"],[72.999,74.328,"Four: no designer."],[74.328,79.423,"Many of you have nobody in the building who can make an image at all."],[79.423,81.711,"Now the promise… and the limit."],[81.711,86.88,"I will say this once at the start of the session, and once at the end."],[86.999,90.143,"Generative AI removes the production bottleneck!"],[90.143,93.024,"It does not remove the judgement bottleneck."],[93.024,95.185,"Making the picture becomes cheap."],[95.185,97.607,"Deciding whether the picture is true,"],[97.607,101.667,"whether it is on brand, whether you are allowed to publish it,"],[101.667,106.185,"and whether it will mislead a customer… none of that becomes cheaper."],[106.305,109.412,"Some of it becomes more expensive, because"],[109.412,114.295,"you can now produce a hundred bad decisions in a single afternoon!"],[114.295,116.588,"So this session has two halves."],[116.588,121.397,"The first half is method: how to make the model do what you want."],[121.397,126.057,"The second half is judgement: how not to hurt yourself with it."]],"transcript":"Let me name the problem precisely… because saying that artificial intelligence will help your marketing is not a plan! There are four pressures on a small team. One: cost per asset. A single product photograph, lit and retouched, has a price. A ten second video has a much larger price. Now multiply that by every market you sell into. Two: turnaround. The work is not slow because anybody is lazy. It is slow because a brief has to travel. From you, to an agency, to a photographer, to a retoucher… back to you, and then around the whole loop again for one revision. Three: the volume of variants. The same product needs a square crop for one platform, a vertical crop for another, a different language overlay for each market… and a seasonal version twice a year. The creative idea finished months ago. Only the variants remain. This is the work that drains teams the most… and it is the work that generation handles best! Four: no designer. Many of you have nobody in the building who can make an image at all. Now the promise… and the limit. I will say this once at the start of the session, and once at the end. Generative AI removes the production bottleneck! It does not remove the judgement bottleneck. Making the picture becomes cheap. Deciding whether the picture is true, whether it is on brand, whether you are allowed to publish it, and whether it will mislead a customer… none of that becomes cheaper. Some of it becomes more expensive, because you can now produce a hundred bad decisions in a single afternoon! So this session has two halves. The first half is method: how to make the model do what you want. The second half is judgement: how not to hurt yourself with it."},{"n":5,"title":"Two Capabilities: Text-to-Image and Image-to-Video","durationSec":111.33,"audio":"assets/audio/en/slide-05.m4a","image":"assets/slides/en/slide-05.png","cues":[[0.007,4.463,"First, four terms we will use for the rest of the session."],[4.463,6.23,"Please write them down."],[6.23,9.994,"Generative AI is a system that produces new text,"],[9.994,13.988,"images, audio, or video… from a written instruction."],[13.988,16.83,"A prompt is that written instruction."],[16.83,19.288,"It is the only channel you have."],[19.288,22.592,"There is no other way to talk to the model."],[22.712,27.845,"Text-to-image means: you give words, the model returns a still picture."],[27.845,31.965,"Image-to-video means: you give a still picture and words,"],[31.965,34.568,"and the model returns a moving shot."],[34.568,37.388,"The picture fixes what is in the frame."],[37.388,39.773,"The words say what happens to it."],[39.893,45.565,"There is a third capability you will see advertised everywhere… text-to-video."],[45.565,48.401,"Words alone, straight to a moving shot."],[48.401,51.528,"I am not going to teach it as your default,"],[51.528,54.582,"and I want to explain why… because this is"],[54.582,58.655,"the single most common disappointment in the whole area."],[58.775,64.663,"With text-to-video, the model invents the subject and the movement at the same time,"],[64.663,66.346,"on every single attempt."],[66.346,69.851,"So the product looks slightly different each time."],[69.851,72.725,"For an artist, that variety is a feature."],[72.725,76.02,"For a business that must show the same package,"],[76.02,80.226,"on the same shelf, across the same campaign… it is a defect."],[80.346,83.427,"Image-to-video separates the two problems!"],[83.427,86.656,"You decide the subject once, you approve it,"],[86.656,90.911,"and then you generate movement from that approved picture."],[90.911,92.892,"The subject stops drifting."],[92.892,94.433,"So: two capabilities."],[94.433,98.175,"Text-to-image, to decide what the thing looks like."],[98.175,100.523,"Image-to-video, to make it move."],[100.643,103.002,"Everything else today is detail."],[103.002,105.804,"Remember that order… because at minute"],[105.804,111.333,"thirty-five I will run an entire workflow built on exactly those two steps."]],"transcript":"First, four terms we will use for the rest of the session. Please write them down. Generative AI is a system that produces new text, images, audio, or video… from a written instruction. A prompt is that written instruction. It is the only channel you have. There is no other way to talk to the model. Text-to-image means: you give words, the model returns a still picture. Image-to-video means: you give a still picture and words, and the model returns a moving shot. The picture fixes what is in the frame. The words say what happens to it. There is a third capability you will see advertised everywhere… text-to-video. Words alone, straight to a moving shot. I am not going to teach it as your default, and I want to explain why… because this is the single most common disappointment in the whole area. With text-to-video, the model invents the subject and the movement at the same time, on every single attempt. So the product looks slightly different each time. For an artist, that variety is a feature. For a business that must show the same package, on the same shelf, across the same campaign… it is a defect. Image-to-video separates the two problems! You decide the subject once, you approve it, and then you generate movement from that approved picture. The subject stops drifting. So: two capabilities. Text-to-image, to decide what the thing looks like. Image-to-video, to make it move. Everything else today is detail. Remember that order… because at minute thirty-five I will run an entire workflow built on exactly those two steps."},{"n":6,"title":"The Model Does Not Guess","durationSec":89.28,"audio":"assets/audio/en/slide-06.m4a","image":"assets/slides/en/slide-06.png","cues":[[0.003,5.098,"I want to prove something to you before I teach you anything."],[5.098,6.434,"Here is a brief."],[6.434,7.77,"Read it with me."],[7.77,12.363,"We are a small business that sells hand-woven textiles."],[12.363,16.623,"We need one product image for the export catalogue,"],[16.623,20.297,"and one eight second video for social media."],[20.297,24.64,"We have no photographer, no studio, and no designer."],[24.76,28.752,"That is a real brief, from a real kind of business."],[28.752,32.588,"Now watch what a normal first attempt looks like."],[32.588,39.006,"I am going to type the prompt that most people type: a short, reasonable sentence."],[39.006,45.112,"And I am going to generate it four times, without changing a single character."],[45.112,46.129,"Four results."],[46.129,46.99,"Same words."],[47.11,49.818,"Different camera angle, every time."],[49.818,51.056,"Different light."],[51.056,53.377,"Different weave in the fabric."],[53.377,57.246,"In two of them, the product is a different colour."],[57.246,59.335,"Nobody made a mistake here."],[59.335,60.728,"Nothing is broken."],[60.728,63.513,"The tool worked exactly as designed."],[63.513,68.774,"So here is the rule… and it is the first of my three messages today."],[68.894,70.917,"The model does not guess!"],[70.917,76.257,"Anything you leave out of the prompt, the model decides at random."],[76.257,80.302,"An unspecified dimension is not a neutral default."],[80.302,81.84,"It is a delegation."],[81.84,84.914,"You handed that decision to a machine,"],[84.914,89.283,"silently… and you did not notice that you had done it."]],"transcript":"I want to prove something to you before I teach you anything. Here is a brief. Read it with me. We are a small business that sells hand-woven textiles. We need one product image for the export catalogue, and one eight second video for social media. We have no photographer, no studio, and no designer. That is a real brief, from a real kind of business. Now watch what a normal first attempt looks like. I am going to type the prompt that most people type: a short, reasonable sentence. And I am going to generate it four times, without changing a single character. Four results. Same words. Different camera angle, every time. Different light. Different weave in the fabric. In two of them, the product is a different colour. Nobody made a mistake here. Nothing is broken. The tool worked exactly as designed. So here is the rule… and it is the first of my three messages today. The model does not guess! Anything you leave out of the prompt, the model decides at random. An unspecified dimension is not a neutral default. It is a delegation. You handed that decision to a machine, silently… and you did not notice that you had done it."},{"n":7,"title":"A Prompt Is a Shooting Script, Not a Wish","durationSec":165.23,"audio":"assets/audio/en/slide-07.m4a","image":"assets/slides/en/slide-07.png","cues":[[0.003,1.533,"So let us fix it!"],[1.533,4.413,"And the fix is not a magic word."],[4.413,8.912,"It is a change in what kind of sentence you write."],[8.912,11.162,"Most people write a wish."],[11.162,18.271,"An elegant, high-quality textile product image with a warm, premium atmosphere."],[18.271,19.621,"That is a wish."],[19.621,24.57,"It describes the feeling you want the customer to have."],[24.69,28.352,"The problem is that a camera cannot film elegant."],[28.352,30.519,"A camera cannot film premium."],[30.519,32.536,"Those words have no pixels!"],[32.536,38.589,"What the model needs is a shooting script… a description of what the camera sees,"],[38.589,40.458,"and what the camera does."],[40.458,43.522,"Here is the test I want you to take away."],[43.642,48.492,"It is one question, and it works on every prompt you will ever write!"],[48.492,52.57,"For every adjective, ask: how would a camera capture this?"],[52.57,56.647,"If you cannot answer, the adjective is not an instruction."],[56.647,61.006,"Replace it with an action, a light position, or a composition."],[61.006,61.568,"Nervous."],[61.568,63.748,"How does a camera film nervous?"],[63.868,67.492,"He rubs his cuff repeatedly with his thumb."],[67.492,71.537,"His eyes move to the door three times, and back."],[71.537,71.875,"Sad."],[71.875,73.56,"She lowers her head."],[73.56,75.92,"Her eyelashes tremble twice."],[75.92,79.544,"One drop of water slides along her jawline."],[79.544,81.651,"An oppressive atmosphere."],[81.651,82.494,"Top light."],[82.494,85.275,"The eye sockets fall into shadow."],[85.275,88.647,"The edges of the frame are underexposed."],[88.767,91.123,"The subject does not move."],[91.123,92.573,"Premium quality."],[92.573,94.839,"This is the business one."],[94.839,96.561,"Soft lateral light."],[96.561,98.645,"Shallow depth of field."],[98.645,99.823,"Matte finish."],[99.823,101.183,"A slow push-in."],[101.183,103.992,"Empty space around the product."],[103.992,106.258,"Trustworthy and friendly."],[106.258,107.799,"Eye-level camera."],[107.799,109.521,"Frontal soft light."],[109.521,114.324,"The subject faces the camera, and does not move away."],[114.444,117.798,"Notice what happened in every single case!"],[117.798,123.548,"The adjective disappeared, and a physical, filmable fact took its place."],[123.548,126.343,"The camera now has something to do."],[126.343,132.413,"Let me rewrite our textile brief as a shooting script, and generate it once."],[132.413,133.371,"One attempt."],[133.371,134.489,"Correct angle."],[134.489,135.607,"Correct light."],[135.607,137.524,"The weave is consistent."],[137.644,139.033,"It is not perfect."],[139.033,140.5,"But it is directed."],[140.5,142.585,"And that is the difference."],[142.585,147.372,"Every part of it that is good, is good because I specified it."],[147.372,152.777,"And every part that is still wrong, I can now name… and therefore fix."],[152.777,155.556,"That is what a wish cannot give you."],[155.556,158.722,"A wish gives you no handle to debug with."],[158.722,159.803,"A script does!"],[159.923,165.233,"Second message of the day: a prompt is a shooting script… not a wish."]],"transcript":"So let us fix it! And the fix is not a magic word. It is a change in what kind of sentence you write. Most people write a wish. An elegant, high-quality textile product image with a warm, premium atmosphere. That is a wish. It describes the feeling you want the customer to have. The problem is that a camera cannot film elegant. A camera cannot film premium. Those words have no pixels! What the model needs is a shooting script… a description of what the camera sees, and what the camera does. Here is the test I want you to take away. It is one question, and it works on every prompt you will ever write! For every adjective, ask: how would a camera capture this? If you cannot answer, the adjective is not an instruction. Replace it with an action, a light position, or a composition. Nervous. How does a camera film nervous? He rubs his cuff repeatedly with his thumb. His eyes move to the door three times, and back. Sad. She lowers her head. Her eyelashes tremble twice. One drop of water slides along her jawline. An oppressive atmosphere. Top light. The eye sockets fall into shadow. The edges of the frame are underexposed. The subject does not move. Premium quality. This is the business one. Soft lateral light. Shallow depth of field. Matte finish. A slow push-in. Empty space around the product. Trustworthy and friendly. Eye-level camera. Frontal soft light. The subject faces the camera, and does not move away. Notice what happened in every single case! The adjective disappeared, and a physical, filmable fact took its place. The camera now has something to do. Let me rewrite our textile brief as a shooting script, and generate it once. One attempt. Correct angle. Correct light. The weave is consistent. It is not perfect. But it is directed. And that is the difference. Every part of it that is good, is good because I specified it. And every part that is still wrong, I can now name… and therefore fix. That is what a wish cannot give you. A wish gives you no handle to debug with. A script does! Second message of the day: a prompt is a shooting script… not a wish."},{"n":8,"title":"The Six-Element Formula","durationSec":153.41,"audio":"assets/audio/en/slide-08.m4a","image":"assets/slides/en/slide-08.png","cues":[[0.003,2.761,"Now I will give you the structure."],[2.761,3.815,"Six elements!"],[3.815,7.872,"This is the entire method… and it is transferable."],[7.872,11.36,"It does not belong to any one tool — and it"],[11.36,15.497,"will still be true when you change tools next year."],[15.497,16.551,"One: subject."],[16.551,18.823,"Who or what is in the frame?"],[18.823,22.392,"Age, appearance, clothing, material, finish."],[22.392,23.366,"Two: action."],[23.486,25.209,"What they are doing!"],[25.209,29.346,"A specific physical action… plus a speed adverb."],[29.346,30.638,"Three: setting."],[30.638,31.931,"Where and when?"],[31.931,35.292,"Place, time of day, weather, key props."],[35.292,37.188,"Four: camera movement."],[37.188,41.324,"How the virtual camera moves… The movement type,"],[41.324,46.667,"plus the shot size it starts on, and the shot size it ends on."],[46.667,47.701,"Five: style."],[47.701,48.477,"The look!"],[48.597,53.208,"Colour grade, contrast, film character, depth of field."],[53.208,54.13,"Six: audio."],[54.13,60.166,"What we hear… Ambient sound, effects, score — or deliberately, no score."],[60.166,64.107,"I could now tell you what to write in each box."],[64.107,67.712,"That is the least useful way to teach this!"],[67.832,70.85,"Instead I will tell you what happens when you"],[70.85,73.801,"leave each one out… because that is what you"],[73.801,76.953,"will actually recognise from your own attempts."],[76.953,81.984,"Leave out the subject, and the subject looks different in every generation."],[81.984,84.398,"You cannot build a campaign on that."],[84.518,89.7,"Leave out the action, and the frame is static… Or the movement is uncontrolled,"],[89.7,91.93,"and the model invents one for you."],[91.93,94.75,"Leave out the setting, and you get a random"],[94.75,97.899,"background that does not belong to your subject."],[98.019,103.905,"This is where the floating, placeless look comes from… Leave out camera movement,"],[103.905,106.23,"and you get a locked-off camera."],[106.23,106.593,"Flat."],[106.593,107.247,"Lifeless."],[107.247,111.099,"It looks like a security recording… of a nice object."],[111.099,114.514,"Leave out style, and you get the default grade."],[114.634,118.052,"And the default grade is the generic look that"],[118.052,123.328,"everybody can now recognise in under a second… and that reads as cheap!"],[123.328,126.078,"Leave out audio, and you get silence."],[126.078,129.645,"Or worse: sound that does not match the picture."],[129.645,134.103,"Elements four and five… are the ones almost everybody omits."],[134.223,139.228,"They are also the two that carry the most visual quality per word!"],[139.228,144.006,"So if you remember nothing else from this page — remember this:"],[144.006,147.115,"camera and style… are where the money is."],[147.115,153.409,"Now take the prompt that is still on your screen, and count the six elements in it!"]],"transcript":"Now I will give you the structure. Six elements! This is the entire method… and it is transferable. It does not belong to any one tool — and it will still be true when you change tools next year. One: subject. Who or what is in the frame? Age, appearance, clothing, material, finish. Two: action. What they are doing! A specific physical action… plus a speed adverb. Three: setting. Where and when? Place, time of day, weather, key props. Four: camera movement. How the virtual camera moves… The movement type, plus the shot size it starts on, and the shot size it ends on. Five: style. The look! Colour grade, contrast, film character, depth of field. Six: audio. What we hear… Ambient sound, effects, score — or deliberately, no score. I could now tell you what to write in each box. That is the least useful way to teach this! Instead I will tell you what happens when you leave each one out… because that is what you will actually recognise from your own attempts. Leave out the subject, and the subject looks different in every generation. You cannot build a campaign on that. Leave out the action, and the frame is static… Or the movement is uncontrolled, and the model invents one for you. Leave out the setting, and you get a random background that does not belong to your subject. This is where the floating, placeless look comes from… Leave out camera movement, and you get a locked-off camera. Flat. Lifeless. It looks like a security recording… of a nice object. Leave out style, and you get the default grade. And the default grade is the generic look that everybody can now recognise in under a second… and that reads as cheap! Leave out audio, and you get silence. Or worse: sound that does not match the picture. Elements four and five… are the ones almost everybody omits. They are also the two that carry the most visual quality per word! So if you remember nothing else from this page — remember this: camera and style… are where the money is. Now take the prompt that is still on your screen, and count the six elements in it!"},{"n":9,"title":"Elements One to Three: Subject, Action, Setting","durationSec":197.54,"audio":"assets/audio/en/slide-09.m4a","image":"assets/slides/en/slide-09.png","cues":[[0,3.175,"Let us take the first three elements into a"],[3.175,7.828,"real business case… because the details are where the money is."],[7.828,8.419,"Subject."],[8.419,9.453,"Not a textile."],[9.453,12.482,"Say what it is made of, how old it looks,"],[12.482,18.76,"what colour it actually is, what the finish is… and give the viewer a sense of scale."],[18.88,24.016,"A hand-woven wool blanket, undyed cream with two indigo stripes,"],[24.016,30.356,"visible irregular weave, folded once… roughly the size of an adult's arms full."],[30.356,33.085,"Now the business rule for subject."],[33.085,36.856,"It is the most important sentence on this page."],[36.856,43.517,"If the product must look exactly like the real object… do not describe it in words!"],[43.637,46.802,"Supply a real photograph as reference."],[46.802,49.468,"Words produce a similar product."],[49.468,52.133,"They never produce your product."],[52.133,57.547,"A described weave is a weave the model has seen somewhere before."],[57.547,59.213,"Your weave is yours."],[59.333,63.897,"So for anything that must match physical reality… the product,"],[63.897,70.45,"the packaging, the label, you upload a photograph, and you let the model condition on it."],[70.45,71.776,"Hold that thought."],[71.776,77.224,"Later in this session I will turn it into a formal rule with three levels."],[77.224,77.74,"Action."],[77.86,81.879,"Give a physical process, and give it a speed."],[81.879,83.576,"Not flowing fabric."],[83.576,91.616,"The blanket is lifted at one corner by a hand… and falls back slowly under its own weight."],[91.616,95.546,"Now the model knows what changes between the"],[95.546,100.012,"first frame and the last… and how fast it changes."],[100.012,100.727,"Setting."],[100.847,104.177,"Place, time of day, weather, and props."],[104.177,109.13,"And one warning: props are where cultural mistakes happen!"],[109.13,112.802,"If you set a scene in a market, a workshop,"],[112.802,118.096,"or a home… you are asserting facts about a place and a people."],[118.096,120.829,"Only assert what you can verify."],[120.829,125.696,"Here is the example I will keep returning to all session."],[125.816,128.275,"Listen to the density of it."],[128.275,132.754,"A fisherman in his sixties from the Brittany coast."],[132.754,134.686,"Short grey-white hair."],[134.686,136.443,"Dark oilskin jacket."],[136.443,139.428,"Hands marked with salt and cracks."],[139.428,142.327,"He slowly draws in a fishing net."],[142.327,145.488,"The rope slides between his fingers."],[145.488,148.825,"Water drips from the back of his hand."],[148.945,152.205,"Setting: a granite quay at five in the morning,"],[152.205,157.962,"thin mist not yet lifted… a lighthouse beam still sweeping the sea in the distance,"],[157.962,160.667,"cables and buoys scattered at his feet."],[160.667,163.858,"Camera: slow lateral track, from a medium shot"],[163.858,169.476,"to a close-up of the hands… ending on the point where the knuckles meet the rope."],[169.596,173.565,"Style: documentary cinema, cold grey-blue dominant,"],[173.565,176.445,"low colour-temperature morning light,"],[176.445,180.958,"shallow depth of field… thirty-five millimetre film grain."],[180.958,186.406,"Audio: low-frequency surf, the creak of a loaded cable, distant gulls."],[186.406,187.106,"No score."],[187.106,188.585,"Count the elements."],[188.585,189.986,"All six are there!"],[190.106,195.155,"That is why it works… and that is why it will still work in three years,"],[195.155,197.539,"on a tool that does not exist yet."]],"transcript":"Let us take the first three elements into a real business case… because the details are where the money is. Subject. Not a textile. Say what it is made of, how old it looks, what colour it actually is, what the finish is… and give the viewer a sense of scale. A hand-woven wool blanket, undyed cream with two indigo stripes, visible irregular weave, folded once… roughly the size of an adult's arms full. Now the business rule for subject. It is the most important sentence on this page. If the product must look exactly like the real object… do not describe it in words! Supply a real photograph as reference. Words produce a similar product. They never produce your product. A described weave is a weave the model has seen somewhere before. Your weave is yours. So for anything that must match physical reality… the product, the packaging, the label, you upload a photograph, and you let the model condition on it. Hold that thought. Later in this session I will turn it into a formal rule with three levels. Action. Give a physical process, and give it a speed. Not flowing fabric. The blanket is lifted at one corner by a hand… and falls back slowly under its own weight. Now the model knows what changes between the first frame and the last… and how fast it changes. Setting. Place, time of day, weather, and props. And one warning: props are where cultural mistakes happen! If you set a scene in a market, a workshop, or a home… you are asserting facts about a place and a people. Only assert what you can verify. Here is the example I will keep returning to all session. Listen to the density of it. A fisherman in his sixties from the Brittany coast. Short grey-white hair. Dark oilskin jacket. Hands marked with salt and cracks. He slowly draws in a fishing net. The rope slides between his fingers. Water drips from the back of his hand. Setting: a granite quay at five in the morning, thin mist not yet lifted… a lighthouse beam still sweeping the sea in the distance, cables and buoys scattered at his feet. Camera: slow lateral track, from a medium shot to a close-up of the hands… ending on the point where the knuckles meet the rope. Style: documentary cinema, cold grey-blue dominant, low colour-temperature morning light, shallow depth of field… thirty-five millimetre film grain. Audio: low-frequency surf, the creak of a loaded cable, distant gulls. No score. Count the elements. All six are there! That is why it works… and that is why it will still work in three years, on a tool that does not exist yet."},{"n":10,"title":"Elements Four to Six: Camera, Style, Audio","durationSec":184.39,"audio":"assets/audio/en/slide-10.m4a","image":"assets/slides/en/slide-10.png","cues":[[0,2.87,"Now the three elements people skip."],[2.87,4.183,"Camera movement."],[4.183,7.383,"I am not going to make you memorise ten"],[7.383,12.305,"movements in three minutes… they are on your reference card."],[12.305,17.555,"I will give you the two rules that prevent almost every failure."],[17.555,22.067,"Rule one: always write the start and the end shot size."],[22.067,24.282,"Dolly in is not executable."],[24.402,30.3,"It does not say where you begin or where you stop… so the model picks for you."],[30.3,36.122,"Push from a full shot of the workshop to a close-up of the hands at the loom."],[36.122,37.558,"That is executable!"],[37.558,39.978,"Rule two: one movement per shot."],[40.098,44.419,"When people stack three or four movements into a single prompt,"],[44.419,48.81,"the model executes the first one… or blurs all of them together."],[48.81,52.24,"If you want three movements, you want three shots."],[52.24,52.652,"Style."],[52.652,55.19,"This is where the generic look lives."],[55.19,57.797,"And the word cinematic is not a style."],[57.917,60.511,"It is a mood you have about a style."],[60.511,64.907,"The model cannot execute it, so it falls back on its default:"],[64.907,67.789,"over-smooth skin, over-saturated colour,"],[67.789,72.617,"contrast that is too high, no grain… and light coming from nowhere."],[72.617,78.094,"Everybody now recognises that look in under a second, and it reads as cheap."],[78.214,81.477,"So write style in four separate parts."],[81.477,84.998,"Colour temperature: warm, cold, or mixed."],[84.998,86.887,"Contrast: high or low."],[86.887,93.07,"Grain or texture: thirty-five millimetre grain, clean digital, or matte."],[93.07,96.762,"Depth of field: shallow, or deep and sharp."],[96.882,102.212,"Cold grey-blue dominant, low colour-temperature morning light,"],[102.212,107.198,"shallow depth of field… thirty-five millimetre film grain."],[107.198,108.574,"That is a style!"],[108.574,110.035,"It is executable."],[110.035,114.764,"And, more importantly for a business… it is repeatable."],[114.764,115.279,"Audio."],[115.279,119.75,"Almost everybody forgets audio on the first attempt."],[119.87,125.852,"Write it in three layers: ambient sound, specific effects, and score."],[125.852,131.487,"Or write no score, which is a legitimate and often better choice."],[131.487,137.123,"Silence with one real sound in it beats generic music every time."],[137.123,141.458,"And now one enterprise warning, before we move on."],[141.458,143.799,"Please write this one down!"],[143.919,148.974,"Image models render text, logos, and fine typography unreliably."],[148.974,150.791,"They get letters wrong."],[150.791,152.686,"They invent extra words."],[152.686,159.163,"They approximate a logo that is almost right… which is worse than obviously wrong!"],[159.163,165.482,"So: never let the model draw your logo, your packaging text, or your legal copy."],[165.482,167.14,"Generate the picture."],[167.26,173.369,"Then put real vector artwork and real type on top, in a normal design tool… afterwards."],[173.369,179.056,"This one habit will save you from most of the embarrassments in this entire area."],[179.056,184.393,"And it costs you nothing… because it is only a change in the order you work."]],"transcript":"Now the three elements people skip. Camera movement. I am not going to make you memorise ten movements in three minutes… they are on your reference card. I will give you the two rules that prevent almost every failure. Rule one: always write the start and the end shot size. Dolly in is not executable. It does not say where you begin or where you stop… so the model picks for you. Push from a full shot of the workshop to a close-up of the hands at the loom. That is executable! Rule two: one movement per shot. When people stack three or four movements into a single prompt, the model executes the first one… or blurs all of them together. If you want three movements, you want three shots. Style. This is where the generic look lives. And the word cinematic is not a style. It is a mood you have about a style. The model cannot execute it, so it falls back on its default: over-smooth skin, over-saturated colour, contrast that is too high, no grain… and light coming from nowhere. Everybody now recognises that look in under a second, and it reads as cheap. So write style in four separate parts. Colour temperature: warm, cold, or mixed. Contrast: high or low. Grain or texture: thirty-five millimetre grain, clean digital, or matte. Depth of field: shallow, or deep and sharp. Cold grey-blue dominant, low colour-temperature morning light, shallow depth of field… thirty-five millimetre film grain. That is a style! It is executable. And, more importantly for a business… it is repeatable. Audio. Almost everybody forgets audio on the first attempt. Write it in three layers: ambient sound, specific effects, and score. Or write no score, which is a legitimate and often better choice. Silence with one real sound in it beats generic music every time. And now one enterprise warning, before we move on. Please write this one down! Image models render text, logos, and fine typography unreliably. They get letters wrong. They invent extra words. They approximate a logo that is almost right… which is worse than obviously wrong! So: never let the model draw your logo, your packaging text, or your legal copy. Generate the picture. Then put real vector artwork and real type on top, in a normal design tool… afterwards. This one habit will save you from most of the embarrassments in this entire area. And it costs you nothing… because it is only a change in the order you work."},{"n":11,"title":"Three Fidelity Tiers","durationSec":158.93,"audio":"assets/audio/en/slide-11.m4a","image":"assets/slides/en/slide-11.png","cues":[[0.003,4.737,"This is the most important page of the session for a business."],[4.737,9.472,"If you forget the six elements, you will make an ugly picture."],[9.472,13.672,"If you forget this… you will make an expensive mistake!"],[13.672,17.49,"Not every image has to be true to the same degree."],[17.61,23.324,"So before you write a single prompt, sort the asset into one of three tiers."],[23.324,25.805,"Tier one: must be literally true."],[25.805,27.234,"The product itself."],[27.234,28.287,"The packaging."],[28.287,29.039,"The label."],[29.039,30.542,"The ingredient list."],[30.542,32.648,"The face of a real employee."],[32.648,39.415,"Anything a customer could reasonably rely on… or compare against what arrives in the post."],[39.535,44.457,"The tier one rule: use real photography as your reference,"],[44.457,48.275,"generate as little as you can, and verify the"],[48.275,53.197,"output against the physical object before it is published."],[53.197,55.148,"Tier two: illustrative."],[55.148,56.591,"Lifestyle scenes."],[56.591,57.015,"Mood."],[57.015,58.033,"Backgrounds."],[58.033,58.797,"Concepts."],[58.797,63.464,"A hand holding a cup, a street, a landscape, a texture."],[63.584,69.096,"Nothing in a tier two asset makes a factual claim about your product."],[69.096,71.892,"The tier two rule: generate freely!"],[71.892,78.921,"This is where the productivity gain actually lives… and most of your volume is tier two."],[78.921,81.397,"Tier three: a fictional person."],[81.397,84.113,"A spokesperson who does not exist."],[84.113,87.867,"A customer in your video who is not a customer."],[87.987,93.129,"The tier three rule: consent and disclosure obligations apply."],[93.129,95.949,"We come to them in twenty minutes."],[95.949,97.525,"Look at the screen."],[97.525,102.169,"On the left is the catalogue image we generated earlier."],[102.169,106.233,"On the right is a photograph of the real product."],[106.233,107.145,"Same weave?"],[107.145,107.394,"No."],[107.394,109.633,"Same colour under daylight?"],[109.633,110.13,"Close."],[110.13,111.209,"Not the same."],[111.329,112.442,"Same dimensions?"],[112.442,113.486,"We cannot tell."],[113.486,117.313,"And neither can the customer… until the parcel arrives."],[117.313,119.053,"This is a tier one asset."],[119.053,122.254,"And what you have just seen is the single most"],[122.254,126.429,"common way a small business harms itself with generative AI:"],[126.429,129.909,"it treats a tier one asset as if it were tier two."],[129.909,131.718,"The image looks beautiful."],[131.838,134.764,"The customer receives something different."],[134.764,136.993,"That is not a technical problem."],[136.993,139.64,"That is a consumer protection problem."],[139.64,143.123,"And in most jurisdictions, it is also a legal one."],[143.123,149.183,"The whole discipline is one question, asked before you start: which tier is this asset?"],[149.303,156.82,"The answer changes your workflow, your budget, your review step, and your legal exposure."],[156.82,158.931,"Ask it first… every time."]],"transcript":"This is the most important page of the session for a business. If you forget the six elements, you will make an ugly picture. If you forget this… you will make an expensive mistake! Not every image has to be true to the same degree. So before you write a single prompt, sort the asset into one of three tiers. Tier one: must be literally true. The product itself. The packaging. The label. The ingredient list. The face of a real employee. Anything a customer could reasonably rely on… or compare against what arrives in the post. The tier one rule: use real photography as your reference, generate as little as you can, and verify the output against the physical object before it is published. Tier two: illustrative. Lifestyle scenes. Mood. Backgrounds. Concepts. A hand holding a cup, a street, a landscape, a texture. Nothing in a tier two asset makes a factual claim about your product. The tier two rule: generate freely! This is where the productivity gain actually lives… and most of your volume is tier two. Tier three: a fictional person. A spokesperson who does not exist. A customer in your video who is not a customer. The tier three rule: consent and disclosure obligations apply. We come to them in twenty minutes. Look at the screen. On the left is the catalogue image we generated earlier. On the right is a photograph of the real product. Same weave? No. Same colour under daylight? Close. Not the same. Same dimensions? We cannot tell. And neither can the customer… until the parcel arrives. This is a tier one asset. And what you have just seen is the single most common way a small business harms itself with generative AI: it treats a tier one asset as if it were tier two. The image looks beautiful. The customer receives something different. That is not a technical problem. That is a consumer protection problem. And in most jurisdictions, it is also a legal one. The whole discipline is one question, asked before you start: which tier is this asset? The answer changes your workflow, your budget, your review step, and your legal exposure. Ask it first… every time."},{"n":12,"title":"Light: Direction, Quality, and Colour","durationSec":130.72,"audio":"assets/audio/en/slide-12.m4a","image":"assets/slides/en/slide-12.png","cues":[[0.001,5.802,"Two minutes on light, because it is the cheapest quality you can buy with words!"],[5.802,7.252,"Light has direction."],[7.252,11.167,"Frontal light gives clear detail… and almost no depth."],[11.167,14.285,"It is flat, and it suits a product display."],[14.285,17.62,"Lateral light gives half light and half shade…"],[17.62,21.028,"and that is where texture and volume come from!"],[21.148,25.879,"This is your craftsmanship shot, your material close-up."],[25.879,29.258,"Backlight separates the subject from the"],[29.258,34.326,"background with a bright outline… and underexposes the face."],[34.326,40.239,"It belongs in an aspirational brand film, usually as the closing shot."],[40.239,46.068,"Top light drops the eye sockets into shadow… and reads as oppressive."],[46.188,51.178,"Under-lighting looks wrong to every human eye on earth!"],[51.178,55.079,"Avoid both in marketing unless you mean it."],[55.079,56.711,"Light has quality."],[56.711,61.792,"Hard light: sharp shadow edges, high contrast… dramatic."],[61.792,65.511,"Soft light: graduated shadows, forgiving,"],[65.511,70.047,"and the right default for people and for products."],[70.167,76.678,"And volumetric light: visible beams… where the air itself carries mist, dust, or smoke!"],[76.678,78.998,"Let me give you a trade secret."]
